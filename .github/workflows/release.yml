name: Build Release

# Manual only. Without `publish` this is a dry run: the package is built and
# uploaded as a workflow artifact, and nothing is tagged, released or
# announced -- so a change to this workflow can be tried without shipping.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub Release and rebuild the VPM listing. Leave unchecked to only build and upload the artifacts (dry run)."
        type: boolean
        default: false

env:
  packageName: "com.vhub.kawaplayer"

permissions:
  contents: write

# One run at a time, none cancelled. Two publishes of the same version
# started together would both pass the existing-tag check below before
# either had made the tag; queued, the second one finds it and stops.
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          version=$(jq -r '.version // empty' package.json)
          if [ -z "$version" ]; then
            echo "::error::package.json has no \"version\" field"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A published version must never be replaced (projects under source
      # control break), and the release checklist builds from develop.
      - name: Refuse to publish from another branch or over an existing tag
        if: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::publish only from develop (got $GITHUB_REF)"
            exit 1
          fi
          # --exit-code makes "no such ref" exit 2. Anything else that is not 0
          # means the remote could not be asked, and not knowing is not the
          # same as knowing the tag is free -- stop rather than publish blind.
          tag="refs/tags/${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null; then status=0; else status=$?; fi
          case "$status" in
            2) echo "tag ${{ steps.version.outputs.version }} does not exist yet" ;;
            0) echo "::error::tag ${{ steps.version.outputs.version }} already exists; bump package.json first"; exit 1 ;;
            *) echo "::error::could not check remote tags (git ls-remote exit $status)"; exit 1 ;;
          esac

      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ env.packageName }}-${{ steps.version.outputs.version }}.zip" >> "$GITHUB_ENV"
          echo "unityPackage=${{ env.packageName }}-${{ steps.version.outputs.version }}.unitypackage" >> "$GITHUB_ENV"

      - name: Make Package Folder
        run: |
          mkdir Packages
          mkdir Packages/${{ env.packageName }}
          ls | grep -v Packages | xargs mv -t Packages/${{ env.packageName }}

      - name: Create Zip
        uses: thedoctor0/zip-release@09336613be18a8208dfa66bd57efafd9e2685657
        with:
          type: "zip"
          directory: "Packages/${{ env.packageName }}/"
          filename: "../../${{env.zipFile}}"
          exclusions: ".git*"

      - name: Track Package Meta Files
        run: find "Packages/${{ env.packageName }}/" -name \*.meta | LC_ALL=C sort > metaList

      - name: Create UnityPackage
        run: bash .github/scripts/create-unitypackage.sh "${{ env.unityPackage }}" metaList

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.packageName }}-${{ steps.version.outputs.version }}
          path: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            Packages/${{ env.packageName }}/package.json
          if-no-files-found: error
          compression-level: 0

      - name: Make Release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') }}
          # Second line of defence behind the tag check: a release that
          # already has these files keeps them.
          overwrite_files: false
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            Packages/${{ env.packageName }}/package.json

      - name: Build Listing
        if: ${{ inputs.publish }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: Mega-Gorilla/vpm-repos
          event-type: build-listing
