name: Check upstream YamaPlayer

on:
  schedule:
    # 毎月1日 12:00 JST (03:00 UTC)
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM_REPO: https://github.com/koorimizuw/YamaPlayer.git
  UPSTREAM_BRANCH: develop
  TRACKING_ISSUE: 66
  # 確認済み (取り込み or 見送り判断済み) の upstream SHA を記録するファイル。
  # 同期作業の PR でこのファイルを更新すること。cherry-pick で一部コミットを
  # 見送っても、このファイルの SHA 以降だけが「未確認」として報告される。
  BASE_FILE: .github/UPSTREAM_BASE

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Comment on tracking issue if new commits exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$BASE_FILE" ]; then
            BASE=$(head -1 "$BASE_FILE" | tr -d '[:space:]')
          else
            echo "::warning::$BASE_FILE not found; falling back to merge-base."
            BASE=$(git merge-base HEAD "upstream/$UPSTREAM_BRANCH")
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::error::Invalid SHA in $BASE_FILE: $BASE"
            exit 1
          fi

          COUNT=$(git rev-list --count "$BASE..upstream/$UPSTREAM_BRANCH")
          if [ "$COUNT" -eq 0 ]; then
            echo "No unreviewed upstream commits since $BASE."
            exit 0
          fi

          HEAD_HASH=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")

          # 前回の自動コメントと upstream HEAD が同じなら重複コメントを避ける
          LAST_MARK=$(gh issue view "$TRACKING_ISSUE" --repo "${{ github.repository }}" --json comments \
            --jq '[.comments[].body | capture("<!-- upstream-head: (?<h>[0-9a-f]+) -->")? | .h] | last // empty')
          if [ "$LAST_MARK" = "$HEAD_HASH" ]; then
            echo "Already reported up to $HEAD_HASH."
            exit 0
          fi

          {
            echo "<!-- upstream-head: $HEAD_HASH -->"
            echo "🤖 **自動チェック**: 確認済み SHA (\`${BASE:0:7}\`) 以降、upstream \`$UPSTREAM_BRANCH\` に未確認コミットが **$COUNT 件** あります ($(date -u +%Y-%m-%d) 時点)。"
            echo ""
            git log --reverse --date=short \
              --format="- [\`%h\`](https://github.com/koorimizuw/YamaPlayer/commit/%H) %ad %s" \
              "$BASE..upstream/$UPSTREAM_BRANCH"
            echo ""
            echo "> 取り込み or 見送りの判断が済んだら \`.github/UPSTREAM_BASE\` を確認済み SHA に更新してください。"
          } > comment.md

          gh issue comment "$TRACKING_ISSUE" --repo "${{ github.repository }}" --body-file comment.md
