<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="t d"><title id="t">今と、組み直したあと</title><desc id="d">今は、エディターで選んだときだけ参照を書き、ビルドはデバイスごとに配線して権限の部品をUIごとに写し、実行時はUIごとに確かめて本体を直接呼ぶ。組み直したあとは、置くときにプレイヤーを自動で選び、ビルドのデバイスの処理が窓口の参照をそろえ、実行時の操作は窓口が判断・振り分け・実行して結果を返し、表示はデバイスが決める。値の読み方と出来事の受け方は今のまま。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="430" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">今と、組み直したあと</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">エディターとビルドに加えて、実行時の操作の道が変わる。値の読み方と出来事の受け方は今のまま</text><text x="255.0" y="82.0" class="t1 f13 b" text-anchor="middle">エディター</text><text x="477.0" y="82.0" class="t1 f13 b" text-anchor="middle">ビルド</text><text x="699.0" y="82.0" class="t1 f13 b" text-anchor="middle">実行時</text><rect class="box" x="24" y="96" width="114" height="130" rx="6"/><text x="81.0" y="165.0" class="t1 f13" text-anchor="middle">今</text><rect class="box" x="150" y="96" width="210" height="130" rx="6"/><text x="255.0" y="144.0" class="t1 f12" text-anchor="middle">選んだときだけ、Sub Controller が</text><text x="255.0" y="165.0" class="t1 f12" text-anchor="middle">下の部品の _controller に書く</text><text x="255.0" y="186.0" class="t1 f12" text-anchor="middle">タブレットの欄も共通の所にある</text><path class="arr" d="M361.0,161.0 L371.0,161.0" marker-end="url(#h)"/><rect class="box" x="372" y="96" width="210" height="130" rx="6"/><text x="477.0" y="144.0" class="t1 f12" text-anchor="middle">デバイスごとの処理が配線する</text><text x="477.0" y="165.0" class="t1 f12" text-anchor="middle">選んだ値と合うかは確かめない</text><text x="477.0" y="186.0" class="t1 f12" text-anchor="middle">権限の部品を UI ごとに写す</text><path class="arr" d="M583.0,161.0 L593.0,161.0" marker-end="url(#h)"/><rect class="box" x="594" y="96" width="210" height="130" rx="6"/><text x="699.0" y="144.0" class="t1 f12" text-anchor="middle">UI ごとに確かめて、</text><text x="699.0" y="165.0" class="t1 f12" text-anchor="middle">本体を直接呼ぶ</text><text x="699.0" y="186.0" class="t1 f12" text-anchor="middle">写す場所の無い UI は権限なし</text><rect class="go" x="24" y="246" width="114" height="130" rx="6"/><text x="81.0" y="315.0" class="t1 f13" text-anchor="middle">組み直したあと</text><rect class="go" x="150" y="246" width="210" height="130" rx="6"/><text x="255.0" y="294.0" class="t1 f12" text-anchor="middle">置くときにプレイヤーを自動で選ぶ</text><text x="255.0" y="315.0" class="t1 f12" text-anchor="middle">デバイスの設定は、デバイスの</text><text x="255.0" y="336.0" class="t1 f12" text-anchor="middle">区画として描く（D7・D8）</text><path class="arr" d="M361.0,311.0 L371.0,311.0" marker-end="url(#h)"/><rect class="go" x="372" y="246" width="210" height="130" rx="6"/><text x="477.0" y="294.0" class="t1 f12" text-anchor="middle">デバイスの処理が、正の値から</text><text x="477.0" y="315.0" class="t1 f12" text-anchor="middle">窓口の参照をそろえる（D5・D6）</text><text x="477.0" y="336.0" class="t1 f12" text-anchor="middle">モジュールの UI は名前の印に（D10）</text><path class="arr" d="M583.0,311.0 L593.0,311.0" marker-end="url(#h)"/><rect class="go" x="594" y="246" width="210" height="130" rx="6"/><text x="699.0" y="294.0" class="t1 f12" text-anchor="middle">操作は窓口：判断→振り分け→実行</text><text x="699.0" y="315.0" class="t1 f12" text-anchor="middle">結果を返し、表示はデバイス（D1・D2）</text><text x="699.0" y="336.0" class="t1 f12" text-anchor="middle">読む・出来事は本体から（今のまま）</text><text x="24.0" y="410.0" class="t2 f12" text-anchor="start">変えないもの：値の読み方と出来事の受け方、中の処理（自動再生など）の呼び方、同期のしかた。</text></svg>
