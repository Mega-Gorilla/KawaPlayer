<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="t d"><title id="t">命令と権限</title><desc id="d">KawaPlayerでは、ボタンを押すとUIControllerがBeforeUserXxxを送り、PermissionManagementUIが中止しなければControllerを呼ぶ。VVMWでは、外の権限の仕組みが_OnUnlockと_Lockを送り、FrontendHandlerがロック中は5つの命令を断り、UIHandlerはURL欄などを押せなくする。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="470" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">命令と権限</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">KawaPlayer は UI が操作の前に聞く。VVMW は受ける側が 5 つの命令を断り、ほかは UI が押せなくする</text><rect class="grp" x="24" y="70" width="772" height="176" rx="8"/><text x="38.0" y="92.0" class="t1 f13 b" text-anchor="start">KawaPlayer</text><rect class="box" x="44" y="112" width="120" height="50" rx="6"/><text x="104.0" y="141.0" class="t1 f12" text-anchor="middle">ボタン</text><rect class="box" x="196" y="112" width="160" height="50" rx="6"/><text x="276.0" y="132.5" class="t1 f12" text-anchor="middle">UIController</text><text x="276.0" y="149.5" class="t2 mono" text-anchor="middle">InvokeBeforeEvent</text><rect class="ask" x="392" y="100" width="200" height="74" rx="6"/><text x="492.0" y="125.0" class="t1 f12" text-anchor="middle">PermissionManagementUI</text><text x="492.0" y="141.0" class="t2 f11" text-anchor="middle">権限が足りなければ</text><text x="492.0" y="157.0" class="t2 mono" text-anchor="middle">CancelCurrentAction()</text><rect class="go" x="630" y="112" width="146" height="50" rx="6"/><text x="703.0" y="132.5" class="t1 f12" text-anchor="middle">Controller</text><text x="703.0" y="149.5" class="t2 mono" text-anchor="middle">Pause() など</text><path class="arr" d="M164.0,137.0 L196.0,137.0" marker-end="url(#h)"/><path class="arr" d="M356.0,126.0 L392.0,126.0" marker-end="url(#h)"/><text x="374.0" y="94.0" class="t2 f12" text-anchor="middle">BeforeUserXxx</text><path class="arr1" d="M276.0,162.0 L276.0,198.0 L703.0,198.0 L703.0,164.0" marker-end="url(#h1)"/><text x="490.0" y="192.0" class="t2 f12" text-anchor="middle">中止されなければ</text><text x="44.0" y="228.0" class="ts2 f12" text-anchor="start">Controller を直接呼べば、権限を通らない。権限（PermissionManagement）は全員で共有する。</text><rect class="grp" x="24" y="262" width="772" height="186" rx="8"/><text x="38.0" y="284.0" class="t1 f13 b" text-anchor="start">VizVid</text><rect class="box" x="44" y="300" width="140" height="56" rx="6"/><text x="114.0" y="323.0" class="t1 f12" text-anchor="middle">外の権限の</text><text x="114.0" y="341.0" class="t1 f12" text-anchor="middle">仕組み</text><rect class="ask" x="230" y="292" width="196" height="72" rx="6"/><text x="328.0" y="315.0" class="t1 f12" text-anchor="middle">FrontendHandler</text><text x="328.0" y="332.0" class="t2 f11" text-anchor="middle">locked（見る人ごと）</text><text x="328.0" y="349.0" class="t2 f11" text-anchor="middle">_Play など 5 つは断る</text><rect class="box" x="470" y="300" width="160" height="56" rx="6"/><text x="550.0" y="317.0" class="t1 f12" text-anchor="middle">UIHandler</text><text x="550.0" y="332.0" class="t2 f11" text-anchor="middle">Locked を見て</text><text x="550.0" y="347.0" class="t2 f11" text-anchor="middle">URL 欄などを止める</text><rect class="go" x="670" y="300" width="106" height="56" rx="6"/><text x="723.0" y="332.0" class="t1 f12" text-anchor="middle">Core</text><path class="arr" d="M184.0,328.0 L230.0,328.0" marker-end="url(#h)"/><text x="207.0" y="290.0" class="t2 mono" text-anchor="middle">_OnUnlock</text><text x="207.0" y="376.0" class="t2 mono" text-anchor="middle">_Lock</text><path class="arr1" d="M470.0,316.0 L428.0,316.0" marker-end="url(#h1)"/><text x="449.0" y="310.0" class="t2 f12" text-anchor="middle">_Play</text><path class="arr2" d="M426.0,344.0 L470.0,344.0" marker-end="url(#h2)"/><path class="arr1" d="M328.0,364.0 L328.0,400.0 L723.0,400.0 L723.0,358.0" marker-end="url(#h1)"/><text x="526.0" y="394.0" class="t2 f12" text-anchor="middle">locked でなければ</text><text x="44.0" y="432.0" class="ts2 f12" text-anchor="start">PlayUrl・PlayAt（リストの選択）は受ける側で確かめず、UI が押せなくするだけ。</text></svg>
