<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="t d"><title id="t">デバイスの処理（ビルド、新）の流れ</title><desc id="d">デバイスの根元のYamaPlayerが選ばれていなければ、デバイスを外してログに出す。選ばれていれば、下のUIControllerの窓口の欄、YamaPlayerScreen、YamaPlayerSpeakerの参照がそのプレイヤーかを見て、違えば書き直してログに出す。そのあと、モジュールの処理などに渡す。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="440" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">デバイスの処理（ビルド、新）の流れ</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">モジュールの処理より前に、デバイスごとに 1 回動く。下の参照を正の値（選んだプレイヤー）にそろえてから、ほかの処理に渡す</text><rect class="box" x="24" y="90" width="170" height="56" rx="6"/><text x="109.0" y="113.0" class="t1 f12" text-anchor="middle">デバイスの根元</text><text x="109.0" y="131.0" class="t2 mono" text-anchor="middle">YamaPlayerSubController</text><rect class="ask" x="234" y="84" width="190" height="68" rx="6"/><text x="329.0" y="112.0" class="t1 f12" text-anchor="middle">YamaPlayer は</text><text x="329.0" y="132.0" class="t1 f12" text-anchor="middle">選ばれているか？</text><rect class="ask" x="464" y="84" width="190" height="68" rx="6"/><text x="559.0" y="112.0" class="t1 f12" text-anchor="middle">下の部品の参照は、</text><text x="559.0" y="132.0" class="t1 f12" text-anchor="middle">そのプレイヤーか？</text><rect class="hot" x="234" y="230" width="190" height="72" rx="6"/><text x="329.0" y="252.0" class="t1 f12" text-anchor="middle">デバイスを外す</text><text x="329.0" y="270.0" class="t2 f11" text-anchor="middle">EditorOnly にして</text><text x="329.0" y="288.0" class="t2 f11" text-anchor="middle">ログに出す（D6）</text><rect class="go" x="464" y="230" width="190" height="72" rx="6"/><text x="559.0" y="252.0" class="t1 f12" text-anchor="middle">書き直す</text><text x="559.0" y="270.0" class="t2 f11" text-anchor="middle">違っていた部品を</text><text x="559.0" y="288.0" class="t2 f11" text-anchor="middle">ログに出す（D5）</text><rect class="box" x="640" y="336" width="156" height="64" rx="6"/><text x="718.0" y="363.0" class="t1 f12" text-anchor="middle">モジュールの処理</text><text x="718.0" y="381.0" class="t2 f11" text-anchor="middle">（-3000）ほか</text><path class="arr" d="M194.0,118.0 L234.0,118.0" marker-end="url(#h)"/><path class="arr" d="M424.0,118.0 L464.0,118.0" marker-end="url(#h)"/><text x="444.0" y="110.0" class="t2 f12" text-anchor="middle">はい</text><path class="arr" d="M329.0,152.0 L329.0,230.0" marker-end="url(#h)"/><text x="337.0" y="196.0" class="t2 f12" text-anchor="start">いいえ</text><path class="arr" d="M559.0,152.0 L559.0,230.0" marker-end="url(#h)"/><text x="567.0" y="196.0" class="t2 f12" text-anchor="start">いいえ</text><path class="arr" d="M654.0,118.0 L718.0,118.0 L718.0,336.0" marker-end="url(#h)"/><text x="686.0" y="110.0" class="t2 f12" text-anchor="middle">はい</text><path class="arr" d="M559.0,302.0 L559.0,368.0 L640.0,368.0" marker-end="url(#h)"/><text x="24.0" y="336.0" class="t2 f12 b" text-anchor="start">下の部品：</text><text x="24.0" y="356.0" class="t1 f12" text-anchor="start">UIController の窓口の欄</text><text x="24.0" y="374.0" class="t1 mono" text-anchor="start">YamaPlayerScreen.controller</text><text x="24.0" y="392.0" class="t1 mono" text-anchor="start">YamaPlayerSpeaker.controller</text><text x="24.0" y="424.0" class="t2 f12" text-anchor="start">本体（KawaPlayer.prefab）の ScreenUI は、YamaPlayer の下にあるので、同じ決まりでそのプレイヤーにそろえる。</text></svg>
