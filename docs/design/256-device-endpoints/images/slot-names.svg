<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="t d"><title id="t">UIの差し込み先：パスと名前の印</title><desc id="d">今は、モジュールのuiSlotsがUIの階層のパスを持ち、transform.Findで探すので、UIの作りを変えると黙って外れる。整理したあとは、UIのプレハブに名前の印を置き、モジュールは名前で写す先を指し、どこにも無ければログに出す。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="420" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">UI の差し込み先：パスと名前の印</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">今はモジュールが UI の階層のパスを知っている。整理したあとは、UI が名前の印を置き、モジュールは名前だけを知る</text><rect class="grp" x="24" y="70" width="772" height="150" rx="8"/><text x="38.0" y="92.0" class="t1 f13 b" text-anchor="start">今：パスで写す</text><rect class="box" x="44" y="112" width="236" height="80" rx="6"/><text x="162.0" y="137.0" class="t1 f12" text-anchor="middle">モジュールの uiSlots</text><text x="162.0" y="156.0" class="t2 mono" text-anchor="middle">Canvas/User/Main/Pages/</text><text x="162.0" y="175.0" class="t2 mono" text-anchor="middle">Settings/PageView</text><rect class="ask" x="320" y="112" width="180" height="80" rx="6"/><text x="410.0" y="146.0" class="t1 f12" text-anchor="middle">transform.Find</text><text x="410.0" y="166.0" class="t2 mono" text-anchor="middle">(targetPath)</text><rect class="hot" x="540" y="112" width="236" height="80" rx="6"/><text x="658.0" y="137.0" class="t1 f12" text-anchor="middle">UI の階層</text><text x="658.0" y="156.0" class="ts2 f11" text-anchor="middle">作りを変えると外れる</text><text x="658.0" y="175.0" class="ts2 f11" text-anchor="middle">見つからなければ黙って飛ばす</text><path class="arr" d="M280.0,152.0 L320.0,152.0" marker-end="url(#h)"/><path class="arr" d="M500.0,152.0 L540.0,152.0" marker-end="url(#h)"/><rect class="grp" x="24" y="236" width="772" height="150" rx="8"/><text x="38.0" y="258.0" class="t1 f13 b" text-anchor="start">整理したあと：名前で写す（D6）</text><rect class="box" x="44" y="278" width="236" height="80" rx="6"/><text x="162.0" y="303.0" class="t1 f12" text-anchor="middle">モジュールの uiSlots</text><text x="162.0" y="322.0" class="t2 mono" text-anchor="middle">名前：Settings.Video</text><text x="162.0" y="341.0" class="t2 f11" text-anchor="middle">（パスは知らない）</text><rect class="ask" x="320" y="278" width="180" height="80" rx="6"/><text x="410.0" y="312.0" class="t1 f12" text-anchor="middle">名前の印を探す</text><text x="410.0" y="332.0" class="t2 f11" text-anchor="middle">同じ名前の印の下に写す</text><rect class="go" x="540" y="278" width="236" height="80" rx="6"/><text x="658.0" y="303.0" class="t1 f12" text-anchor="middle">UI のプレハブ</text><text x="658.0" y="322.0" class="t2 mono" text-anchor="middle">印：Settings.Video</text><text x="658.0" y="341.0" class="ts1 f11" text-anchor="middle">どこにも無ければログに出す</text><path class="arr" d="M280.0,318.0 L320.0,318.0" marker-end="url(#h)"/><path class="arr" d="M500.0,318.0 L540.0,318.0" marker-end="url(#h)"/><text x="24.0" y="406.0" class="t2 f12" text-anchor="start">印は U# でない部品で、ビルドで消える。デバイスは、受け付ける差し込み先に印を置けばよい。</text></svg>
