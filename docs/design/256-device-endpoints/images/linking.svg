<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="t d"><title id="t">つなぐ相手が決まるまで</title><desc id="d">KawaPlayerは、エディターでSub Controllerが_controllerを書き、ビルド処理がそれを手がかりに配線し、実行時にStartで登録する。VVMWは、エディターでLocatableがいちばん近いCoreを探し、ビルドでResolveとBindUdonSharpEventが参照と配り先を埋め、実行時はSendEventが名前ごとの配り先に配る。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="430" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">つなぐ相手が決まるまで</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">KawaPlayer はインスペクターが書いた値をビルドが手がかりにする。VVMW は部品の欄の属性を、ビルドが読んで埋める</text><text x="255.0" y="82.0" class="t1 f13 b" text-anchor="middle">エディター</text><text x="477.0" y="82.0" class="t1 f13 b" text-anchor="middle">ビルド（Play も）</text><text x="699.0" y="82.0" class="t1 f13 b" text-anchor="middle">実行時</text><rect class="box" x="24" y="96" width="114" height="130" rx="6"/><text x="81.0" y="165.0" class="t1 f13" text-anchor="middle">KawaPlayer</text><rect class="box" x="150" y="96" width="210" height="130" rx="6"/><text x="255.0" y="145.0" class="t1 f12" text-anchor="middle">Sub Controller で選ぶと、</text><text x="255.0" y="165.0" class="t1 f12" text-anchor="middle">下の部品の _controller に書く</text><text x="255.0" y="185.0" class="ts2 f11" text-anchor="middle">正の値はここで書かれる</text><path class="arr" d="M361.0,161.0 L371.0,161.0" marker-end="url(#h)"/><rect class="box" x="372" y="96" width="210" height="130" rx="6"/><text x="477.0" y="135.0" class="t1 f12" text-anchor="middle">ビルド処理が _controller を</text><text x="477.0" y="155.0" class="t1 f12" text-anchor="middle">手がかりに、モジュール・</text><text x="477.0" y="175.0" class="t1 f12" text-anchor="middle">ボタン・URL 欄を配線</text><text x="477.0" y="195.0" class="ts2 f11" text-anchor="middle">選んだ値と合うかは確かめない</text><path class="arr" d="M583.0,161.0 L593.0,161.0" marker-end="url(#h)"/><rect class="box" x="594" y="96" width="210" height="130" rx="6"/><text x="699.0" y="145.0" class="t1 f12" text-anchor="middle">Start で AddListener</text><text x="699.0" y="165.0" class="t1 f12" text-anchor="middle">（Controller・UIController）</text><text x="699.0" y="185.0" class="t2 f11" text-anchor="middle">外す口は無い</text><rect class="go" x="24" y="246" width="114" height="130" rx="6"/><text x="81.0" y="315.0" class="t1 f13" text-anchor="middle">VizVid</text><rect class="box" x="150" y="246" width="210" height="130" rx="6"/><text x="255.0" y="295.0" class="t1 f12" text-anchor="middle">[Locatable]：いちばん近い</text><text x="255.0" y="315.0" class="t1 f12" text-anchor="middle">Core を探して欄に入れる</text><text x="255.0" y="335.0" class="ts1 f11" text-anchor="middle">正の値は部品の欄</text><path class="arr" d="M361.0,311.0 L371.0,311.0" marker-end="url(#h)"/><rect class="box" x="372" y="246" width="210" height="130" rx="6"/><text x="477.0" y="295.0" class="t1 f12" text-anchor="middle">[Resolve]：handler.core を埋める</text><text x="477.0" y="315.0" class="t1 f12" text-anchor="middle">[BindUdonSharpEvent]：</text><text x="477.0" y="335.0" class="t1 f12" text-anchor="middle">配り先に自分を足す（名前ごと）</text><path class="arr" d="M583.0,311.0 L593.0,311.0" marker-end="url(#h)"/><rect class="box" x="594" y="246" width="210" height="130" rx="6"/><text x="699.0" y="295.0" class="t1 f12" text-anchor="middle">SendEvent(名前) が</text><text x="699.0" y="315.0" class="t1 f12" text-anchor="middle">namedTargets に配る</text><text x="699.0" y="335.0" class="t2 f11" text-anchor="middle">実行時の登録はほぼ無い</text><text x="24.0" y="410.0" class="t2 f12" text-anchor="start">VVMW の値は付録 B で確かめた：UIHandler.core はエディターでは空で、Play の前処理で handler.core から埋まった。</text></svg>
