<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="t d"><title id="t">整理したあとのつなぎ方（案）</title><desc id="d">デバイスの根元のYamaPlayerを正の値とし、ビルドのデバイスの処理が下のUIController、Screen、Speakerの参照を書き直し、食い違いをログに出し、未設定のデバイスを外す。デバイスの区画とビルド処理はデバイスの側に置く。モジュールのUIは名前の差し込み先に写し、名前のイベントは定数の一覧にまとめる。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="470" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">整理したあとのつなぎ方（案）</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">どのプレイヤーに従うかはデバイスの根元の 1 か所。ビルドがそこから参照を書き直す。デバイスのことはデバイスの側に置く</text><rect class="grp" x="24" y="70" width="270" height="236" rx="8"/><text x="38.0" y="92.0" class="t1 f13 b" text-anchor="start">デバイス</text><text x="38.0" y="110.0" class="t2 f11" text-anchor="start">根元に YamaPlayerSubController</text><rect class="go" x="44" y="120" width="230" height="50" rx="6"/><text x="159.0" y="140.5" class="t1 f12" text-anchor="middle">YamaPlayer（正の値）</text><text x="159.0" y="157.5" class="t2 f11" text-anchor="middle">どのプレイヤーに従うか</text><rect class="box" x="44" y="186" width="230" height="50" rx="6"/><text x="159.0" y="206.5" class="t1 f12" text-anchor="middle">UIController・Screen・Speaker</text><text x="159.0" y="223.5" class="t2 f11" text-anchor="middle">参照はビルドが書き直す</text><rect class="box" x="44" y="246" width="230" height="50" rx="6"/><text x="159.0" y="266.5" class="t1 f12" text-anchor="middle">デバイスの区画とビルド処理</text><text x="159.0" y="283.5" class="t2 f11" text-anchor="middle">デバイスの側のフォルダーに置く</text><rect class="ask" x="330" y="120" width="220" height="116" rx="6"/><text x="440.0" y="155.0" class="t1 f12" text-anchor="middle">デバイスの処理（ビルド・新）</text><text x="440.0" y="173.0" class="t2 f11" text-anchor="middle">下の参照を書き直す</text><text x="440.0" y="191.0" class="t2 f11" text-anchor="middle">食い違いをログに出す</text><text x="440.0" y="209.0" class="t2 f11" text-anchor="middle">未設定のデバイスは外す</text><rect class="go" x="586" y="120" width="210" height="116" rx="6"/><text x="691.0" y="162.0" class="t1 f13" text-anchor="middle">本体</text><text x="691.0" y="182.0" class="t1 f12" text-anchor="middle">Controller</text><text x="691.0" y="202.0" class="t1 f12" text-anchor="middle">モジュール</text><path class="arr" d="M274.0,145.0 L330.0,160.0" marker-end="url(#h)"/><path class="arrd" d="M330.0,200.0 L276.0,211.0" marker-end="url(#hm)"/><path class="arrd" d="M274.0,222.0 L306.0,222.0 L306.0,284.0 L691.0,284.0 L691.0,238.0" marker-end="url(#hm)"/><text x="498.0" y="278.0" class="t2 f12" text-anchor="middle">_controller で指す</text><rect class="grp" x="24" y="326" width="380" height="120" rx="8"/><text x="38.0" y="348.0" class="t1 f13 b" text-anchor="start">UI の差し込み先に名前</text><text x="44.0" y="372.0" class="t1 f12" text-anchor="start">モジュールの uiSlots は、パスでなく名前で指す</text><text x="44.0" y="394.0" class="t1 f12" text-anchor="start">UI のプレハブに、名前の印（ビルドで消える）を置く</text><text x="44.0" y="416.0" class="t1 f12" text-anchor="start">どこにも写されなかったら、ログに出す</text><rect class="grp" x="416" y="326" width="380" height="120" rx="8"/><text x="430.0" y="348.0" class="t1 f13 b" text-anchor="start">接続口の名前と配る仕組み</text><text x="436.0" y="372.0" class="t1 f12" text-anchor="start">名前のイベントを 1 つの定数の一覧にする</text><text x="436.0" y="394.0" class="t1 f12" text-anchor="start">配り先の扱いを共通の補助にそろえる</text><text x="436.0" y="416.0" class="t1 f12" text-anchor="start">名前と受け手のメソッドをテストで確かめる</text><path class="arr" d="M24,454 L50,454" marker-end="url(#h)"/><text x="58.0" y="458.0" class="t2 f12" text-anchor="start">読む</text><path class="arrd" d="M94,454 L120,454" marker-end="url(#hm)"/><text x="128.0" y="458.0" class="t2 f12" text-anchor="start">書き直す・指す</text></svg>
