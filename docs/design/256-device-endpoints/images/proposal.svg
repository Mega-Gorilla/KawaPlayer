<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 610" width="820" height="610" role="img" aria-labelledby="t d"><title id="t">組み直したあとのつなぎ方（案）</title><desc id="d">本体のスクリーンのUI、タブレットのアプリ、Controller BarとPlaylist Panel、全員リロードボタン、モジュールのUIは、命令をプレイヤーごとに1つの窓口に出す。窓口は確認のイベントを配り、権限が通せば本体やモジュールを呼ぶ。権限は窓口に1回だけ登録する。自動再生などの中の処理は、窓口を通らずに本体を呼ぶ。値を読むことと出来事を受けることは、今のまま本体から。下に、正の値と足し方、デバイスのことはデバイスに、名前を付ける、の3つを並べる。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="610" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">組み直したあとのつなぎ方（案）</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">利用者の操作は、プレイヤーごとに 1 つの窓口を通る。値を読むことと出来事は、今のまま本体から受ける</text><rect class="grp" x="24" y="84" width="240" height="290" rx="8"/><text x="38.0" y="106.0" class="t1 f13 b" text-anchor="start">デバイスと UI</text><rect class="box" x="40" y="120" width="208" height="40" rx="6"/><text x="144.0" y="144.0" class="t1 f12" text-anchor="middle">本体のスクリーンの UI</text><path class="arr1" d="M248.0,140.0 L308.0,150.0" marker-end="url(#h1)"/><rect class="box" x="40" y="168" width="208" height="40" rx="6"/><text x="144.0" y="192.0" class="t1 f12" text-anchor="middle">タブレットのアプリ</text><path class="arr1" d="M248.0,188.0 L308.0,193.0" marker-end="url(#h1)"/><rect class="box" x="40" y="216" width="208" height="40" rx="6"/><text x="144.0" y="240.0" class="t1 f12" text-anchor="middle">Controller Bar・Playlist Panel</text><path class="arr1" d="M248.0,236.0 L308.0,236.0" marker-end="url(#h1)"/><rect class="box" x="40" y="264" width="208" height="40" rx="6"/><text x="144.0" y="288.0" class="t1 f12" text-anchor="middle">全員リロードボタン</text><path class="arr1" d="M248.0,284.0 L308.0,279.0" marker-end="url(#h1)"/><rect class="box" x="40" y="312" width="208" height="40" rx="6"/><text x="144.0" y="336.0" class="t1 f12" text-anchor="middle">モジュールの UI</text><path class="arr1" d="M248.0,332.0 L308.0,322.0" marker-end="url(#h1)"/><rect class="go" x="310" y="120" width="200" height="232" rx="6"/><text x="410.0" y="175.0" class="t1 f13 b" text-anchor="middle">窓口（新）</text><text x="410.0" y="201.0" class="t2 f11" text-anchor="middle">プレイヤーごとに 1 つ</text><text x="410.0" y="227.0" class="t1 f12" text-anchor="middle">確認のイベント（26 種類）</text><text x="410.0" y="253.0" class="t1 f12" text-anchor="middle">命令の実行</text><text x="410.0" y="279.0" class="t1 f12" text-anchor="middle">URL の差し込み口</text><text x="410.0" y="305.0" class="t1 f12" text-anchor="middle">断ったときの知らせ</text><rect class="ask" x="310" y="396" width="200" height="48" rx="6"/><text x="410.0" y="415.5" class="t1 f12" text-anchor="middle">権限</text><text x="410.0" y="432.5" class="t2 mono" text-anchor="middle">PermissionManagement</text><path class="arr" d="M410.0,396.0 L410.0,354.0" marker-end="url(#h)"/><text x="420.0" y="380.0" class="t2 f11" text-anchor="start">窓口に 1 回だけ登録</text><rect class="box" x="580" y="96" width="216" height="44" rx="6"/><text x="688.0" y="114.0" class="t1 f12" text-anchor="middle">中の処理</text><text x="688.0" y="130.0" class="t2 f11" text-anchor="middle">自動再生・受信・復元・リトライ</text><rect class="go" x="580" y="166" width="216" height="64" rx="6"/><text x="688.0" y="192.0" class="t1 f12" text-anchor="middle">本体</text><text x="688.0" y="212.0" class="t2 mono" text-anchor="middle">Controller</text><rect class="go" x="580" y="262" width="216" height="64" rx="6"/><text x="688.0" y="288.0" class="t1 f12" text-anchor="middle">モジュール</text><text x="688.0" y="308.0" class="t2 f11" text-anchor="middle">全員リロード・音程・スライドショー</text><path class="arr2" d="M688.0,140.0 L688.0,164.0" marker-end="url(#h2)"/><text x="698.0" y="157.0" class="ts2 f11" text-anchor="start">窓口を通らない</text><path class="arr1" d="M510.0,214.0 L578.0,214.0" marker-end="url(#h1)"/><path class="arr1" d="M510.0,294.0 L578.0,294.0" marker-end="url(#h1)"/><text x="544.0" y="250.0" class="t2 f11" text-anchor="middle">確かめて</text><text x="544.0" y="266.0" class="t2 f11" text-anchor="middle">から呼ぶ</text><path class="arrd" d="M580.0,180.0 L548.0,180.0 L548.0,72.0 L144.0,72.0 L144.0,118.0" marker-end="url(#hm)"/><text x="290.0" y="94.0" class="t2 f11" text-anchor="start">値を読む・出来事を受ける（今のまま）</text><rect class="grp" x="24" y="466" width="248" height="96" rx="8"/><text x="38.0" y="488.0" class="t1 f13 b" text-anchor="start">正の値と足し方</text><text x="38.0" y="514.0" class="t1 f12" text-anchor="start">デバイスの根元が窓口を選ぶ</text><text x="38.0" y="538.0" class="t1 f12" text-anchor="start">ビルドが下の部品にそろえる</text><rect class="grp" x="286" y="466" width="248" height="96" rx="8"/><text x="300.0" y="488.0" class="t1 f13 b" text-anchor="start">デバイスのことはデバイスに</text><text x="300.0" y="514.0" class="t1 f12" text-anchor="start">設定はデバイスの区画に</text><text x="300.0" y="538.0" class="t1 f12" text-anchor="start">ビルド処理はデバイスの側に</text><rect class="grp" x="548" y="466" width="248" height="96" rx="8"/><text x="562.0" y="488.0" class="t1 f13 b" text-anchor="start">名前を付ける</text><text x="562.0" y="514.0" class="t1 f12" text-anchor="start">確認と出来事の名前を一覧に</text><text x="562.0" y="538.0" class="t1 f12" text-anchor="start">UI の差し込み先に名前の印</text><path class="arr1" d="M24,590 L50,590" marker-end="url(#h1)"/><text x="58.0" y="594.0" class="t2 f12" text-anchor="start">命令（窓口を通る）</text><path class="arrd" d="M185,590 L211,590" marker-end="url(#hm)"/><text x="219.0" y="594.0" class="t2 f12" text-anchor="start">読む・出来事</text><path class="arr2" d="M307,590 L333,590" marker-end="url(#h2)"/><text x="341.0" y="594.0" class="t2 f12" text-anchor="start">中の処理</text></svg>
