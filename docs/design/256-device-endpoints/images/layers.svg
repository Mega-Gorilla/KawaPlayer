<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 452" width="820" height="452" role="img" aria-labelledby="t d"><title id="t">部品の層</title><desc id="d">KawaPlayerはController、モジュール、UIController、デバイスからなる。VVMWはCore、FrontendHandler、UIHandler、追加の部品からなり、プレイリストとロックはFrontendHandlerが持つ。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="452" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">部品の層</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">どちらも、同期する本体と、UI ごとの部品と、足す部品からなる。VVMW は、プレイリストとロックを FrontendHandler に分けている</text><rect class="grp" x="24" y="70" width="374" height="340" rx="8"/><text x="38.0" y="92.0" class="t1 f13 b" text-anchor="start">KawaPlayer</text><rect class="go" x="44" y="100" width="334" height="54" rx="6"/><text x="211.0" y="122.5" class="t1 f12" text-anchor="middle">Controller</text><text x="211.0" y="139.5" class="t2 f11" text-anchor="middle">再生・同期・プレイリスト・キュー</text><rect class="box" x="44" y="172" width="270" height="50" rx="6"/><text x="179.0" y="192.5" class="t1 f12" text-anchor="middle">モジュール</text><text x="179.0" y="209.5" class="t2 f11" text-anchor="middle">PlaylistLoader・権限・GlobalReload など</text><rect class="box" x="44" y="240" width="334" height="50" rx="6"/><text x="211.0" y="260.5" class="t1 f12" text-anchor="middle">UIController（UI ごと）</text><text x="211.0" y="277.5" class="t2 f11" text-anchor="middle">本体のスクリーン・タブレット・パネル・ボタン</text><rect class="box" x="44" y="308" width="334" height="62" rx="6"/><text x="211.0" y="327.0" class="t1 f12" text-anchor="middle">デバイス（根元に YamaPlayerSubController）</text><text x="211.0" y="343.0" class="t2 f11" text-anchor="middle">タブレット・全員リロードボタン・Sub Screen・</text><text x="211.0" y="359.0" class="t2 f11" text-anchor="middle">Controller Bar・Playlist Panel</text><path class="arr1" d="M346.0,240.0 L346.0,156.0" marker-end="url(#h1)"/><path class="arr1" d="M179.0,172.0 L179.0,156.0" marker-end="url(#h1)"/><rect class="grp" x="422" y="70" width="374" height="340" rx="8"/><text x="436.0" y="92.0" class="t1 f13 b" text-anchor="start">VizVid（VVMW）</text><rect class="go" x="442" y="100" width="334" height="54" rx="6"/><text x="609.0" y="122.5" class="t1 f12" text-anchor="middle">Core</text><text x="609.0" y="139.5" class="t2 f11" text-anchor="middle">再生・同期</text><rect class="box" x="442" y="172" width="334" height="50" rx="6"/><text x="609.0" y="192.5" class="t1 f12" text-anchor="middle">FrontendHandler（Core に 1 つ）</text><text x="609.0" y="209.5" class="t2 f11" text-anchor="middle">プレイリスト・キュー・ロック</text><rect class="box" x="442" y="240" width="334" height="50" rx="6"/><text x="609.0" y="260.5" class="t1 f12" text-anchor="middle">UIHandler（UI ごと）</text><text x="609.0" y="277.5" class="t2 f11" text-anchor="middle">いくつでも置ける</text><rect class="box" x="442" y="308" width="334" height="62" rx="6"/><text x="609.0" y="327.0" class="t1 f12" text-anchor="middle">追加の部品</text><text x="609.0" y="343.0" class="t2 f11" text-anchor="middle">オーバーレイ・持てる画面・Resync ボタン・</text><text x="609.0" y="359.0" class="t2 f11" text-anchor="middle">近づくと再生・BGM の音量 など</text><path class="arr1" d="M609.0,240.0 L609.0,224.0" marker-end="url(#h1)"/><path class="arr1" d="M609.0,172.0 L609.0,156.0" marker-end="url(#h1)"/><path class="arr1" d="M24,432 L50,432" marker-end="url(#h1)"/><text x="58.0" y="436.0" class="t2 f12" text-anchor="start">命令を出す向き</text></svg>
