<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-labelledby="t d"><title id="t">ビルド時の処理の順番</title><desc id="d">KawaPlayerのYamaPlayerBuildProcess（-100000）が、翻訳からモジュール、全員リロードボタン、PlaylistLoader、画面と音、後処理までをcallbackOrderの順に動かす。そのあと、VizVidの土台のBuildPreprocessorManager（-100）が、部品自身の処理、Resolve、ISingleton、BindUdonSharpEvent、エディター専用の物の削除をPriorityの順に動かす。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="540" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">ビルド時の処理の順番</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">Unity はシーンの前処理を callbackOrder の小さい順に呼ぶ。KawaPlayer の処理がすべて済んでから、VizVid の土台の処理が動く</text><rect class="grp" x="24" y="70" width="380" height="430" rx="8"/><text x="38.0" y="92.0" class="t1 f13 b" text-anchor="start">KawaPlayer（YamaPlayerBuildProcess、-100000）</text><text x="38.0" y="110.0" class="t2 f11" text-anchor="start">IYamaPlayerBuildProcess を callbackOrder の順に</text><rect class="box" x="40" y="120" width="348" height="26" rx="5"/><text x="52.0" y="138.0" class="ts1 f12 b" text-anchor="start">-10000</text><text x="110.0" y="138.0" class="t1 f12" text-anchor="start">翻訳</text><rect class="box" x="40" y="152" width="348" height="26" rx="5"/><text x="52.0" y="170.0" class="ts1 f12 b" text-anchor="start">-9000</text><text x="110.0" y="170.0" class="t1 f12" text-anchor="start">プレイリスト</text><rect class="box" x="40" y="184" width="348" height="26" rx="5"/><text x="52.0" y="202.0" class="ts1 f12 b" text-anchor="start">-8000</text><text x="110.0" y="202.0" class="t1 f12" text-anchor="start">[RegisterEvent] の配線</text><rect class="box" x="40" y="216" width="348" height="26" rx="5"/><text x="52.0" y="234.0" class="ts1 f12 b" text-anchor="start">-3000</text><text x="110.0" y="234.0" class="t1 f12" text-anchor="start">モジュール（_controller、uiSlots の写し）</text><rect class="box" x="40" y="248" width="348" height="26" rx="5"/><text x="52.0" y="266.0" class="ts1 f12 b" text-anchor="start">-2900</text><text x="110.0" y="266.0" class="t1 f12" text-anchor="start">全員リロードボタン・AudioLink・LTCGI</text><rect class="box" x="40" y="280" width="348" height="26" rx="5"/><text x="52.0" y="298.0" class="ts1 f12 b" text-anchor="start">-2800</text><text x="110.0" y="298.0" class="t1 f12" text-anchor="start">PitchShifter</text><rect class="box" x="40" y="312" width="348" height="26" rx="5"/><text x="52.0" y="330.0" class="ts1 f12 b" text-anchor="start">-2600</text><text x="110.0" y="330.0" class="t1 f12" text-anchor="start">動的プレイリストの枠</text><rect class="box" x="40" y="344" width="348" height="26" rx="5"/><text x="52.0" y="362.0" class="ts1 f12 b" text-anchor="start">-2500</text><text x="110.0" y="362.0" class="t1 f12" text-anchor="start">PlaylistLoader（URL 欄の差し込み）</text><rect class="box" x="40" y="376" width="348" height="26" rx="5"/><text x="52.0" y="394.0" class="ts1 f12 b" text-anchor="start">-2000</text><text x="110.0" y="394.0" class="t1 f12" text-anchor="start">配色・プレーヤーの並び・画面と音・訪問者の記録</text><rect class="box" x="40" y="408" width="348" height="26" rx="5"/><text x="52.0" y="426.0" class="ts1 f12 b" text-anchor="start">-100</text><text x="110.0" y="426.0" class="t1 f12" text-anchor="start">Persistence</text><rect class="box" x="40" y="440" width="348" height="26" rx="5"/><text x="52.0" y="458.0" class="ts1 f12 b" text-anchor="start">-1</text><text x="110.0" y="458.0" class="t1 f12" text-anchor="start">後処理（版の番号、Controller を一番上へ）</text><rect class="grp" x="436" y="70" width="360" height="430" rx="8"/><text x="450.0" y="92.0" class="t1 f13 b" text-anchor="start">VizVid の土台（BuildPreprocessorManager、-100）</text><text x="450.0" y="110.0" class="t2 f11" text-anchor="start">主なもの。IPreprocessor と ISelfPreProcess を Priority の順に</text><rect class="box" x="452" y="120" width="328" height="26" rx="5"/><text x="464.0" y="138.0" class="ts1 f12 b" text-anchor="start">-10</text><text x="500.0" y="138.0" class="t1 f12" text-anchor="start">部品自身（版の表示、プレーヤー、Resync ボタン）</text><rect class="box" x="452" y="152" width="328" height="26" rx="5"/><text x="464.0" y="170.0" class="ts1 f12 b" text-anchor="start">-1</text><text x="500.0" y="170.0" class="t1 f12" text-anchor="start">[Resolve]（欄からたどって埋める）</text><rect class="box" x="452" y="184" width="328" height="26" rx="5"/><text x="464.0" y="202.0" class="ts1 f12 b" text-anchor="start">-1</text><text x="500.0" y="202.0" class="t1 f12" text-anchor="start">ISingleton（1 つにまとめる）</text><rect class="box" x="452" y="216" width="328" height="26" rx="5"/><text x="464.0" y="234.0" class="ts1 f12 b" text-anchor="start">0</text><text x="500.0" y="234.0" class="t1 f12" text-anchor="start">[BindUdonSharpEvent]（配り先を作る）</text><rect class="box" x="452" y="248" width="328" height="26" rx="5"/><text x="464.0" y="266.0" class="ts1 f12 b" text-anchor="start">0</text><text x="500.0" y="266.0" class="t1 f12" text-anchor="start">部品自身（配色、オーバーレイ、一覧など）</text><rect class="box" x="452" y="280" width="328" height="26" rx="5"/><text x="464.0" y="298.0" class="ts1 f12 b" text-anchor="start">0</text><text x="500.0" y="298.0" class="t1 f12" text-anchor="start">素材</text><rect class="box" x="452" y="312" width="328" height="26" rx="5"/><text x="464.0" y="330.0" class="ts1 f12 b" text-anchor="start">99</text><text x="500.0" y="330.0" class="t1 f12" text-anchor="start">Core の設定</text><rect class="box" x="452" y="344" width="328" height="26" rx="5"/><text x="464.0" y="362.0" class="ts1 f12 b" text-anchor="start">100</text><text x="500.0" y="362.0" class="t1 f12" text-anchor="start">エディター専用の物を消す</text><text x="452.0" y="412.0" class="t2 f11" text-anchor="start">同じ Priority の中の順番は、決まっていない</text><text x="452.0" y="430.0" class="t2 f11" text-anchor="start">（-10 の部品自身の処理は、Resolve より先に動く）</text><path class="arr" d="M404.0,310.0 L436.0,310.0" marker-end="url(#h)"/><text x="24.0" y="520.0" class="t2 f12" text-anchor="start">KawaPlayer はデバイスごと・目的ごとの処理を並べる。VizVid は、属性を読む汎用の処理と、部品自身の処理を並べる。</text></svg>
