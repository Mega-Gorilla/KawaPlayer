<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="t d"><title id="t">進め方</title><desc id="d">1.3.0では、AudioLinkの食い違いと#206を先に直す。1.3.0のあとに、子のissue1（正の値と足し方）、2（区画とビルド処理）、3（名前の一覧と配る仕組み）、4（差し込み先の名前）の順に入れる。</desc><style>
