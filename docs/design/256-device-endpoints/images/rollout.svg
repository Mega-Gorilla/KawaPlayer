iddle">区画と</text><text x="446.0" y="297.5" class="t1 f12" text-anchor="middle">ビルド処理</text><text x="446.0" y="316.5" class="t2 f11" text-anchor="middle">D8</text><path class="arr" d="M509.0,284.0 L519.0,284.0" marker-end="url(#h)"/><rect class="box" x="520" y="236" width="124" height="96" rx="6"/><text x="582.0" y="259.5" class="t1 f12" text-anchor="middle">子の issue 7</text><text x="582.0" y="278.5" class="t1 f12" text-anchor="middle">名前の一覧と</text><text x="582.0" y="297.5" class="t1 f12" text-anchor="middle">配る仕組み</text><text x="582.0" y="316.5" class="t2 f11" text-anchor="middle">D9</text><path class="arr" d="M645.0,284.0 L655.0,284.0" marker-end="url(#h)"/><rect class="box" x="656" y="236" width="124" height="96" rx="6"/><text x="718.0" y="259.5" class="t1 f12" text-anchor="middle">子の issue 8</text><text x="718.0" y="278.5" class="t1 f12" text-anchor="middle">差し込み先の</text><text x="718.0" y="297.5" class="t1 f12" text-anchor="middle">名前</text><text x="718.0" y="316.5" class="t2 f11" text-anchor="middle">D10</text><path class="arr" d="M718.0,204.0 L718.0,220.0 L310.0,220.0 L310.0,234.0" marker-end="url(#h)"/><text x="250.0" y="356.0" class="t2 f12" text-anchor="start">1〜4 が窓口：小さな操作で確かめてから広げ、権限の漏れを直す所は挙動の変更として明示する</text><text x="250.0" y="376.0" class="t2 f12" text-anchor="start">子の issue ごとに、device-connections.md と図を書き直す</text><path class="arrd" d="M214.0,198.0 L234.0,198.0" marker-end="url(#hm)"/></svg>
