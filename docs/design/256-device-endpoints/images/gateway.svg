<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 855" width="820" height="855" role="img" aria-labelledby="t d"><title id="t">窓口が操作を受けて流すまで</title><desc id="d">デバイスが窓口にForwardを渡す。窓口は権限の判断に、できるかを聞く。判断に副作用は無い。できなければ「断った」を返し、表示はデバイスが決める。できれば引き受け手に、引き受けるかを聞く。スライドモードならスライドショーが引き受けて次のスライドへ進み、「引き受けられた」を返す。引き受け手が無ければ、窓口が所有権を取って本体のForwardを呼び、「実行した」を返す。照会は、権限の判断だけを行い、何も実行しない。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="855" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">窓口が操作を受けて流すまで</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">受付 → 権限の判断 → 振り分け → 実行。窓口は結果を返し、表示はしない</text><line class="axis" x1="101.2" x2="101.2" y1="114" y2="837.0"/><rect class="box" x="29.0" y="70" width="144.4" height="44" rx="6"/><text x="101.2" y="87.5" class="t1 f12" text-anchor="middle">デバイス</text><text x="101.2" y="104.5" class="t2 f11" text-anchor="middle">呼んだ物</text><line class="axis" x1="255.6" x2="255.6" y1="114" y2="837.0"/><rect class="box" x="183.40000000000003" y="70" width="144.4" height="44" rx="6"/><text x="255.6" y="87.5" class="t1 f12" text-anchor="middle">窓口</text><text x="255.6" y="104.5" class="t2 f11" text-anchor="middle">プレイヤーごとに 1 つ</text><line class="axis" x1="410.0" x2="410.0" y1="114" y2="837.0"/><rect class="box" x="337.8" y="70" width="144.4" height="44" rx="6"/><text x="410.0" y="87.5" class="t1 f12" text-anchor="middle">権限の判断</text><text x="410.0" y="104.5" class="t2 f11" text-anchor="middle">モジュールが登録</text><line class="axis" x1="564.4" x2="564.4" y1="114" y2="837.0"/><rect class="box" x="492.2" y="70" width="144.4" height="44" rx="6"/><text x="564.4" y="87.5" class="t1 f12" text-anchor="middle">引き受け手</text><text x="564.4" y="104.5" class="t2 f11" text-anchor="middle">スライドショーなど</text><line class="axis" x1="718.8" x2="718.8" y1="114" y2="837.0"/><rect class="box" x="646.6" y="70" width="144.4" height="44" rx="6"/><text x="718.8" y="87.5" class="t1 f12" text-anchor="middle">本体</text><text x="718.8" y="104.5" class="t2 f11" text-anchor="middle">Controller</text><text x="178.4" y="134.0" class="t2 f12" text-anchor="middle">Forward（操作の種類）</text><path class="arr1" d="M101.2,140 L251.6,140" marker-end="url(#h1)"/><text x="332.8" y="170.0" class="t2 f12" text-anchor="middle">できるか？</text><path class="arr" d="M255.6,176 L406.0,176" marker-end="url(#h)"/><rect class="ask" x="322.0" y="200" width="176.0" height="46" rx="6"/><text x="410.0" y="218.0" class="t1 f12" text-anchor="middle">副作用なし</text><text x="410.0" y="235.0" class="t1 f12" text-anchor="middle">（知らせ・状態変更なし）</text><rect class="ask" x="167.6" y="260" width="176.0" height="29" rx="6"/><text x="255.6" y="278.0" class="t1 f12" text-anchor="middle">できないとき</text><text x="178.4" y="309.0" class="t2 f12" text-anchor="middle">結果：断った</text><path class="arr2" d="M255.6,315 L105.2,315" marker-end="url(#h2)"/><rect class="ask" x="13.2" y="339" width="176.0" height="29" rx="6"/><text x="101.2" y="357.0" class="t1 f12" text-anchor="middle">表示はデバイスが決める</text><rect class="ask" x="167.6" y="382" width="176.0" height="29" rx="6"/><text x="255.6" y="400.0" class="t1 f12" text-anchor="middle">できるとき：振り分け</text><text x="410.0" y="431.0" class="t2 f12" text-anchor="middle">引き受けるか？</text><path class="arr" d="M255.6,437 L560.4,437" marker-end="url(#h)"/><rect class="ask" x="476.4" y="461" width="176.0" height="46" rx="6"/><text x="564.4" y="479.0" class="t1 f12" text-anchor="middle">スライドモードなら引き受け、</text><text x="564.4" y="496.0" class="t1 f12" text-anchor="middle">次のスライドへ</text><text x="178.4" y="527.0" class="t2 f12" text-anchor="middle">結果：引き受けられた</text><path class="arrd" d="M255.6,533 L105.2,533" marker-end="url(#hm)"/><rect class="ask" x="167.6" y="557" width="176.0" height="29" rx="6"/><text x="255.6" y="575.0" class="t1 f12" text-anchor="middle">引き受け手が無いとき</text><text x="487.2" y="606.0" class="t2 f12" text-anchor="middle">所有権を取って Forward</text><path class="arr1" d="M255.6,612 L714.8,612" marker-end="url(#h1)"/><text x="178.4" y="642.0" class="t2 f12" text-anchor="middle">結果：実行した</text><path class="arrd" d="M255.6,648 L105.2,648" marker-end="url(#hm)"/><rect class="ask" x="13.2" y="672" width="176.0" height="29" rx="6"/><text x="101.2" y="690.0" class="t1 f12" text-anchor="middle">照会（ボタンの表示）</text><text x="178.4" y="721.0" class="t2 f12" text-anchor="middle">できるか？</text><path class="arr1" d="M101.2,727 L251.6,727" marker-end="url(#h1)"/><text x="332.8" y="757.0" class="t2 f12" text-anchor="middle">できるか？</text><path class="arr" d="M255.6,763 L406.0,763" marker-end="url(#h)"/><text x="178.4" y="793.0" class="t2 f12" text-anchor="middle">できる・できない（何も実行しない）</text><path class="arrd" d="M255.6,799 L105.2,799" marker-end="url(#hm)"/></svg>
