<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 656" width="820" height="656" role="img" aria-labelledby="t d"><title id="t">窓口が操作を受けて流すまで</title><desc id="d">UIやデバイスが、自分を添えて窓口のPlayTrackを呼ぶ。窓口はBeforeUserPlayTrackを権限に配る。断られたら、窓口が呼んだ物に知らせを出す（ダイアログ、無ければ本体のスクリーン）。通ったら、窓口が所有権を取って本体のPlayTrackを呼ぶ。本体の出来事は今のままUIに届く。モジュールのUIは、窓口に確かめてもらい、通ったら自分のモジュールの設定を変える。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="656" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">窓口が操作を受けて流すまで</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">利用者の操作は、窓口が確かめてから本体を呼ぶ。断ったときは、窓口が呼んだ物に知らせる</text><line class="axis" x1="120.5" x2="120.5" y1="114" y2="638.0"/><rect class="box" x="35.5" y="70" width="170" height="44" rx="6"/><text x="120.5" y="87.5" class="t1 f12" text-anchor="middle">UI・デバイス</text><text x="120.5" y="104.5" class="t2 f11" text-anchor="middle">呼んだ物</text><line class="axis" x1="313.5" x2="313.5" y1="114" y2="638.0"/><rect class="box" x="228.5" y="70" width="170" height="44" rx="6"/><text x="313.5" y="87.5" class="t1 f12" text-anchor="middle">窓口</text><text x="313.5" y="104.5" class="t2 f11" text-anchor="middle">プレイヤーごとに 1 つ</text><line class="axis" x1="506.5" x2="506.5" y1="114" y2="638.0"/><rect class="box" x="421.5" y="70" width="170" height="44" rx="6"/><text x="506.5" y="87.5" class="t1 f12" text-anchor="middle">権限</text><text x="506.5" y="104.5" class="t2 f11" text-anchor="middle">PermissionManagement</text><line class="axis" x1="699.5" x2="699.5" y1="114" y2="638.0"/><rect class="box" x="614.5" y="70" width="170" height="44" rx="6"/><text x="699.5" y="87.5" class="t1 f12" text-anchor="middle">本体・モジュール</text><text x="699.5" y="104.5" class="t2 f11" text-anchor="middle">Controller など</text><text x="217.0" y="134.0" class="t2 f12" text-anchor="middle">PlayTrack(自分, 曲)</text><path class="arr1" d="M120.5,140 L309.5,140" marker-end="url(#h1)"/><text x="410.0" y="170.0" class="t2 f12" text-anchor="middle">BeforeUserPlayTrack</text><path class="arr" d="M313.5,176 L502.5,176" marker-end="url(#h)"/><rect class="ask" x="411.5" y="200" width="190.0" height="29" rx="6"/><text x="506.5" y="218.0" class="t1 f12" text-anchor="middle">足りなければ断る</text><rect class="ask" x="218.5" y="243" width="190.0" height="29" rx="6"/><text x="313.5" y="261.0" class="t1 f12" text-anchor="middle">断られたとき</text><text x="217.0" y="292.0" class="t2 f12" text-anchor="middle">知らせ（ダイアログ。無ければ本体のスクリーン）</text><path class="arr2" d="M313.5,298 L124.5,298" marker-end="url(#h2)"/><rect class="ask" x="218.5" y="322" width="190.0" height="29" rx="6"/><text x="313.5" y="340.0" class="t1 f12" text-anchor="middle">通ったとき</text><text x="506.5" y="371.0" class="t2 f12" text-anchor="middle">所有権を取って PlayTrack(曲)</text><path class="arr1" d="M313.5,377 L695.5,377" marker-end="url(#h1)"/><text x="410.0" y="407.0" class="t2 f12" text-anchor="middle">AfterVideoReady など（出来事。今のまま）</text><path class="arrd" d="M699.5,413 L124.5,413" marker-end="url(#hm)"/><rect class="ask" x="25.5" y="437" width="190.0" height="29" rx="6"/><text x="120.5" y="455.0" class="t1 f12" text-anchor="middle">モジュールの UI のとき</text><text x="217.0" y="486.0" class="t2 f12" text-anchor="middle">確かめてもらう</text><path class="arr1" d="M120.5,492 L309.5,492" marker-end="url(#h1)"/><text x="410.0" y="522.0" class="t2 f12" text-anchor="middle">BeforeUserChangePitch</text><path class="arr" d="M313.5,528 L502.5,528" marker-end="url(#h)"/><text x="217.0" y="558.0" class="t2 f12" text-anchor="middle">通った</text><path class="arr" d="M313.5,564 L124.5,564" marker-end="url(#h)"/><text x="410.0" y="594.0" class="t2 f12" text-anchor="middle">自分のモジュールの設定を変える</text><path class="arr1" d="M120.5,600 L695.5,600" marker-end="url(#h1)"/></svg>
