<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="t d"><title id="t">イベントの配り方</title><desc id="d">VVMWでは、CoreなどUdonSharpEventSenderを継ぐ送り手がSendEventで名前を送り、ビルドでBindUdonSharpEventから作った名前ごとの配り先に届く。KawaPlayerでは、Controller、UIController、4つのモジュールが、それぞれ実行時に登録されたリストに配る。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="470" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">イベントの配り方</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">VVMW は共通の基底クラスが、ビルドで作った名前ごとの配り先に配る。KawaPlayer は送り手ごとにリストを持つ</text><rect class="grp" x="24" y="70" width="772" height="168" rx="8"/><text x="38.0" y="92.0" class="t1 f13 b" text-anchor="start">VizVid（UdonSharpEventSender を継ぐ送り手）</text><rect class="go" x="44" y="110" width="190" height="106" rx="6"/><text x="139.0" y="147.0" class="t1 f12" text-anchor="middle">Core</text><text x="139.0" y="167.0" class="t2 mono" text-anchor="middle">SendEvent(名前)</text><text x="139.0" y="187.0" class="t2 f11" text-anchor="middle">19 種類の名前</text><rect class="box" x="270" y="100" width="330" height="126" rx="6"/><text x="282.0" y="122.0" class="t1 f13 b" text-anchor="start">namedTargets（ビルドで作る）</text><text x="282.0" y="144.0" class="t1 mono" text-anchor="start">_onVideoReady → FrontendHandler, UIHandler</text><text x="282.0" y="164.0" class="t1 mono" text-anchor="start">_OnPerformerChange → UIHandler</text><text x="282.0" y="184.0" class="t1 mono" text-anchor="start">_OnTitleData → FrontendHandler</text><text x="282.0" y="204.0" class="t2 f11" text-anchor="start">…（付録 B では 15 個の名前）</text><rect class="box" x="630" y="110" width="146" height="106" rx="6"/><text x="703.0" y="147.0" class="t1 f12" text-anchor="middle">受け手</text><text x="703.0" y="167.0" class="t2 mono" text-anchor="middle">[BindUdonSharpEvent(</text><text x="703.0" y="187.0" class="t2 mono" text-anchor="middle">nameof(_OnXxx))]</text><path class="arr" d="M234.0,163.0 L270.0,163.0" marker-end="url(#h)"/><path class="arr2" d="M600.0,163.0 L630.0,163.0" marker-end="url(#h2)"/><rect class="grp" x="24" y="254" width="772" height="170" rx="8"/><text x="38.0" y="276.0" class="t1 f13 b" text-anchor="start">KawaPlayer（送り手ごとのリスト）</text><rect class="go" x="44" y="296" width="230" height="108" rx="6"/><text x="159.0" y="335.0" class="t1 f12" text-anchor="middle">Controller._listeners</text><text x="159.0" y="354.0" class="t2 f11" text-anchor="middle">型付き AfterXxx（29）と</text><text x="159.0" y="373.0" class="t2 mono" text-anchor="middle">SendCustomVideoEvent(名前)</text><rect class="box" x="294" y="296" width="230" height="108" rx="6"/><text x="409.0" y="335.0" class="t1 f12" text-anchor="middle">UIController._listeners</text><text x="409.0" y="354.0" class="t2 f11" text-anchor="middle">BeforeUserXxx（26）と</text><text x="409.0" y="373.0" class="t2 mono" text-anchor="middle">AfterLanguageChanged</text><rect class="box" x="544" y="296" width="232" height="108" rx="6"/><text x="660.0" y="335.0" class="t1 f12" text-anchor="middle">モジュールの自前のリスト</text><text x="660.0" y="354.0" class="t2 f11" text-anchor="middle">PermissionManagement・PitchShifter・</text><text x="660.0" y="373.0" class="t2 f11" text-anchor="middle">SlideShower・AudioLinkAdaptor</text><text x="44.0" y="456.0" class="t2 f12" text-anchor="start">どのリストも、受け手が実行時の Start で AddListener を呼んで入る。名前は、送る側も受ける側も文字列。</text></svg>
