<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 538" width="820" height="538" role="img" aria-labelledby="t d"><title id="t">Playの前処理のあとの、名前ごとの配り先</title><desc id="d">CoreのnamedTargetsには15個の名前があり、動画の出来事・音量・速度など9個はFrontendHandlerとUIHandlerの両方に、題名や読み込みの始まりなど4個はFrontendHandlerだけに、演者と範囲のループの2個はUIHandlerだけに届く。FrontendHandlerの_OnUIUpdateはUIHandlerに届く。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="538" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">Play の前処理のあとの、名前ごとの配り先</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">テスト用の Unity（ClientSim）で読んだ。エディターでは、どの配り先も空だった（付録 B の B1・B2）</text><text x="24.0" y="92.0" class="t2 f12 b" text-anchor="start">送り手と名前</text><text x="520.0" y="92.0" class="t2 f12 b" text-anchor="middle">FrontendHandler</text><text x="660.0" y="92.0" class="t2 f12 b" text-anchor="middle">UIHandler</text><rect class="grp" x="24" y="97" width="772" height="22" rx="3"/><text x="40.0" y="112.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="112.0" class="t1 mono" text-anchor="start">_onVideoReady</text><circle class="d1" cx="520" cy="108" r="6"/><circle class="d1" cx="660" cy="108" r="6"/><text x="40.0" y="134.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="134.0" class="t1 mono" text-anchor="start">_onVideoStart</text><circle class="d1" cx="520" cy="130" r="6"/><circle class="d1" cx="660" cy="130" r="6"/><rect class="grp" x="24" y="141" width="772" height="22" rx="3"/><text x="40.0" y="156.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="156.0" class="t1 mono" text-anchor="start">OnVideoPlay</text><circle class="d1" cx="520" cy="152" r="6"/><circle class="d1" cx="660" cy="152" r="6"/><text x="40.0" y="178.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="178.0" class="t1 mono" text-anchor="start">OnVideoPause</text><circle class="d1" cx="520" cy="174" r="6"/><circle class="d1" cx="660" cy="174" r="6"/><rect class="grp" x="24" y="185" width="772" height="22" rx="3"/><text x="40.0" y="200.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="200.0" class="t1 mono" text-anchor="start">_onVideoEnd</text><circle class="d1" cx="520" cy="196" r="6"/><circle class="d1" cx="660" cy="196" r="6"/><text x="40.0" y="222.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="222.0" class="t1 mono" text-anchor="start">_OnVolumeChange</text><circle class="d1" cx="520" cy="218" r="6"/><circle class="d1" cx="660" cy="218" r="6"/><rect class="grp" x="24" y="229" width="772" height="22" rx="3"/><text x="40.0" y="244.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="244.0" class="t1 mono" text-anchor="start">_OnSpeedChange</text><circle class="d1" cx="520" cy="240" r="6"/><circle class="d1" cx="660" cy="240" r="6"/><text x="40.0" y="266.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="266.0" class="t1 mono" text-anchor="start">_OnSyncOffsetChange</text><circle class="d1" cx="520" cy="262" r="6"/><circle class="d1" cx="660" cy="262" r="6"/><rect class="grp" x="24" y="273" width="772" height="22" rx="3"/><text x="40.0" y="288.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="288.0" class="t1 mono" text-anchor="start">_OnScreenSharedPropertiesChanged</text><circle class="d1" cx="520" cy="284" r="6"/><circle class="d1" cx="660" cy="284" r="6"/><text x="40.0" y="310.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="310.0" class="t1 mono" text-anchor="start">_OnTitleData</text><circle class="d1" cx="520" cy="306" r="6"/><text x="660.0" y="310.0" class="tm f12" text-anchor="middle">—</text><rect class="grp" x="24" y="317" width="772" height="22" rx="3"/><text x="40.0" y="332.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="332.0" class="t1 mono" text-anchor="start">_OnVideoBeginLoad</text><circle class="d1" cx="520" cy="328" r="6"/><text x="660.0" y="332.0" class="tm f12" text-anchor="middle">—</text><text x="40.0" y="354.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="354.0" class="t1 mono" text-anchor="start">_OnVideoError</text><circle class="d1" cx="520" cy="350" r="6"/><text x="660.0" y="354.0" class="tm f12" text-anchor="middle">—</text><rect class="grp" x="24" y="361" width="772" height="22" rx="3"/><text x="40.0" y="376.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="376.0" class="t1 mono" text-anchor="start">_OnRangeLoopToggled</text><circle class="d1" cx="520" cy="372" r="6"/><text x="660.0" y="376.0" class="tm f12" text-anchor="middle">—</text><text x="40.0" y="398.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="398.0" class="t1 mono" text-anchor="start">_OnPerformerChange</text><text x="520.0" y="398.0" class="tm f12" text-anchor="middle">—</text><circle class="d1" cx="660" cy="394" r="6"/><rect class="grp" x="24" y="405" width="772" height="22" rx="3"/><text x="40.0" y="420.0" class="tm f11" text-anchor="start">Core</text><text x="90.0" y="420.0" class="t1 mono" text-anchor="start">_OnRangeLoopChange</text><text x="520.0" y="420.0" class="tm f12" text-anchor="middle">—</text><circle class="d1" cx="660" cy="416" r="6"/><rect class="grp" x="24" y="435" width="772" height="22" rx="3"/><text x="40.0" y="450.0" class="tm f11" text-anchor="start">Frontend</text><text x="90.0" y="450.0" class="t1 mono" text-anchor="start">_OnUIUpdate</text><text x="520.0" y="450.0" class="tm f11" text-anchor="middle">（送り手）</text><circle class="d1" cx="660" cy="446" r="6"/><text x="24.0" y="508.0" class="t2 f12" text-anchor="start">Core は 15 個、FrontendHandler は 1 個の名前に、配り先を持った。全部を受ける配り先（targets）は、どちらも空だった。</text><circle class="d1" cx="30" cy="526" r="5"/><text x="42.0" y="530.0" class="t2 f12" text-anchor="start">その名前のイベントが届く</text></svg>
