<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="t d"><title id="t">部品の足し方</title><desc id="d">KawaPlayerは、メニューで選んでいる物の下に置き、インスペクターでプレイヤーを選ぶと下の部品に書く。VVMWは、メニューで置くと、Locateがいちばん近いCoreを探して欄に入れ、無ければCoreを置く。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="330" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">部品の足し方</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">KawaPlayer は置いたあとにプレイヤーを選ぶ。VVMW は置くとき、いちばん近い本体に結ぶ</text><text x="24.0" y="116.0" class="t1 f13 b" text-anchor="start">KawaPlayer</text><rect class="box" x="130" y="82" width="150" height="56" rx="6"/><text x="205.0" y="105.0" class="t1 f12" text-anchor="middle">GameObject &gt;</text><text x="205.0" y="123.0" class="t1 f12" text-anchor="middle">KawaPlayer &gt; Tablet</text><path class="arr" d="M281.0,110.0 L300.0,110.0" marker-end="url(#h)"/><rect class="box" x="302" y="82" width="150" height="56" rx="6"/><text x="377.0" y="105.0" class="t1 f12" text-anchor="middle">選んでいる物の</text><text x="377.0" y="123.0" class="t1 f12" text-anchor="middle">下に置く</text><path class="arr" d="M453.0,110.0 L472.0,110.0" marker-end="url(#h)"/><rect class="go" x="474" y="82" width="150" height="56" rx="6"/><text x="549.0" y="105.0" class="t1 f12" text-anchor="middle">インスペクターで</text><text x="549.0" y="123.0" class="t1 f12" text-anchor="middle">プレイヤーを選ぶ</text><path class="arr" d="M625.0,110.0 L644.0,110.0" marker-end="url(#h)"/><rect class="box" x="646" y="82" width="150" height="56" rx="6"/><text x="721.0" y="105.0" class="t1 f12" text-anchor="middle">下の部品の</text><text x="721.0" y="123.0" class="t1 f12" text-anchor="middle">_controller に書く</text><text x="130.0" y="162.0" class="ts2 f12" text-anchor="start">選ぶまでは、どこにもつながらない</text><text x="24.0" y="236.0" class="t1 f13 b" text-anchor="start">VizVid</text><rect class="box" x="130" y="202" width="150" height="56" rx="6"/><text x="205.0" y="225.0" class="t1 f12" text-anchor="middle">GameObject &gt;</text><text x="205.0" y="243.0" class="t1 f12" text-anchor="middle">VizVid &gt; …</text><path class="arr" d="M281.0,230.0 L300.0,230.0" marker-end="url(#h)"/><rect class="box" x="302" y="202" width="150" height="56" rx="6"/><text x="377.0" y="225.0" class="t1 f12" text-anchor="middle">選んでいる物の</text><text x="377.0" y="243.0" class="t1 f12" text-anchor="middle">下に置く</text><path class="arr" d="M453.0,230.0 L472.0,230.0" marker-end="url(#h)"/><rect class="go" x="474" y="202" width="150" height="56" rx="6"/><text x="549.0" y="225.0" class="t1 f12" text-anchor="middle">Locate：いちばん近い</text><text x="549.0" y="243.0" class="t1 f12" text-anchor="middle">Core を探す</text><path class="arr" d="M625.0,230.0 L644.0,230.0" marker-end="url(#h)"/><rect class="box" x="646" y="202" width="150" height="56" rx="6"/><text x="721.0" y="225.0" class="t1 f12" text-anchor="middle">欄に入れる</text><text x="721.0" y="243.0" class="t1 f12" text-anchor="middle">（無ければ Core を置く）</text><text x="130.0" y="282.0" class="ts1 f12" text-anchor="start">プレイヤーを選んで足せば、そのプレイヤーにつながる</text></svg>
