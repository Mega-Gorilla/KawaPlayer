<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#4FC3F7}a:hover{color:#B3E5FC}
button{font-family:inherit;color:inherit;border:0;margin:0;cursor:pointer}
button:disabled{cursor:default;opacity:0.38}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
.glass{background:rgba(22,24,28,0.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.cb{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1);padding:0;flex-shrink:0}
.cb svg{width:40px;height:40px}
.pill{height:84px;padding:0 30px 0 24px;border-radius:42px;display:flex;align-items:center;gap:12px;font-size:26px;font-weight:700;flex-shrink:0}
.pill svg{width:38px;height:38px}
</style>
</head><body style="margin:0">

<div style="width: 1600px; height: 900px; position: relative; overflow: hidden; background: #0B1016; font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif; color: #E4E5EA">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1600px; height: 900px; background: radial-gradient(ellipse 820px 400px at 50% 34%, rgba(79,195,247,0.2), rgba(11,16,22,0) 70%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-size: 96px; font-weight: 500; letter-spacing: 0.03em; color: rgba(228,229,234,0.85)">KawaPlayer</div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 380px; background: linear-gradient(to top, rgba(6,8,12,0.88) 0%, rgba(6,8,12,0.6) 55%, rgba(6,8,12,0) 100%)"></div>

  <div class="glass" style="position: absolute; left: 40px; top: 32px; padding: 18px 28px; border-radius: 28px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 30px; font-weight: 700">KawaPlayer <span style="font-weight: 500; color: #C9CCD4">v1.3.3</span></span>
    <span style="font-size: 22px; color: #A3A6B0">動画・画像・VHub プレイリストの URL に対応</span>
  </div>

  <section aria-label="再生の操作" style="position: absolute; left: 48px; right: 48px; bottom: 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 24px; height: 36px; opacity: 0.45">
      <span style="font-size: 24px; font-variant-numeric: tabular-nums">--:--</span>
      <div style="flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.28)"></div>
      <span style="font-size: 24px; font-variant-numeric: tabular-nums">--:--</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px">
      <div style="display: flex; align-items: center; gap: 16px">
        <button class="cb" aria-label="URL を入力" style="background: #4FC3F7; color: #10161C">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"></path><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>
        </button>
        <button class="cb" aria-label="ループ">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2.5l3 3-3 3"></path><path d="M4 11v-1.5a4 4 0 0 1 4-4h12"></path><path d="M7 21.5l-3-3 3-3"></path><path d="M20 13v1.5a4 4 0 0 1-4 4H4"></path></svg>
        </button>
        <button class="cb" aria-label="シャッフル">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
        </button>
        <button class="cb" aria-label="ReSync" disabled>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"></path><path d="M20 4v5h-5"></path></svg>
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 20px">
        <button class="cb" aria-label="前の曲" disabled>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14"></path><path class="f" d="M19 5.5v13L9 12z"></path></svg>
        </button>
        <button class="cb" aria-label="再生" disabled style="width: 104px; height: 104px; border-radius: 52px">
          <svg class="ic" viewBox="0 0 24 24" style="width: 50px; height: 50px" aria-hidden="true"><path class="f" d="M8 5.5v13l11-6.5z"></path></svg>
        </button>
        <button class="cb" aria-label="次の曲" disabled>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14"></path><path class="f" d="M5 5.5v13L15 12z"></path></svg>
        </button>
        <button class="cb" aria-label="停止" disabled>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect class="f" x="6" y="6" width="12" height="12" rx="2"></rect></svg>
        </button>
      </div>
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 16px">
        <button class="cb" aria-label="音量">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"></path><path d="M15.5 9a4 4 0 0 1 0 6"></path><path d="M18 6.5a7.5 7.5 0 0 1 0 11"></path></svg>
        </button>
        <button class="cb" aria-label="一覧">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h11"></path><path d="M4 11h11"></path><path d="M4 16h7"></path><path d="M19 5v10.5"></path><circle cx="17" cy="16" r="2"></circle></svg>
        </button>
        <button class="cb" aria-label="設定">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><path d="M4 17h4"></path><path d="M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
        </button>
        <button class="cb" aria-label="その他（Info・UI ロック）">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle class="f" cx="5" cy="12" r="1.8"></circle><circle class="f" cx="12" cy="12" r="1.8"></circle><circle class="f" cx="19" cy="12" r="1.8"></circle></svg>
        </button>
      </div>
    </div>
  </section>
</div>
</body></html>
