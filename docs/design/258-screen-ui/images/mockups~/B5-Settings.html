<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#4FC3F7}a:hover{color:#B3E5FC}
button{font-family:inherit;color:inherit;border:0;margin:0;cursor:pointer}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
.cb{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1);padding:0;flex-shrink:0}
.cb svg{width:40px;height:40px}
.cat{height:104px;padding:0 28px;border-radius:24px;display:flex;align-items:center;gap:20px;font-size:30px;font-weight:700;background:transparent;color:#C9CCD4;text-align:left}
.cat svg{width:48px;height:48px}
.card{padding:22px 28px;border-radius:24px;background:rgba(255,255,255,0.07);display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:24px}
.lab{display:flex;flex-direction:column;gap:4px;min-width:0}
.lab b{font-size:30px}
.lab b small{font-size:22px;font-weight:500;color:#A3A6B0}
.lab span{font-size:22px;color:#A3A6B0}
.seg{display:flex;gap:10px;flex-shrink:0}
.seg button{height:84px;min-width:148px;padding:0 30px;border-radius:20px;background:rgba(0,0,0,0.24);font-size:26px;font-weight:700;color:#C9CCD4}
</style>
</head><body style="margin:0">

<div style="width: 1600px; height: 900px; position: relative; overflow: hidden; background: #15171C; font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif; color: #E4E5EA">
  <svg viewBox="0 0 1600 900" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color: #E9A982"></stop>
        <stop offset="0.55" style="stop-color: #F4D3A4"></stop>
        <stop offset="1" style="stop-color: #A8CFDF"></stop>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"></rect>
    <circle cx="1120" cy="290" r="88" fill="#FFF3DC"></circle>
    <polygon points="0,520 220,380 420,500 640,340 900,520 1100,420 1340,540 1600,400 1600,900 0,900" fill="#7896AB"></polygon>
    <polygon points="0,630 300,510 560,610 820,490 1080,620 1360,530 1600,610 1600,900 0,900" fill="#557489"></polygon>
    <path d="M0 750 C 400 690 800 820 1600 710 L1600 900 L0 900 Z" fill="#86BCD3"></path>
    <path d="M0 820 C 500 780 1000 880 1600 800 L1600 900 L0 900 Z" fill="#B7DCEA"></path>
  </svg>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1600px; height: 900px; background: rgba(16,18,22,0.84); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px)"></div>

  <header style="position: absolute; left: 48px; right: 48px; top: 30px; display: flex; align-items: center; gap: 22px">
    <button class="cb" aria-label="設定を閉じて戻る">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <svg class="ic" viewBox="0 0 24 24" style="width: 48px; height: 48px" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><path d="M4 17h4"></path><path d="M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    <span style="font-size: 38px; font-weight: 700">設定</span>
  </header>

  <nav aria-label="設定の分類" style="position: absolute; left: 48px; top: 140px; width: 340px; display: flex; flex-direction: column; gap: 10px">
    <button class="cat" aria-pressed="true" style="background: color-mix(in srgb, #4FC3F7 28%, rgba(255,255,255,0.04)); color: #FFFFFF">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M10 8.5v7l6-3.5z"></path></svg>再生
    </button>
    <button class="cat">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>映像
    </button>
    <button class="cat">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"></path><path d="M15.5 9a4 4 0 0 1 0 6"></path><path d="M18 6.5a7.5 7.5 0 0 1 0 11"></path></svg>音声
    </button>
    <button class="cat">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18"></path><path d="M12 3a14 14 0 0 0 0 18"></path></svg>言語
    </button>
  </nav>

  <section aria-label="再生の設定" style="position: absolute; left: 428px; right: 84px; top: 140px; display: flex; flex-direction: column; gap: 14px">
    <div class="card">
      <div class="row">
        <div class="lab"><b>動画プレイヤー <small>(Global)</small></b><span>AVPro は動画と配信、画像は画像を表示</span></div>
        <div class="seg">
          <button aria-pressed="true" style="background: color-mix(in srgb, #4FC3F7 32%, rgba(0,0,0,0.2)); color: #FFFFFF">AVPro</button>
          <button>画像</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div class="lab"><b>再生速度 <small>(Global)</small></b><span>変えると読み込み直します</span></div>
        <span style="font-size: 30px; font-weight: 700; color: #C9CCD4; font-variant-numeric: tabular-nums">1.00x</span>
      </div>
      <div aria-hidden="true" style="position: relative; height: 52px">
        <div style="position: absolute; left: 0; right: 0; top: 22px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.22)"></div>
        <div style="position: absolute; left: 0; width: 46%; top: 22px; height: 8px; border-radius: 4px; background: #4FC3F7"></div>
        <div style="position: absolute; left: calc(46% - 26px); top: 0; width: 52px; height: 52px; border-radius: 26px; background: #FFFFFF"></div>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div class="lab"><b>区間リピート再生 <small>(Global)</small></b><span>動画が変わると戻ります</span></div>
        <div class="seg">
          <button aria-pressed="true" style="background: color-mix(in srgb, #4FC3F7 32%, rgba(0,0,0,0.2)); color: #FFFFFF">オフ</button>
          <button>オン</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div class="lab"><b>自動再生 <small>(Global)</small></b><span>入ったときに流す URL・未設定</span></div>
        <div class="seg">
          <button style="display: flex; align-items: center; gap: 8px; padding: 0 22px 0 32px">設定する
            <svg class="ic" viewBox="0 0 24 24" style="width: 30px; height: 30px" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
        </div>
      </div>
    </div>
    <p style="margin: 6px 0 0 4px; font-size: 22px; color: #A3A6B0">(Global) の付いた設定は、インスタンスの全員に反映されます。ほかの設定は、あなたにだけ反映されます。</p>
  </section>

  <div aria-hidden="true" style="position: absolute; right: 48px; top: 140px; width: 8px; height: 640px; border-radius: 4px; background: rgba(255,255,255,0.1)">
    <div style="width: 8px; height: 520px; border-radius: 4px; background: rgba(255,255,255,0.4)"></div>
  </div>
</div>
</body></html>
