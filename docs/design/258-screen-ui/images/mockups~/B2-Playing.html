<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
body{margin:0}
a{color:#4FC3F7}a:hover{color:#B3E5FC}
button{font-family:inherit;color:inherit;border:0;margin:0;cursor:pointer}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
.glass{background:rgba(22,24,28,0.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.cb{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1);padding:0;flex-shrink:0}
.cb svg{width:40px;height:40px}
.pill{height:84px;padding:0 30px 0 24px;border-radius:42px;display:flex;align-items:center;gap:12px;font-size:26px;font-weight:700;flex-shrink:0;background:rgba(255,255,255,0.1)}
.pill svg{width:38px;height:38px}
</style>
</head><body style="margin:0">

<div style="width: 1600px; height: 900px; position: relative; overflow: hidden; background: #1A1B1F; font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif; color: #E4E5EA">
  <svg viewBox="0 0 1600 900" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color: #E9A982"></stop>
        <stop offset="0.55" style="stop-color: #F4D3A4"></stop>
        <stop offset="1" style="stop-color: #A8CFDF"></stop>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"></rect>
    <circle cx="1120" cy="290" r="88" fill="#FFF3DC"></circle>
    <polygon points="0,520 220,380 420,500 640,340 900,520 1100,420 1340,540 1600,400 1600,900 0,900" fill="#7896AB"></polygon>
    <polygon points="0,630 300,510 560,610 820,490 1080,620 1360,530 1600,610 1600,900 0,900" fill="#557489"></polygon>
    <path d="M0 750 C 400 690 800 820 1600 710 L1600 900 L0 900 Z" fill="#86BCD3"></path>
    <path d="M0 820 C 500 780 1000 880 1600 800 L1600 900 L0 900 Z" fill="#B7DCEA"></path>
  </svg>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 380px; background: linear-gradient(to top, rgba(10,12,16,0.86) 0%, rgba(10,12,16,0.62) 55%, rgba(10,12,16,0) 100%)"></div>

  <div class="glass" style="position: absolute; left: 40px; top: 32px; padding: 18px 28px; border-radius: 28px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 30px; font-weight: 700">サンプル曲 03</span>
    <span style="font-size: 22px; color: #A3A6B0">作業用BGM ・ 3 / 8 曲</span>
  </div>

  <div class="glass" role="tooltip" style="position: absolute; left: 220px; top: 640px; width: 140px; height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700">シャッフル</div>

  <section aria-label="再生の操作" style="position: absolute; left: 48px; right: 48px; bottom: 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 24px; height: 36px">
      <span style="font-size: 24px; font-variant-numeric: tabular-nums">01:24</span>
      <div style="flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.28); position: relative">
        <div style="width: 33%; height: 8px; border-radius: 4px; background: #4FC3F7"></div>
        <div style="position: absolute; left: 33%; top: -10px; width: 28px; height: 28px; margin-left: -14px; border-radius: 14px; background: #FFFFFF"></div>
      </div>
      <span style="font-size: 24px; color: #C9CCD4; font-variant-numeric: tabular-nums">04:12</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px">
      <div style="display: flex; align-items: center; gap: 16px">
        <button class="cb" aria-label="URL を入力">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"></path><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>
        </button>
        <button class="cb" aria-label="ループ" aria-pressed="true" style="color: #4FC3F7; box-shadow: inset 0 0 0 3px #4FC3F7">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2.5l3 3-3 3"></path><path d="M4 11v-1.5a4 4 0 0 1 4-4h12"></path><path d="M7 21.5l-3-3 3-3"></path><path d="M20 13v1.5a4 4 0 0 1-4 4H4"></path></svg>
        </button>
        <button class="cb" aria-label="シャッフル" style="background: rgba(255,255,255,0.24)">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
        </button>
        <button class="cb" aria-label="ReSync">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"></path><path d="M20 4v5h-5"></path></svg>
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 20px">
        <button class="cb" aria-label="前の曲">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14"></path><path class="f" d="M19 5.5v13L9 12z"></path></svg>
        </button>
        <button class="cb" aria-label="一時停止" style="width: 104px; height: 104px; border-radius: 52px; background: #4FC3F7; color: #10161C">
          <svg class="ic" viewBox="0 0 24 24" style="width: 50px; height: 50px" aria-hidden="true"><rect class="f" x="6.5" y="5" width="4" height="14" rx="1"></rect><rect class="f" x="13.5" y="5" width="4" height="14" rx="1"></rect></svg>
        </button>
        <button class="cb" aria-label="次の曲">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14"></path><path class="f" d="M5 5.5v13L15 12z"></path></svg>
        </button>
        <button class="cb" aria-label="停止">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect class="f" x="6" y="6" width="12" height="12" rx="2"></rect></svg>
        </button>
      </div>
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 16px">
        <button class="cb" aria-label="音量">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"></path><path d="M15.5 9a4 4 0 0 1 0 6"></path><path d="M18 6.5a7.5 7.5 0 0 1 0 11"></path></svg>
        </button>
        <button class="cb" aria-label="一覧">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h11"></path><path d="M4 11h11"></path><path d="M4 16h7"></path><path d="M19 5v10.5"></path><circle cx="17" cy="16" r="2"></circle></svg>
        </button>
        <button class="cb" aria-label="設定">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><path d="M4 17h4"></path><path d="M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
        </button>
        <button class="cb" aria-label="その他（Info・UI ロック）">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle class="f" cx="5" cy="12" r="1.8"></circle><circle class="f" cx="12" cy="12" r="1.8"></circle><circle class="f" cx="19" cy="12" r="1.8"></circle></svg>
        </button>
      </div>
    </div>
  </section>
</div>
</body></html>
