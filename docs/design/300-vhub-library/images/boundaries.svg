<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">個人用の鍵と、全員へ共有するデータを分ける</title><desc id="desc">設計の必須条件 — 既存 DynamicPlaylist の取得元 URL は同期されるため、そのまま個人 URL を渡さない</desc><style>text{font-family:"Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif}</style><defs><marker id="195DAA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195DAA"/></marker><marker id="176C55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176C55"/></marker><marker id="A3343A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A3343A"/></marker></defs><rect width="1200" height="720" fill="#FFFFFF"/><text x="40" y="48" font-size="28" font-weight="700" fill="#183047"><tspan x="40" dy="0">個人用の鍵と、全員へ共有するデータを分ける</tspan></text><text x="40" y="82" font-size="17" font-weight="400" fill="#465D70"><tspan x="40" dy="0">設計の必須条件 — 既存 DynamicPlaylist の取得元 URL は同期されるため、そのまま個人 URL を渡さない</tspan></text><text x="40" y="132" font-size="23" font-weight="700" fill="#195DAA"><tspan x="40" dy="0">VHub Playlist</tspan></text><text x="440" y="132" font-size="23" font-weight="700" fill="#195DAA"><tspan x="440" dy="0">各自の KawaPlayer モジュール</tspan></text><text x="840" y="132" font-size="23" font-weight="700" fill="#176C55"><tspan x="840" dy="0">全員で使う共有状態</tspan></text><rect x="40" y="170" width="300" height="172" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="60" y="206" font-size="21" font-weight="700" fill="#195DAA"><tspan x="60" dy="0">個人カタログ API</tspan></text><text x="60" y="247" font-size="18" font-weight="400" fill="#183047"><tspan x="60" dy="0">Web で本人を確認して発行</tspan><tspan x="60" dy="28">読み取り専用 grant を検証</tspan><tspan x="60" dy="28">自作 / お気に入りの概要だけ</tspan></text><rect x="440" y="170" width="300" height="172" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="460" y="206" font-size="21" font-weight="700" fill="#195DAA"><tspan x="460" dy="0">ローカルのライブラリ</tspan></text><text x="460" y="247" font-size="18" font-weight="400" fill="#183047"><tspan x="460" dy="0">連携 URL はここでだけ使う</tspan><tspan x="460" dy="28">接続・一覧表示・切断</tspan><tspan x="460" dy="28">所有権や共有枠を変えない</tspan></text><rect x="840" y="170" width="320" height="172" rx="14" fill="#FFF1F1" stroke="#A3343A" stroke-width="2"/><text x="860" y="206" font-size="21" font-weight="700" fill="#A3343A"><tspan x="860" dy="0">共有してはいけないもの</tspan></text><text x="860" y="247" font-size="18" font-weight="400" fill="#183047"><tspan x="860" dy="0">連携キー / Cookie / token</tspan><tspan x="860" dy="28">個人の一覧・接続状態</tspan><tspan x="860" dy="28">PlayerData にも保存しない</tspan></text><polyline points="350,250 425,250" fill="none" stroke="#195DAA" stroke-width="3" marker-end="url(#195DAA)"/><text x="352" y="222" font-size="16" font-weight="700" fill="#195DAA"><tspan x="352" dy="0">200 JSON</tspan></text><line x1="790" y1="150" x2="790" y2="620" stroke="#A3343A" stroke-width="2" stroke-dasharray="7 7"/><text x="748" y="381" font-size="17" font-weight="700" fill="#A3343A"><tspan x="748" dy="0">同期境界</tspan></text><polyline points="590,350 590,421" fill="none" stroke="#176C55" stroke-width="3" marker-end="url(#176C55)"/><text x="610" y="386" font-size="18" font-weight="700" fill="#176C55"><tspan x="610" dy="0">選択</tspan></text><rect x="40" y="430" width="300" height="172" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="60" y="466" font-size="21" font-weight="700" fill="#176C55"><tspan x="60" dy="0">公開リストの選択先</tspan></text><text x="60" y="507" font-size="18" font-weight="400" fill="#183047"><tspan x="60" dy="0">事前ベイク URL の番号で取得</tspan><tspan x="60" dy="28">番号と ID は固定する案</tspan><tspan x="60" dy="28">公開データの 200 JSON だけ</tspan></text><rect x="440" y="430" width="300" height="172" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="460" y="466" font-size="21" font-weight="700" fill="#176C55"><tspan x="460" dy="0">検証して既存処理へ</tspan></text><text x="460" y="507" font-size="18" font-weight="400" fill="#183047"><tspan x="460" dy="0">応答 ID と選択 ID が一致</tspan><tspan x="460" dy="28">権限・入替確認を通す</tspan><tspan x="460" dy="28">個人キーを含まない参照</tspan></text><rect x="840" y="430" width="320" height="172" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="860" y="466" font-size="21" font-weight="700" fill="#176C55"><tspan x="860" dy="0">選んだプレイリスト</tspan></text><text x="860" y="507" font-size="18" font-weight="400" fill="#183047"><tspan x="860" dy="0">曲名・動画 Pool の番号 / URL</tspan><tspan x="860" dy="28">キーなしの更新用参照</tspan><tspan x="860" dy="28">後入りの参加者も再生</tspan></text><polyline points="350,516 425,516" fill="none" stroke="#176C55" stroke-width="3" marker-end="url(#176C55)"/><polyline points="750,516 825,516" fill="none" stroke="#176C55" stroke-width="3" marker-end="url(#176C55)"/><text x="40" y="656" font-size="18" font-weight="700" fill="#A3343A"><tspan x="40" dy="0">注意：ローカル表示は、ワールド制作者等からの秘匿を保証するものではありません。</tspan></text><text x="40" y="687" font-size="17" font-weight="400" fill="#465D70"><tspan x="40" dy="0">連携 URL は所持者が使える鍵です。短命・範囲限定・失効可能にし、取得済みの情報まで消せるとは説明しません。</tspan></text></svg>
