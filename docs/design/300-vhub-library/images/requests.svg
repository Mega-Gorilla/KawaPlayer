<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc"><title id="title">2 つの GET と、全員へ届くもの</title><desc id="desc">計画案 — 鍵を使うのは ② だけ。③ と ④ には鍵が無いので、後から入った人も同じ枠で再生できる</desc><style>text{font-family:"Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif}</style><defs><marker id="195DAA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195DAA"/></marker><marker id="176C55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176C55"/></marker><marker id="A3343A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A3343A"/></marker></defs><rect width="1200" height="910" fill="#FFFFFF"/><text x="40" y="48" font-size="28" font-weight="700" fill="#183047"><tspan x="40" dy="0">2 つの GET と、全員へ届くもの</tspan></text><text x="40" y="82" font-size="17" font-weight="400" fill="#465D70"><tspan x="40" dy="0">計画案 — 鍵を使うのは ② だけ。③ と ④ には鍵が無いので、後から入った人も同じ枠で再生できる</tspan></text><text x="40" y="132" font-size="22" font-weight="700" fill="#195DAA"><tspan x="40" dy="0">ブラウザ（PC・スマホ）</tspan></text><text x="440" y="132" font-size="22" font-weight="700" fill="#195DAA"><tspan x="440" dy="0">各自の KawaPlayer（VRChat）</tspan></text><text x="840" y="132" font-size="22" font-weight="700" fill="#195DAA"><tspan x="840" dy="0">VHub（サーバー）</tspan></text><rect x="40" y="155" width="300" height="120" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="60" y="191" font-size="21" font-weight="700" fill="#195DAA"><tspan x="60" dy="0">① 連携 URL を発行</tspan></text><text x="60" y="232" font-size="18" font-weight="400" fill="#183047"><tspan x="60" dy="0">VChat にログインした画面</tspan><tspan x="60" dy="28">期限つきの閲覧用の鍵</tspan></text><rect x="840" y="155" width="320" height="120" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="860" y="191" font-size="21" font-weight="700" fill="#195DAA"><tspan x="860" dy="0">鍵を作って記録</tspan></text><text x="860" y="232" font-size="18" font-weight="400" fill="#183047"><tspan x="860" dy="0">ハッシュだけを保存</tspan><tspan x="860" dy="28">寿命と失効を毎回判定</tspan></text><polyline points="350,215 825,215" fill="none" stroke="#195DAA" stroke-width="3" marker-end="url(#195DAA)"/><text x="560" y="205" font-size="17" font-weight="700" fill="#195DAA"><tspan x="560" dy="0">発行</tspan></text><rect x="440" y="305" width="300" height="130" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="460" y="341" font-size="21" font-weight="700" fill="#195DAA"><tspan x="460" dy="0">② 自分の一覧を読む</tspan></text><text x="460" y="382" font-size="18" font-weight="400" fill="#183047"><tspan x="460" dy="0">貼った連携 URL で取得</tspan><tspan x="460" dy="28">GET /r/library/{鍵}</tspan></text><rect x="840" y="305" width="320" height="130" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="860" y="341" font-size="21" font-weight="700" fill="#195DAA"><tspan x="860" dy="0">本人の一覧</tspan></text><text x="860" y="382" font-size="18" font-weight="400" fill="#183047"><tspan x="860" dy="0">公開：概要と番号</tspan><tspan x="860" dy="28">非公開：曲まで入れる</tspan></text><polyline points="750,345 825,345" fill="none" stroke="#195DAA" stroke-width="3" marker-end="url(#195DAA)"/><polyline points="825,395 750,395" fill="none" stroke="#195DAA" stroke-width="3" marker-end="url(#195DAA)"/><text x="760" y="385" font-size="15" font-weight="700" fill="#195DAA"><tspan x="760" dy="0">一覧と番号</tspan></text><rect x="440" y="465" width="300" height="130" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="460" y="501" font-size="21" font-weight="700" fill="#176C55"><tspan x="460" dy="0">③ 公開の 1 件を読む</tspan></text><text x="460" y="542" font-size="18" font-weight="400" fill="#183047"><tspan x="460" dy="0">焼き込み済みの番号の URL</tspan><tspan x="460" dy="28">GET /vrcurl/resolve/{番号}</tspan></text><rect x="840" y="465" width="320" height="130" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="860" y="501" font-size="21" font-weight="700" fill="#176C55"><tspan x="860" dy="0">曲の一覧（公開分）</tspan></text><text x="860" y="542" font-size="18" font-weight="400" fill="#183047"><tspan x="860" dy="0">今の公開の状態を確かめる</tspan><tspan x="860" dy="28">今の resolve と同じ JSON</tspan></text><polyline points="750,505 825,505" fill="none" stroke="#176C55" stroke-width="3" marker-end="url(#176C55)"/><polyline points="825,555 750,555" fill="none" stroke="#176C55" stroke-width="3" marker-end="url(#176C55)"/><text x="765" y="545" font-size="15" font-weight="700" fill="#176C55"><tspan x="765" dy="0">曲と id</tspan></text><rect x="440" y="625" width="720" height="150" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="460" y="661" font-size="21" font-weight="700" fill="#176C55"><tspan x="460" dy="0">④ 照合して全員へ共有</tspan></text><text x="460" y="702" font-size="18" font-weight="400" fill="#183047"><tspan x="460" dy="0">公開：応答の id が選んだリストと同じときだけ進む</tspan><tspan x="460" dy="28">非公開：② で受け取った曲を使う（③ は通さない）</tspan><tspan x="460" dy="28">既存の権限と入替確認を通す。全員へ同期するのは 曲と識別。鍵は含めない</tspan></text><polyline points="590,605 590,617" fill="none" stroke="#176C55" stroke-width="3" marker-end="url(#176C55)"/><polyline points="190,285 190,370 425,370" fill="none" stroke="#195DAA" stroke-width="3" marker-end="url(#195DAA)"/><text x="200" y="355" font-size="16" font-weight="700" fill="#195DAA"><tspan x="200" dy="0">利用者が URL を貼る</tspan></text><rect x="40" y="805" width="1120" height="86" rx="12" fill="#F4F6F8"/><text x="62" y="839" font-size="18" font-weight="400" fill="#183047"><tspan x="62" dy="0">経路を /r/ と /vrcurl/ の下に置くのは、VRChat からの取得が今の構成でそこだけ届くため（/api/ の下は届かない）。</tspan><tspan x="62" dy="28">③ の番号は検索（#145）と共用する。経路の名前は案で、PoC のあとに確定する。</tspan></text></svg>
