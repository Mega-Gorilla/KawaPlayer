<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">連携キーの寿命と、経路の記録</title><desc id="desc">計画案（D1） — 鍵は経路に入るので、短い寿命で記録の影響を抑える</desc><style>text{font-family:"Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif}</style><defs><marker id="195DAA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195DAA"/></marker><marker id="176C55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176C55"/></marker><marker id="A3343A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A3343A"/></marker></defs><rect width="1200" height="650" fill="#FFFFFF"/><text x="40" y="48" font-size="28" font-weight="700" fill="#183047"><tspan x="40" dy="0">連携キーの寿命と、経路の記録</tspan></text><text x="40" y="82" font-size="17" font-weight="400" fill="#465D70"><tspan x="40" dy="0">計画案（D1） — 鍵は経路に入るので、短い寿命で記録の影響を抑える</tspan></text><text x="40" y="140" font-size="18" font-weight="700" fill="#195DAA"><tspan x="40" dy="0">発行</tspan></text><rect x="40" y="155" width="230" height="40" rx="6" fill="#DCE9F7"/><text x="56" y="182" font-size="17" font-weight="700" fill="#195DAA"><tspan x="56" dy="0">鍵が使える（案：60 分）</tspan></text><text x="280" y="182" font-size="18" font-weight="700" fill="#195DAA"><tspan x="280" dy="0">← 失効</tspan></text><rect x="40" y="215" width="1120" height="40" rx="6" fill="#ECEFF2"/><text x="56" y="242" font-size="17" font-weight="700" fill="#465D70"><tspan x="56" dy="0">経路の記録が残る（途中のプロキシのアクセスログ。数十日）</tspan></text><text x="40" y="300" font-size="17" font-weight="400" fill="#183047"><tspan x="40" dy="0">失効したあとの鍵は、記録に残っていても使えない。寿命を延ばすほど、記録の中の鍵が使える時間も延びる。</tspan></text><rect x="40" y="340" width="545" height="175" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="60" y="376" font-size="21" font-weight="700" fill="#195DAA"><tspan x="60" dy="0">受け入れる</tspan></text><text x="60" y="417" font-size="18" font-weight="400" fill="#183047"><tspan x="60" dy="0">寿命を短いまま保つ（延ばさない）</tspan><tspan x="60" dy="28">記録の設定は変えない</tspan><tspan x="60" dy="28">→ D1 の寿命の上限になる</tspan></text><rect x="615" y="340" width="545" height="175" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="635" y="376" font-size="21" font-weight="700" fill="#195DAA"><tspan x="635" dy="0">外す</tspan></text><text x="635" y="417" font-size="18" font-weight="400" fill="#183047"><tspan x="635" dy="0">一覧の経路だけ、アクセスログから外す</tspan><tspan x="635" dy="28">サーバー側の作業（VHub #317）</tspan><tspan x="635" dy="28">→ 寿命を延ばす余地ができる</tspan></text><rect x="40" y="545" width="1120" height="86" rx="12" fill="#F4F6F8"/><text x="62" y="579" font-size="18" font-weight="400" fill="#183047"><tspan x="62" dy="0">どちらでも、アプリのログには鍵を出さない。VRChat や CDN の記録は制御できないので、残るリスクとして説明する。</tspan><tspan x="62" dy="28">失効で止まるのは後の取得だけ。取得済みの一覧や、共有済みのリストは消えない。</tspan></text></svg>
