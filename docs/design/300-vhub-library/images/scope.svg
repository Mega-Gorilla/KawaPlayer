<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">非公開リストをどう扱うか（D7）</title><desc id="desc">判断待ち — 公開だけにすると、作成者のほぼ半分はワールドで一覧が空になる</desc><style>text{font-family:"Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif}</style><defs><marker id="195DAA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195DAA"/></marker><marker id="176C55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176C55"/></marker><marker id="A3343A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A3343A"/></marker></defs><rect width="1200" height="700" fill="#FFFFFF"/><text x="40" y="48" font-size="28" font-weight="700" fill="#183047"><tspan x="40" dy="0">非公開リストをどう扱うか（D7）</tspan></text><text x="40" y="82" font-size="17" font-weight="400" fill="#465D70"><tspan x="40" dy="0">判断待ち — 公開だけにすると、作成者のほぼ半分はワールドで一覧が空になる</tspan></text><text x="40" y="128" font-size="19" font-weight="700" fill="#465D70"><tspan x="40" dy="0">本番の割合（2026-11-11、おおよそ）</tspan></text><text x="40" y="170" font-size="19" font-weight="700" fill="#183047"><tspan x="40" dy="0">プレイリスト</tspan></text><rect x="260" y="146" width="455" height="38" rx="6" fill="#D7ECE3"/><rect x="715" y="146" width="405" height="38" rx="6" fill="#F6DADB"/><text x="276" y="172" font-size="17" font-weight="700" fill="#176C55"><tspan x="276" dy="0">公開　約半分</tspan></text><text x="731" y="172" font-size="17" font-weight="700" fill="#A3343A"><tspan x="731" dy="0">非公開（URL 限定）　約半分</tspan></text><text x="40" y="230" font-size="19" font-weight="700" fill="#183047"><tspan x="40" dy="0">作成した人</tspan></text><rect x="260" y="206" width="473" height="38" rx="6" fill="#D7ECE3"/><rect x="733" y="206" width="387" height="38" rx="6" fill="#F6DADB"/><text x="276" y="232" font-size="17" font-weight="700" fill="#176C55"><tspan x="276" dy="0">公開のリストがある　約半分</tspan></text><text x="749" y="232" font-size="17" font-weight="700" fill="#A3343A"><tspan x="749" dy="0">非公開だけ　約半分 → 案 A では一覧が空</tspan></text><rect x="40" y="290" width="355" height="270" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="60" y="326" font-size="21" font-weight="700" fill="#195DAA"><tspan x="60" dy="0">A. 公開だけ</tspan></text><text x="60" y="367" font-size="18" font-weight="400" fill="#183047"><tspan x="60" dy="0">一覧：公開のリストだけ</tspan><tspan x="60" dy="28">＋ 今の計画のまま</tspan><tspan x="60" dy="28">＋ 作りがいちばん小さい</tspan><tspan x="60" dy="28">－ 作成者の約半分は</tspan><tspan x="60" dy="28">　 一覧が空になる</tspan></text><rect x="422" y="290" width="356" height="270" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="442" y="326" font-size="21" font-weight="700" fill="#176C55"><tspan x="442" dy="0">B. 非公開も選べる</tspan></text><text x="442" y="367" font-size="18" font-weight="400" fill="#183047"><tspan x="442" dy="0">一覧：非公開も出して選べる</tspan><tspan x="442" dy="28">＋ 全員の役に立つ</tspan><tspan x="442" dy="28">－ 鍵のない取得先が無く、</tspan><tspan x="442" dy="28">　 共有後の更新と後入りを</tspan><tspan x="442" dy="28">　 別に決める必要がある</tspan></text><rect x="805" y="290" width="355" height="270" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="825" y="326" font-size="21" font-weight="700" fill="#195DAA"><tspan x="825" dy="0">C. 非公開は名前だけ</tspan></text><text x="825" y="367" font-size="18" font-weight="400" fill="#183047"><tspan x="825" dy="0">一覧：非公開は名前だけ</tspan><tspan x="825" dy="28">＋ 作りが小さい</tspan><tspan x="825" dy="28">－ 一覧に出ても選べない</tspan><tspan x="825" dy="28">　（今までどおり</tspan><tspan x="825" dy="28">　  VRChat用URL を貼る）</tspan></text><rect x="40" y="590" width="1120" height="86" rx="12" fill="#FFF5E8"/><text x="62" y="624" font-size="18" font-weight="400" fill="#183047"><tspan x="62" dy="0">お気に入りを使っている人はごく少ないので、この機能の中心は「作成したプレイリスト」になる。</tspan><tspan x="62" dy="28">どれにするかで通信の作り（6.1）と共有の境界（4 章）が変わる。PoC（Gate A）の前に決める。</tspan></text></svg>
