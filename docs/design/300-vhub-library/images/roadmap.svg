<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc"><title id="title">両リポジトリの分担と、実装する順序</title><desc id="desc">計画案 — PoC → 共通契約 → サーバーとクライアント → 統合 QA。製品コードと本番設定はまだ変更しない</desc><style>text{font-family:"Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif}</style><defs><marker id="195DAA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195DAA"/></marker><marker id="176C55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176C55"/></marker><marker id="A3343A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A3343A"/></marker></defs><rect width="1200" height="665" fill="#FFFFFF"/><text x="40" y="48" font-size="28" font-weight="700" fill="#183047"><tspan x="40" dy="0">両リポジトリの分担と、実装する順序</tspan></text><text x="40" y="82" font-size="17" font-weight="400" fill="#465D70"><tspan x="40" dy="0">計画案 — PoC → 共通契約 → サーバーとクライアント → 統合 QA。製品コードと本番設定はまだ変更しない</tspan></text><rect x="40" y="230" width="245" height="180" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="60" y="266" font-size="21" font-weight="700" fill="#195DAA"><tspan x="60" dy="0">1  PoC と契約  #301</tspan></text><text x="60" y="307" font-size="18" font-weight="400" fill="#183047"><tspan x="60" dy="0">PC / Quest の取得・容量</tspan><tspan x="60" dy="28">鍵・ログ・同期の漏れ</tspan><tspan x="60" dy="28">通った契約を文書化</tspan></text><rect x="390" y="120" width="320" height="170" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="410" y="156" font-size="21" font-weight="700" fill="#195DAA"><tspan x="410" dy="0">2a  VHub 側  #317</tspan></text><text x="410" y="197" font-size="18" font-weight="400" fill="#183047"><tspan x="410" dy="0">連携 URL 発行・失効 UI</tspan><tspan x="410" dy="28">個人 API / 公開の選択先</tspan><tspan x="410" dy="28">制限・キャッシュ・運用</tspan></text><rect x="390" y="355" width="320" height="170" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="410" y="391" font-size="21" font-weight="700" fill="#195DAA"><tspan x="410" dy="0">2b  KawaPlayer 側  #302</tspan></text><text x="410" y="432" font-size="18" font-weight="400" fill="#183047"><tspan x="410" dy="0">任意モジュールと個人 UI</tspan><tspan x="410" dy="28">選んだリストだけ共有</tspan><tspan x="410" dy="28">既存処理と権限を再利用</tspan></text><rect x="835" y="230" width="325" height="180" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="855" y="266" font-size="21" font-weight="700" fill="#176C55"><tspan x="855" dy="0">3  統合 QA と公開  #300</tspan></text><text x="855" y="307" font-size="18" font-weight="400" fill="#183047"><tspan x="855" dy="0">2 アカウント / PC・Quest</tspan><tspan x="855" dy="28">従来の URL 入力の回帰</tspan><tspan x="855" dy="28">ガイド・運用手順・停止手段</tspan></text><polyline points="295,315 335,315 335,205 375,205" fill="none" stroke="#195DAA" stroke-width="3" marker-end="url(#195DAA)"/><polyline points="335,315 335,440 375,440" fill="none" stroke="#195DAA" stroke-width="3" marker-end="url(#195DAA)"/><text x="297" y="102" font-size="18" font-weight="700" fill="#195DAA"><tspan x="297" dy="0">Gate A：PoC 成功後だけ進む</tspan></text><polyline points="720,205 773,205 773,315 820,315" fill="none" stroke="#176C55" stroke-width="3" marker-end="url(#176C55)"/><polyline points="720,440 773,440 773,315" fill="none" stroke="#176C55" stroke-width="3" marker-end="url(#176C55)"/><rect x="40" y="565" width="1120" height="72" rx="12" fill="#FFF5E8"/><text x="60" y="596" font-size="20" font-weight="700" fill="#183047"><tspan x="60" dy="0">PoC が通らなければ停止。既存の VRChat用URL の手動入力は維持する。</tspan></text><text x="60" y="622" font-size="16" font-weight="400" fill="#465D70"><tspan x="60" dy="0">対象リリース、具体的な期限・上限・ベイク数は未定。図の箱が作成済み / 実装済みという意味ではありません。</tspan></text></svg>
