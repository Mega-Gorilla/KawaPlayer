<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">使う人から見た VHub Library 連携</title><desc id="desc">計画案 / issue #300 — Web で認証し、VRChat では選んで共有する</desc><style>text{font-family:"Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif}</style><defs><marker id="195DAA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195DAA"/></marker><marker id="176C55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176C55"/></marker><marker id="A3343A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A3343A"/></marker></defs><rect width="1200" height="510" fill="#FFFFFF"/><text x="40" y="48" font-size="28" font-weight="700" fill="#183047"><tspan x="40" dy="0">使う人から見た VHub Library 連携</tspan></text><text x="40" y="82" font-size="17" font-weight="400" fill="#465D70"><tspan x="40" dy="0">計画案 / issue #300 — Web で認証し、VRChat では選んで共有する</tspan></text><rect x="40" y="145" width="235" height="185" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="60" y="181" font-size="21" font-weight="700" fill="#195DAA"><tspan x="60" dy="0">1  ブラウザで認証</tspan></text><text x="60" y="222" font-size="18" font-weight="400" fill="#183047"><tspan x="60" dy="0">VChat でログイン</tspan><tspan x="60" dy="28">パスワードは</tspan><tspan x="60" dy="28">ワールドに渡さない</tspan></text><polyline points="284,238 320,238" fill="none" stroke="#195DAA" stroke-width="3" marker-end="url(#195DAA)"/><rect x="335" y="145" width="235" height="185" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="355" y="181" font-size="21" font-weight="700" fill="#195DAA"><tspan x="355" dy="0">2  連携 URL を入力</tspan></text><text x="355" y="222" font-size="18" font-weight="400" fill="#183047"><tspan x="355" dy="0">閲覧専用・期限あり</tspan><tspan x="355" dy="28">URL を専用欄へ貼る</tspan></text><polyline points="579,238 615,238" fill="none" stroke="#195DAA" stroke-width="3" marker-end="url(#195DAA)"/><rect x="630" y="145" width="235" height="185" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="650" y="181" font-size="21" font-weight="700" fill="#195DAA"><tspan x="650" dy="0">3  自分の一覧を開く</tspan></text><text x="650" y="222" font-size="18" font-weight="400" fill="#183047"><tspan x="650" dy="0">自作 / お気に入り</tspan><tspan x="650" dy="28">全員へ同期しない</tspan></text><polyline points="874,238 910,238" fill="none" stroke="#176C55" stroke-width="3" marker-end="url(#176C55)"/><rect x="925" y="145" width="235" height="185" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="945" y="181" font-size="21" font-weight="700" fill="#176C55"><tspan x="945" dy="0">4  選んだ 1 件を共有</tspan></text><text x="945" y="222" font-size="18" font-weight="400" fill="#183047"><tspan x="945" dy="0">既存の権限と入替確認</tspan><tspan x="945" dy="28">選んだリストだけ追加</tspan></text><rect x="40" y="373" width="1120" height="100" rx="12" fill="#F4F6F8"/><text x="62" y="407" font-size="20" font-weight="700" fill="#183047"><tspan x="62" dy="0">最初は公開プレイリストの読み取りだけ。自動ログイン・編集・自動更新は対象外。</tspan></text><text x="62" y="443" font-size="17" font-weight="400" fill="#465D70"><tspan x="62" dy="0">これは利用の流れの設計図です。新機能の画面や実機での動作確認が済んだことを示す画像ではありません。</tspan></text></svg>
