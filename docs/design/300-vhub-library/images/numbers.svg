<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="695" viewBox="0 0 1200 695" role="img" aria-labelledby="title desc"><title id="title">番号は使い回し、id で照合する</title><desc id="desc">計画案（D4） — 永久の番号を作らず、検索と同じ resolve プールを共用する</desc><style>text{font-family:"Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif}</style><defs><marker id="195DAA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195DAA"/></marker><marker id="176C55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176C55"/></marker><marker id="A3343A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A3343A"/></marker></defs><rect width="1200" height="695" fill="#FFFFFF"/><text x="40" y="48" font-size="28" font-weight="700" fill="#183047"><tspan x="40" dy="0">番号は使い回し、id で照合する</tspan></text><text x="40" y="82" font-size="17" font-weight="400" fill="#465D70"><tspan x="40" dy="0">計画案（D4） — 永久の番号を作らず、検索と同じ resolve プールを共用する</tspan></text><rect x="40" y="155" width="470" height="395" rx="14" fill="#FFF1F1" stroke="#A3343A" stroke-width="2"/><text x="60" y="191" font-size="21" font-weight="700" fill="#A3343A"><tspan x="60" dy="0">採らない：リストごとの永久の番号</tspan></text><text x="60" y="232" font-size="18" font-weight="400" fill="#183047"><tspan x="60" dy="0">番号 1 つにリスト 1 つを永久に割り当てる</tspan><tspan x="60" dy="28">焼き込んだ数よりリストが増えると、</tspan><tspan x="60" dy="28">新しいリストが読めない（作り直しが要る）</tspan><tspan x="60" dy="28">廃止した PlaylistViewer 用のプールと</tspan><tspan x="60" dy="28">同じ作り。検索の計画でも採らなかった</tspan></text><text x="560" y="132" font-size="22" font-weight="700" fill="#176C55"><tspan x="560" dy="0">採る：使い回す番号 ＋ id の照合</tspan></text><rect x="560" y="155" width="600" height="125" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="580" y="191" font-size="21" font-weight="700" fill="#176C55"><tspan x="580" dy="0">1. 選ぶ</tspan></text><text x="580" y="232" font-size="18" font-weight="400" fill="#183047"><tspan x="580" dy="0">番号 12 → リスト A を読む</tspan><tspan x="580" dy="28">枠に残す：番号の URL …/resolve/12 と 識別 default/A</tspan></text><rect x="560" y="310" width="600" height="95" rx="14" fill="#F4F6F8" stroke="#465D70" stroke-width="2"/><text x="580" y="346" font-size="21" font-weight="700" fill="#465D70"><tspan x="580" dy="0">2. しばらくして</tspan></text><text x="580" y="387" font-size="18" font-weight="400" fill="#183047"><tspan x="580" dy="0">番号 12 が、別の人の操作でリスト B に使い回される</tspan></text><rect x="560" y="435" width="600" height="125" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="580" y="471" font-size="21" font-weight="700" fill="#176C55"><tspan x="580" dy="0">3. 枠を更新する</tspan></text><text x="580" y="512" font-size="18" font-weight="400" fill="#183047"><tspan x="580" dy="0">…/resolve/12 の応答の id は B。識別 A と違う</tspan><tspan x="580" dy="28">→ 枠は書き換えない（A のまま）。一覧の更新を案内</tspan></text><polyline points="860,284 860,302" fill="none" stroke="#176C55" stroke-width="3" marker-end="url(#176C55)"/><polyline points="860,409 860,427" fill="none" stroke="#176C55" stroke-width="3" marker-end="url(#176C55)"/><rect x="40" y="590" width="1120" height="86" rx="12" fill="#F4F6F8"/><text x="62" y="624" font-size="18" font-weight="400" fill="#183047"><tspan x="62" dy="0">番号の URL は取り出しにだけ使い、どのリストかは応答の id で見分ける。選んだときも、あとの更新でも同じ照合を通す。</tspan><tspan x="62" dy="28">プール（4,096 個）、焼き込む配列、照合の手順は、検索の計画（#145）と 1 つにする。</tspan></text></svg>
