<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="775" viewBox="0 0 1200 775" role="img" aria-labelledby="title desc"><title id="title">連携 URL の入力を軽くする（D8）</title><desc id="desc">決定：B（2026-11-11） — VRChat の制約で入力は無くせない。打つ量を減らし、コードを打てる長さにする</desc><style>text{font-family:"Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif}</style><defs><marker id="195DAA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195DAA"/></marker><marker id="176C55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176C55"/></marker><marker id="A3343A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A3343A"/></marker></defs><rect width="1200" height="775" fill="#FFFFFF"/><text x="40" y="48" font-size="28" font-weight="700" fill="#183047"><tspan x="40" dy="0">連携 URL の入力を軽くする（D8）</tspan></text><text x="40" y="82" font-size="17" font-weight="400" fill="#465D70"><tspan x="40" dy="0">決定：B（2026-11-11） — VRChat の制約で入力は無くせない。打つ量を減らし、コードを打てる長さにする</tspan></text><text x="40" y="128" font-size="17" font-weight="400" fill="#465D70"><tspan x="40" dy="0">青い下線が、使う人が入力する部分。灰色は、はじめから欄に入っている部分。コードは架空の例。</tspan></text><rect x="40" y="150" width="1120" height="150" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="60" y="186" font-size="21" font-weight="700" fill="#195DAA"><tspan x="60" dy="0">A. 連携 URL を丸ごと貼る</tspan></text><text x="60" y="227" font-size="18" font-weight="400" fill="#183047"></text><rect x="60" y="198" width="1080" height="46" rx="8" fill="#FFFFFF" stroke="#8798A8" stroke-width="2"/><text x="74" y="228" font-size="17" font-weight="700" fill="#195DAA"><tspan x="74" dy="0">https://playlist.vrc-hub.com/r/library/Xq7ZL0aB9cDeFgHiJkLmNoPqRsTu</tspan></text><line x1="74" y1="235" x2="784.1999999999999" y2="235" stroke="#195DAA" stroke-width="2"/><line x1="789.1999999999999" y1="208" x2="789.1999999999999" y2="234" stroke="#183047" stroke-width="2"/><text x="60" y="270" font-size="16" font-weight="400" fill="#183047"><tspan x="60" dy="0">PC は貼り付けで済む。VR・Quest では打てない長さ（60 文字前後）。</tspan></text><rect x="40" y="320" width="1120" height="150" rx="14" fill="#EFF8F4" stroke="#176C55" stroke-width="2"/><text x="60" y="356" font-size="21" font-weight="700" fill="#176C55"><tspan x="60" dy="0">B. 前半を入れておき、短いコードだけ打つ（決定）</tspan></text><text x="60" y="397" font-size="18" font-weight="400" fill="#183047"></text><rect x="60" y="368" width="1080" height="46" rx="8" fill="#FFFFFF" stroke="#8798A8" stroke-width="2"/><text x="74" y="398" font-size="16" font-weight="400" fill="#465D70"><tspan x="74" dy="0">https://playlist.vrc-hub.com/r/library/</tspan></text><text x="372.6" y="398" font-size="17" font-weight="700" fill="#195DAA"><tspan x="372.6" dy="0">ABCD-EFGH-JKLM</tspan></text><line x1="372.6" y1="405" x2="521.0" y2="405" stroke="#195DAA" stroke-width="2"/><line x1="526.0" y1="378" x2="526.0" y2="404" stroke="#183047" stroke-width="2"/><text x="60" y="440" font-size="16" font-weight="400" fill="#183047"><tspan x="60" dy="0">打つのは 12 文字ほど。大文字と小文字は区別しない。PC は丸ごと貼ってもよい。</tspan></text><rect x="40" y="490" width="1120" height="150" rx="14" fill="#EFF5FC" stroke="#195DAA" stroke-width="2"/><text x="60" y="526" font-size="21" font-weight="700" fill="#195DAA"><tspan x="60" dy="0">C. 検索の欄にコードを打つ（検索の計画 #145 と共用）</tspan></text><text x="60" y="567" font-size="18" font-weight="400" fill="#183047"></text><rect x="60" y="538" width="1080" height="46" rx="8" fill="#FFFFFF" stroke="#8798A8" stroke-width="2"/><text x="74" y="568" font-size="16" font-weight="400" fill="#465D70"><tspan x="74" dy="0">…/r/search?q=　検索語を入力 →</tspan></text><text x="337.70000000000005" y="568" font-size="17" font-weight="700" fill="#195DAA"><tspan x="337.70000000000005" dy="0">ABCD-EFGH-JKLM</tspan></text><line x1="337.70000000000005" y1="575" x2="486.1" y2="575" stroke="#195DAA" stroke-width="2"/><line x1="491.1" y1="548" x2="491.1" y2="574" stroke="#183047" stroke-width="2"/><text x="60" y="610" font-size="16" font-weight="400" fill="#183047"><tspan x="60" dy="0">専用の欄を作らない。自分の一覧が、検索の結果と同じ形で出る。コードを検索語として表示しない扱いが要る。</tspan></text><rect x="40" y="665" width="1120" height="86" rx="12" fill="#F4F6F8"/><text x="62" y="699" font-size="18" font-weight="400" fill="#183047"><tspan x="62" dy="0">どの案でも、入力は訪問ごとに 1 回。VRChat では URL を保存して次回に使うことができないため。</tspan><tspan x="62" dy="28">読み込んだら欄をすぐ元に戻し、コードを画面に残さない。板を開き直したときも、欄に前半を入れ直す。</tspan></text></svg>
