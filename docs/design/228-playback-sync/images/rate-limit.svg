<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310" role="img" aria-labelledby="t d"><title id="t">読み込みの間引き</title><desc id="d">間引きがないと、5秒以内の2回目と3回目の読み込みはVRChatに断られる。VVMWの方式では、2回目と3回目の頼みは5.05秒の枠の1回にまとまる。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.h1{fill:var(--surface);stroke:var(--s1);stroke-width:2} .h2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.x1{stroke:var(--s1);stroke-width:2;stroke-linecap:round}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .w1{fill:var(--s1);fill-opacity:.12} .w2{fill:var(--s2);fill-opacity:.12} .wash{fill:var(--wash)}
.thr{stroke:var(--muted);stroke-width:1} .lead{stroke:var(--muted);stroke-width:1;fill:none}
.press{stroke:var(--ink2);stroke-width:2;stroke-linecap:round}
.f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .num{font-variant-numeric:tabular-nums}
</style><rect class="bg" x="0" y="0" width="820" height="310" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">読み込みの間引き（読み込み直しを 1.5 秒おきに 3 回押した場合）</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">VRChat は、1 人が新しい URL を読めるのを、すべての動画プレイヤーを合わせて 5 秒に 1 回に限る</text><line class="grid" x1="200.0" x2="200.0" y1="80" y2="262"/><text x="200.0" y="280.0" class="tm f12 num" text-anchor="middle">0</text><line class="grid" x1="249.2" x2="249.2" y1="80" y2="262"/><line class="grid" x1="298.3" x2="298.3" y1="80" y2="262"/><text x="298.3" y="280.0" class="tm f12 num" text-anchor="middle">2</text><line class="grid" x1="347.5" x2="347.5" y1="80" y2="262"/><line class="grid" x1="396.7" x2="396.7" y1="80" y2="262"/><text x="396.7" y="280.0" class="tm f12 num" text-anchor="middle">4</text><line class="grid" x1="445.8" x2="445.8" y1="80" y2="262"/><line class="grid" x1="495.0" x2="495.0" y1="80" y2="262"/><text x="495.0" y="280.0" class="tm f12 num" text-anchor="middle">6</text><line class="grid" x1="544.2" x2="544.2" y1="80" y2="262"/><line class="grid" x1="593.3" x2="593.3" y1="80" y2="262"/><text x="593.3" y="280.0" class="tm f12 num" text-anchor="middle">8</text><line class="grid" x1="642.5" x2="642.5" y1="80" y2="262"/><line class="grid" x1="691.7" x2="691.7" y1="80" y2="262"/><text x="691.7" y="280.0" class="tm f12 num" text-anchor="middle">10</text><line class="grid" x1="740.8" x2="740.8" y1="80" y2="262"/><line class="grid" x1="790.0" x2="790.0" y1="80" y2="262"/><text x="790.0" y="280.0" class="tm f12 num" text-anchor="middle">12</text><text x="495.0" y="300.0" class="tm f12" text-anchor="middle">経過時間（秒）</text><text x="24.0" y="104.0" class="t1 f13" text-anchor="start">押した時刻</text><text x="24.0" y="160.0" class="t1 f13" text-anchor="start">間引きなし（仮定）</text><text x="24.0" y="176.0" class="t2 f12" text-anchor="start">#215 で入口を緩めただけ</text><text x="24.0" y="228.0" class="t1 f13" text-anchor="start">間引きあり</text><text x="24.0" y="244.0" class="t2 f12" text-anchor="start">VVMW の RateLimitResolver</text><line class="press" x1="200.0" x2="200.0" y1="91" y2="109"/><line class="press" x1="273.8" x2="273.8" y1="91" y2="109"/><line class="press" x1="347.5" x2="347.5" y1="91" y2="109"/><rect class="w1" x="200.0" y="148" width="245.8" height="28" rx="4"/><circle class="d1" cx="200.0" cy="162" r="6"/><line class="x1" x1="267.8" y1="156" x2="279.8" y2="168"/><line class="x1" x1="267.8" y1="168" x2="279.8" y2="156"/><line class="x1" x1="341.5" y1="156" x2="353.5" y2="168"/><line class="x1" x1="341.5" y1="168" x2="353.5" y2="156"/><text x="455.8" y="160.0" class="t2 f12" text-anchor="start">2 回目と 3 回目は断られる（RateLimited）</text><text x="455.8" y="176.0" class="t2 f12" text-anchor="start">読めるのはリトライのあと（断られた回数しだい）</text><rect class="w2" x="200.0" y="216" width="248.3" height="28" rx="4"/><rect class="w2" x="450.3" y="216" width="246.3" height="28" rx="4"/><circle class="d2" cx="200.0" cy="230" r="6"/><circle class="h2" cx="273.8" cy="230" r="5"/><path class="lead" d="M279.8,225 Q361.0,200 441.3,225"/><circle class="h2" cx="347.5" cy="230" r="5"/><path class="lead" d="M353.5,225 Q397.9,200 441.3,225"/><circle class="d2" cx="448.3" cy="230" r="6"/><text x="458.3" y="260.0" class="t2 f12" text-anchor="start">5.05 秒に 1 回だけ読む（最後に頼まれた URL）</text><text x="273.8" y="260.0" class="t2 f12" text-anchor="middle">待つ</text><rect class="w1" x="200" y="56" width="7" height="12"/><rect class="w2" x="207" y="56" width="7" height="12"/><text x="220.0" y="66.0" class="t2 f12" text-anchor="start">次の URL を読めない 5 秒</text><circle class="d1" cx="396" cy="62" r="5"/><circle class="d2" cx="410" cy="62" r="5"/><text x="422.0" y="66.0" class="t2 f12" text-anchor="start">読む</text><line class="x1" x1="462" y1="57" x2="472" y2="67"/><line class="x1" x1="462" y1="67" x2="472" y2="57"/><text x="480.0" y="66.0" class="t2 f12" text-anchor="start">断られる</text><circle class="h2" cx="546" cy="62" r="5"/><text x="558.0" y="66.0" class="t2 f12" text-anchor="start">頼んで待つ</text></svg>
