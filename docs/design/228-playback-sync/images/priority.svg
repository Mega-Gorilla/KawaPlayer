<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-labelledby="t d"><title id="t">問題ごとの影響と直す難しさ</title><desc id="d">P1は影響大・難しさ中、P7は影響大・難しさ小、P4とP5は影響中・難しさ小、P9は影響中・難しさ小で要測定、P8は影響中・難しさ中、P6は影響中・難しさ中で要測定、P2とP3は影響小・難しさ小。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.h1{fill:var(--surface);stroke:var(--s1);stroke-width:2} .h2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.x1{stroke:var(--s1);stroke-width:2;stroke-linecap:round}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .w1{fill:var(--s1);fill-opacity:.12} .w2{fill:var(--s2);fill-opacity:.12} .wash{fill:var(--wash)}
.thr{stroke:var(--muted);stroke-width:1} .lead{stroke:var(--muted);stroke-width:1;fill:none}
.press{stroke:var(--ink2);stroke-width:2;stroke-linecap:round}
.f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .num{font-variant-numeric:tabular-nums}
</style><rect class="bg" x="0" y="0" width="820" height="560" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">問題ごとの影響と、直す難しさ（目安）</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">どちらも 3 段階の目安。左上（影響が大きく、手間が小さい）ほど先に直す価値が高い</text><line class="grid" x1="110.0" x2="110.0" y1="86" y2="484"/><line class="grid" x1="110" x2="790" y1="86.0" y2="86.0"/><line class="grid" x1="336.7" x2="336.7" y1="86" y2="484"/><line class="grid" x1="110" x2="790" y1="218.7" y2="218.7"/><line class="grid" x1="563.3" x2="563.3" y1="86" y2="484"/><line class="grid" x1="110" x2="790" y1="351.3" y2="351.3"/><line class="grid" x1="790.0" x2="790.0" y1="86" y2="484"/><line class="grid" x1="110" x2="790" y1="484.0" y2="484.0"/><line class="axis" x1="110" x2="790" y1="484" y2="484"/><line class="axis" x1="110" x2="110" y1="86" y2="484"/><text x="223.3" y="504.0" class="tm f12" text-anchor="middle">小</text><text x="98.0" y="421.7" class="tm f12" text-anchor="end">小</text><text x="450.0" y="504.0" class="tm f12" text-anchor="middle">中</text><text x="98.0" y="289.0" class="tm f12" text-anchor="end">中</text><text x="676.7" y="504.0" class="tm f12" text-anchor="middle">大</text><text x="98.0" y="156.3" class="tm f12" text-anchor="end">大</text><text x="450.0" y="526.0" class="tm f12" text-anchor="middle">直す難しさ（実装と確認）</text><text x="98.0" y="76.0" class="tm f12" text-anchor="end">影響</text><circle class="d1" cx="450.0" cy="152.3" r="7"/><text x="450.0" y="139.3" class="t1 f12" text-anchor="middle">P1</text><text x="450.0" y="175.3" class="t2 f12" text-anchor="middle">自分だけ止まって戻せない</text><circle class="d1" cx="223.3" cy="152.3" r="7"/><text x="223.3" y="139.3" class="t1 f12" text-anchor="middle">P7</text><text x="223.3" y="175.3" class="t2 f12" text-anchor="middle">オーナー交代で先頭に戻る</text><circle class="d1" cx="185.3" cy="249.0" r="7"/><text x="185.3" y="236.0" class="t1 f12" text-anchor="middle">P4</text><text x="185.3" y="272.0" class="t2 f12" text-anchor="middle">読み込み直しに権限が要る</text><circle class="d1" cx="271.3" cy="283.0" r="7"/><text x="271.3" y="270.0" class="t1 f12" text-anchor="middle">P5</text><text x="271.3" y="306.0" class="t2 f12" text-anchor="middle">間引きがリトライだけ</text><circle class="d2" cx="185.3" cy="317.0" r="7"/><text x="185.3" y="304.0" class="t1 f12" text-anchor="middle">P9</text><text x="185.3" y="340.0" class="t2 f12" text-anchor="middle">時計がずれたまま直らない</text><circle class="d1" cx="395.0" cy="269.0" r="7"/><text x="395.0" y="256.0" class="t1 f12" text-anchor="middle">P8</text><text x="395.0" y="292.0" class="t2 f12" text-anchor="middle">全員を読み直す手段がない</text><circle class="d2" cx="505.0" cy="303.0" r="7"/><text x="505.0" y="290.0" class="t1 f12" text-anchor="middle">P6</text><text x="505.0" y="326.0" class="t2 f12" text-anchor="middle">バッファ中の時刻合わせ</text><circle class="d1" cx="183.3" cy="401.7" r="7"/><text x="183.3" y="388.7" class="t1 f12" text-anchor="middle">P2</text><text x="183.3" y="424.7" class="t2 f12" text-anchor="middle">押せるのに何も起きない</text><circle class="d1" cx="263.3" cy="435.7" r="7"/><text x="263.3" y="422.7" class="t1 f12" text-anchor="middle">P3</text><text x="263.3" y="458.7" class="t2 f12" text-anchor="middle">オーナーの読み直しが送る</text><circle class="d1" cx="116" cy="544" r="6"/><text x="128.0" y="548.0" class="t2 f12" text-anchor="start">コードか VRChat で確かめた</text><circle class="d2" cx="320" cy="544" r="6"/><text x="332.0" y="548.0" class="t2 f12" text-anchor="start">頻度や数値を実機で測る（位置は仮）</text></svg>
