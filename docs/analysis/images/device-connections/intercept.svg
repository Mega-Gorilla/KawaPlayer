<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 568" width="820" height="568" role="img" aria-labelledby="t d"><title id="t">URL 欄の差し込み口（E7）</title><desc id="d">URL欄で再生すると、UIControllerは_urlInterceptorのPlaylistLoaderUIにinterceptUrlとinterceptSourceを書いてOnUrlSubmittedを送る。PlaylistLoaderUIはVHubのURLなら読み込みを始めてinterceptHandledをtrueにし、その場で返る。falseなら、UIControllerが動画として再生する。ダウンロードの結果はあとからOnLoadResultに届き、UIControllerのShowMessageで案内する。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="568" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">URL 欄の差し込み口（E7）</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">差し込みはその場で handled を返し、ダウンロードの結果はあとから OnLoadResult に届く。コアは VHub を知らない</text><line class="axis" x1="101.2" x2="101.2" y1="114" y2="550.0"/><rect class="box" x="29.0" y="70" width="144.4" height="34" rx="6"/><text x="101.2" y="91.0" class="t1 f12" text-anchor="middle">URL 欄</text><line class="axis" x1="255.6" x2="255.6" y1="114" y2="550.0"/><rect class="box" x="183.40000000000003" y="70" width="144.4" height="34" rx="6"/><text x="255.6" y="91.0" class="t1 f12" text-anchor="middle">UIController</text><line class="axis" x1="410.0" x2="410.0" y1="114" y2="550.0"/><rect class="box" x="337.8" y="70" width="144.4" height="44" rx="6"/><text x="410.0" y="87.5" class="t1 f12" text-anchor="middle">PlaylistLoaderUI</text><text x="410.0" y="104.5" class="t2 f11" text-anchor="middle">（_urlInterceptor）</text><line class="axis" x1="564.4" x2="564.4" y1="114" y2="550.0"/><rect class="box" x="492.2" y="70" width="144.4" height="34" rx="6"/><text x="564.4" y="91.0" class="t1 f12" text-anchor="middle">PlaylistLoader</text><line class="axis" x1="718.8" x2="718.8" y1="114" y2="550.0"/><rect class="box" x="646.6" y="70" width="144.4" height="34" rx="6"/><text x="718.8" y="91.0" class="t1 f12" text-anchor="middle">VHub</text><text x="178.4" y="134.0" class="t2 f12" text-anchor="middle">PlayUrl</text><path class="arr" d="M101.2,140 L251.6,140" marker-end="url(#h)"/><text x="332.8" y="170.0" class="t2 f12" text-anchor="middle">interceptUrl・interceptSource を書き、OnUrlSubmitted</text><path class="arr" d="M255.6,176 L406.0,176" marker-end="url(#h)"/><rect class="ask" x="315.0" y="200" width="190.0" height="46" rx="6"/><text x="410.0" y="218.0" class="t1 f12" text-anchor="middle">VHub の VRChat用URL か？</text><text x="410.0" y="235.0" class="t1 f12" text-anchor="middle">BeforeUserLoadPlaylist も通す</text><text x="487.2" y="266.0" class="t2 f12" text-anchor="middle">LoadPlaylistFromUrlWithFeedback（始めるだけ）</text><path class="arr" d="M410.0,272 L560.4,272" marker-end="url(#h)"/><text x="332.8" y="302.0" class="t2 f12" text-anchor="middle">interceptHandled = true（その場で返る）</text><path class="arrd" d="M410.0,308 L259.6,308" marker-end="url(#hm)"/><rect class="ask" x="160.6" y="332" width="190.0" height="46" rx="6"/><text x="255.6" y="350.0" class="t1 f12" text-anchor="middle">false なら、そのまま</text><text x="255.6" y="367.0" class="t1 f12" text-anchor="middle">動画として再生する</text><text x="641.6" y="398.0" class="t2 f12" text-anchor="middle">文字列のダウンロード（あとで）</text><path class="arr" d="M564.4,404 L714.8,404" marker-end="url(#h)"/><text x="641.6" y="434.0" class="t2 f12" text-anchor="middle">曲の一覧（JSON）</text><path class="arrd" d="M718.8,440 L568.4,440" marker-end="url(#hm)"/><text x="487.2" y="470.0" class="t2 f12" text-anchor="middle">OnLoadResult(結果)（非同期）</text><path class="arr" d="M564.4,476 L414.0,476" marker-end="url(#h)"/><text x="332.8" y="506.0" class="t2 f12" text-anchor="middle">ShowMessage（結果の案内）</text><path class="arr" d="M410.0,512 L259.6,512" marker-end="url(#h)"/></svg>
