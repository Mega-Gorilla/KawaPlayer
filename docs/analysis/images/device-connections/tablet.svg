<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-labelledby="t d"><title id="t">タブレットの中</title><desc id="d">TabletScreenが画面の状態を同期し、アプリはTabletScreenを通してタブレットのUIControllerを使う。画像アプリはPlayImageUrlで、設定アプリは直接つないだボタンで、タブレットのUIControllerを呼ぶ。KawaPlayerアプリはScreenUIで、本体と同じUIを持つ。どちらのUIControllerも本体のControllerを指す。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="500" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">タブレットの中</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">タブレットは UIController を 2 つ持ち、画面の状態は自分の TabletScreen で同期する</text><rect class="grp" x="24" y="70" width="566" height="380" rx="8"/><text x="38.0" y="92.0" class="t1 f13 b" text-anchor="start">Tablet.prefab</text><text x="38.0" y="110.0" class="t2 f11" text-anchor="start">根元に YamaPlayerSubController</text><rect class="box" x="44" y="112" width="170" height="50" rx="6"/><text x="129.0" y="132.5" class="t1 f12" text-anchor="middle">TabletPickup</text><text x="129.0" y="149.5" class="t2 f11" text-anchor="middle">VRCPickup・VRCObjectSync</text><rect class="go" x="300" y="108" width="270" height="60" rx="6"/><text x="435.0" y="126.0" class="t1 f12" text-anchor="middle">TabletScreen</text><text x="435.0" y="142.0" class="t2 f11" text-anchor="middle">同期：開いているアプリ・画像の URL・一覧</text><text x="435.0" y="158.0" class="t2 f11" text-anchor="middle">縦横の回転・ホームボタン</text><rect class="box" x="44" y="202" width="170" height="46" rx="6"/><text x="129.0" y="220.5" class="t1 f12" text-anchor="middle">画像アプリ</text><text x="129.0" y="237.5" class="t2 f11" text-anchor="middle">TabletImageApp</text><rect class="box" x="44" y="262" width="170" height="46" rx="6"/><text x="129.0" y="280.5" class="t1 f12" text-anchor="middle">設定アプリ</text><text x="129.0" y="297.5" class="t2 f11" text-anchor="middle">TabletSettingsApp</text><rect class="box" x="44" y="322" width="170" height="46" rx="6"/><text x="129.0" y="340.5" class="t1 f12" text-anchor="middle">訪問者アプリ</text><text x="129.0" y="357.5" class="t2 f11" text-anchor="middle">TabletVisitorsApp</text><rect class="box" x="300" y="212" width="270" height="50" rx="6"/><text x="435.0" y="232.5" class="t1 f12" text-anchor="middle">UIController（タブレットの）</text><text x="435.0" y="249.5" class="t2 f11" text-anchor="middle">ホーム画面・設定アプリのボタン</text><rect class="box" x="300" y="300" width="270" height="50" rx="6"/><text x="435.0" y="320.5" class="t1 f12" text-anchor="middle">ScreenUI（UIController）</text><text x="435.0" y="337.5" class="t2 f11" text-anchor="middle">KawaPlayer アプリ。本体のスクリーンと同じ</text><rect class="box" x="44" y="388" width="170" height="46" rx="6"/><text x="129.0" y="406.5" class="t1 f12" text-anchor="middle">TabletReturnButton</text><text x="129.0" y="423.5" class="t2 f11" text-anchor="middle">TabletPickup を戻す</text><rect class="box" x="300" y="384" width="270" height="50" rx="6"/><text x="435.0" y="404.5" class="t1 f12" text-anchor="middle">TabletVisitorRecorder</text><text x="435.0" y="421.5" class="t2 f11" text-anchor="middle">ビルドでワールドに 1 つにまとめる</text><rect class="go" x="640" y="206" width="156" height="160" rx="6"/><text x="718.0" y="281.0" class="t1 f13" text-anchor="middle">Controller</text><text x="718.0" y="299.0" class="t2 f11" text-anchor="middle">本体</text><path class="arr" d="M214.0,137.0 L300.0,137.0" marker-end="url(#h)"/><path class="arrd" d="M435.0,168.0 L435.0,210.0" marker-end="url(#hm)"/><text x="443.0" y="196.0" class="t2 mono" text-anchor="start">AddListener</text><path class="arr1" d="M214.0,222.0 L300.0,232.0" marker-end="url(#h1)"/><text x="257.0" y="216.0" class="t2 mono" text-anchor="middle">PlayImageUrl</text><path class="arr1" d="M214.0,284.0 L300.0,248.0" marker-end="url(#h1)"/><path class="arr" d="M214.0,345.0 L250.0,345.0 L250.0,409.0 L300.0,409.0" marker-end="url(#h)"/><path class="arrd" d="M44.0,411.0 L34.0,411.0 L34.0,137.0 L42.0,137.0" marker-end="url(#hm)"/><path class="arr1" d="M570.0,229.0 L640.0,229.0" marker-end="url(#h1)"/><path class="arr2" d="M640.0,247.0 L572.0,247.0" marker-end="url(#h2)"/><path class="arr1" d="M570.0,317.0 L640.0,317.0" marker-end="url(#h1)"/><path class="arr2" d="M640.0,335.0 L572.0,335.0" marker-end="url(#h2)"/><path class="arr1" d="M24,480 L50,480" marker-end="url(#h1)"/><text x="58.0" y="484.0" class="t2 f12" text-anchor="start">命令</text><path class="arr2" d="M94,480 L120,480" marker-end="url(#h2)"/><text x="128.0" y="484.0" class="t2 f12" text-anchor="start">出来事</text><path class="arr" d="M177,480 L203,480" marker-end="url(#h)"/><text x="211.0" y="484.0" class="t2 f12" text-anchor="start">タブレットの中の参照</text><path class="arrd" d="M351,480 L377,480" marker-end="url(#hm)"/><text x="385.0" y="484.0" class="t2 f12" text-anchor="start">登録・戻す</text></svg>
