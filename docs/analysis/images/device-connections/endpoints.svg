<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="t d"><title id="t">接続口の地図</title><desc id="d">ControllerはE1命令、E2出来事、E3名前の出来事、E4登録を持つ。UIControllerはE5前の確認、E6 UIの知らせ、E7差し込み口、E8窓口、E9登録を持つ。エディターとビルドには、E10 Sub Controllerのインスペクター、E11ビルド処理、E12 uiSlotsがある。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="520" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">接続口（エンドポイント）の地図</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">実行時の接続口は Controller と UIController に集まり、エディターとビルドの接続口が配線する</text><rect class="go" x="24" y="72" width="360" height="232" rx="8"/><text x="40.0" y="96.0" class="t1 f13 b" text-anchor="start">Controller（本体に 1 つ・同期する）</text><rect class="badge" x="40.0" y="116.0" width="24" height="16" rx="8"/><text x="52.0" y="128.0" class="bt" text-anchor="middle">E1</text><text x="78.0" y="128.0" class="t1 f12 b" text-anchor="start">命令</text><text x="78.0" y="145.0" class="t2 f11" text-anchor="start">public メソッド・プロパティ（約 90）</text><rect class="badge" x="40.0" y="156.0" width="24" height="16" rx="8"/><text x="52.0" y="168.0" class="bt" text-anchor="middle">E2</text><text x="78.0" y="168.0" class="t1 f12 b" text-anchor="start">出来事</text><text x="78.0" y="185.0" class="t2 f11" text-anchor="start">AfterXxx（型付き 29）</text><rect class="badge" x="40.0" y="196.0" width="24" height="16" rx="8"/><text x="52.0" y="208.0" class="bt" text-anchor="middle">E3</text><text x="78.0" y="208.0" class="t1 f12 b" text-anchor="start">名前の出来事</text><text x="78.0" y="225.0" class="t2 f11" text-anchor="start">SendCustomVideoEvent(名前)</text><rect class="badge" x="40.0" y="236.0" width="24" height="16" rx="8"/><text x="52.0" y="248.0" class="bt" text-anchor="middle">E4</text><text x="78.0" y="248.0" class="t1 f12 b" text-anchor="start">登録</text><text x="78.0" y="265.0" class="t2 f11" text-anchor="start">AddListener・AddScreen など</text><rect class="box" x="436" y="72" width="360" height="270" rx="8"/><text x="452.0" y="96.0" class="t1 f13 b" text-anchor="start">UIController（UI ごと・同期しない）</text><rect class="badge" x="452.0" y="116.0" width="24" height="16" rx="8"/><text x="464.0" y="128.0" class="bt" text-anchor="middle">E5</text><text x="490.0" y="128.0" class="t1 f12 b" text-anchor="start">前の確認</text><text x="490.0" y="145.0" class="t2 f11" text-anchor="start">BeforeUserXxx（名前 27）と中止</text><rect class="badge" x="452.0" y="158.0" width="24" height="16" rx="8"/><text x="464.0" y="170.0" class="bt" text-anchor="middle">E6</text><text x="490.0" y="170.0" class="t1 f12 b" text-anchor="start">UI の知らせ</text><text x="490.0" y="187.0" class="t2 f11" text-anchor="start">AfterLanguageChanged</text><rect class="badge" x="452.0" y="200.0" width="24" height="16" rx="8"/><text x="464.0" y="212.0" class="bt" text-anchor="middle">E7</text><text x="490.0" y="212.0" class="t1 f12 b" text-anchor="start">差し込み口</text><text x="490.0" y="229.0" class="t2 f11" text-anchor="start">_urlInterceptor・_playlistRefreshHandler</text><rect class="badge" x="452.0" y="242.0" width="24" height="16" rx="8"/><text x="464.0" y="254.0" class="bt" text-anchor="middle">E8</text><text x="490.0" y="254.0" class="t1 f12 b" text-anchor="start">窓口</text><text x="490.0" y="271.0" class="t2 f11" text-anchor="start">ShowMessage・PlayImageUrl など</text><rect class="badge" x="452.0" y="284.0" width="24" height="16" rx="8"/><text x="464.0" y="296.0" class="bt" text-anchor="middle">E9</text><text x="490.0" y="296.0" class="t1 f12 b" text-anchor="start">登録</text><text x="490.0" y="313.0" class="t2 f11" text-anchor="start">AddListener(UdonSharpBehaviour)</text><path class="arr1" d="M436.0,150.0 L386.0,150.0" marker-end="url(#h1)"/><path class="arr2" d="M386.0,190.0 L436.0,190.0" marker-end="url(#h2)"/><rect class="box" x="24" y="368" width="772" height="104" rx="8"/><text x="40.0" y="392.0" class="t1 f13 b" text-anchor="start">エディター・ビルドの接続口（ワールドを作るときだけ）</text><rect class="badge2" x="40.0" y="412.0" width="31" height="16" rx="8"/><text x="55.5" y="424.0" class="bt" text-anchor="middle">E10</text><text x="80.0" y="424.0" class="t1 f12 b" text-anchor="start">Sub Controller のインスペクター</text><text x="80.0" y="442.0" class="t2 f11" text-anchor="start">下の部品に _controller を書く</text><rect class="badge2" x="292.0" y="412.0" width="31" height="16" rx="8"/><text x="307.5" y="424.0" class="bt" text-anchor="middle">E11</text><text x="332.0" y="424.0" class="t1 f12 b" text-anchor="start">IYamaPlayerBuildProcess</text><text x="332.0" y="442.0" class="t2 f11" text-anchor="start">番号の順に動くビルド処理</text><rect class="badge2" x="544.0" y="412.0" width="31" height="16" rx="8"/><text x="559.5" y="424.0" class="bt" text-anchor="middle">E12</text><text x="584.0" y="424.0" class="t1 f12 b" text-anchor="start">uiSlots</text><text x="584.0" y="442.0" class="t2 f11" text-anchor="start">パスで UIController の下に写す</text><path class="arrd" d="M200.0,368.0 L200.0,306.0" marker-end="url(#hm)"/><text x="208.0" y="340.0" class="t2 f12" text-anchor="start">配線する</text><path class="arrd" d="M616.0,368.0 L616.0,344.0" marker-end="url(#hm)"/><path class="arr1" d="M24,500 L50,500" marker-end="url(#h1)"/><text x="58.0" y="504.0" class="t2 f12" text-anchor="start">UIController から Controller へ（E1）</text><path class="arr2" d="M484,500 L510,500" marker-end="url(#h2)"/><text x="518.0" y="504.0" class="t2 f12" text-anchor="start">Controller から UIController へ（E2・E3）</text></svg>
