<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-labelledby="t d"><title id="t">部品がプレイヤーを見つける3つの方法</title><desc id="d">エディターで書く方法、親をたどる方法、シーン全体を探す方法がある。正の値は各部品の_controllerで、書くのはSub Controllerのインスペクターだけである。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="380" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">部品がプレイヤーを見つける 3 つの方法</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">同じ「どのプレイヤーに従うか」を、場所ごとに別の方法で決めている</text><rect class="box" x="24" y="72" width="244" height="230" rx="6"/><text x="36.0" y="94.0" class="t1 f13 b" text-anchor="start">(a) エディターで書く</text><text x="36.0" y="116.0" class="t1 mono" text-anchor="start">YamaPlayerSubControllerEditor</text><text x="36.0" y="142.0" class="t2 f12" text-anchor="start">選んだときに、下の UIController・</text><text x="36.0" y="168.0" class="t2 f12" text-anchor="start">Screen・Speaker へ書く</text><text x="36.0" y="194.0" class="t2 f11" text-anchor="start">使う：デバイスの UI・画面・音</text><text x="36.0" y="220.0" class="ts2 f11" text-anchor="start">選び直さないと、後で足した物は</text><text x="36.0" y="246.0" class="ts2 f11" text-anchor="start">つながらない</text><rect class="box" x="290" y="72" width="244" height="230" rx="6"/><text x="302.0" y="94.0" class="t1 f13 b" text-anchor="start">(b) 親をたどる</text><text x="302.0" y="116.0" class="t1 mono" text-anchor="start">GetComponentInParent&lt;…&gt;()</text><text x="302.0" y="142.0" class="t2 f12" text-anchor="start">モジュール → Controller</text><text x="302.0" y="168.0" class="t2 f12" text-anchor="start">モジュールの UI → UIController</text><text x="302.0" y="194.0" class="t2 f11" text-anchor="start">使う：ビルドのモジュール配線、</text><text x="302.0" y="220.0" class="t2 f11" text-anchor="start">実行時のモジュールの UI</text><text x="302.0" y="246.0" class="ts2 f11" text-anchor="start">置き場所が決まっている物だけ</text><rect class="box" x="556" y="72" width="244" height="230" rx="6"/><text x="568.0" y="94.0" class="t1 f13 b" text-anchor="start">(c) シーン全体を探す</text><text x="568.0" y="116.0" class="t1 mono" text-anchor="start">FindObjectsByType&lt;UIController&gt;</text><text x="568.0" y="142.0" class="t2 f12" text-anchor="start">_controller が同じ物を全部</text><text x="568.0" y="168.0" class="t2 f12" text-anchor="start">集める</text><text x="568.0" y="194.0" class="t2 f11" text-anchor="start">使う：uiSlots、PlaylistLoader の</text><text x="568.0" y="220.0" class="t2 f11" text-anchor="start">差し込み</text><text x="568.0" y="246.0" class="ts2 f11" text-anchor="start">(a) で書いた値が手がかり</text><text x="24.0" y="336.0" class="t2 f12" text-anchor="start">正の値は各部品の _controller だが、それを書くのは (a) のインスペクターだけで、(b)・(c) はそれを読む側である。</text><text x="24.0" y="358.0" class="t2 f12" text-anchor="start">YamaPlayerSubController.YamaPlayer は、選んだときに使われるだけで、ビルドでも実行時でも読まれない。</text></svg>
