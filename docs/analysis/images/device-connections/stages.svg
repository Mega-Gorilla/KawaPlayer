<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="t d"><title id="t">つなぎ込みの3段</title><desc id="d">エディターではSub Controllerのインスペクターが参照を書き、ビルドではビルド処理がモジュールやボタンを配線し、実行時にはStartで各部品が自分をControllerやUIControllerに登録する。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="420" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">つなぎ込みの 3 段</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">参照はエディターで書き、ビルドで足し、実行時の Start で登録する</text><rect class="box" x="24" y="72" width="244" height="300" rx="8"/><text x="38.0" y="96.0" class="t1 f14" text-anchor="start">① エディター</text><text x="38.0" y="114.0" class="t2 f11" text-anchor="start">インスペクターで選んだとき</text><text x="38.0" y="146.0" class="t1 f12" text-anchor="start">Sub Controller の YamaPlayer を選ぶ</text><text x="38.0" y="176.0" class="t1 f12" text-anchor="start">→ 下の UIController の _controller</text><text x="38.0" y="206.0" class="t1 f12" text-anchor="start">→ YamaPlayerScreen の controller</text><text x="38.0" y="236.0" class="t1 f12" text-anchor="start">→ YamaPlayerSpeaker の controller</text><text x="38.0" y="266.0" class="t1 f12" text-anchor="start">シーン（プレハブの上書き）に保存</text><path class="arr" d="M270.0,222.0 L288.0,222.0" marker-end="url(#h)"/><rect class="go" x="290" y="72" width="244" height="300" rx="8"/><text x="304.0" y="96.0" class="t1 f14" text-anchor="start">② ビルド</text><text x="304.0" y="114.0" class="t2 f11" text-anchor="start">ワールドのビルド・Play のとき</text><text x="304.0" y="146.0" class="t1 mono" text-anchor="start">モジュールに _controller を入れる</text><text x="304.0" y="176.0" class="t1 f12" text-anchor="start">モジュールの UI を各 UIController に写す</text><text x="304.0" y="206.0" class="t1 f12" text-anchor="start">ボタンに GlobalReload を入れる</text><text x="304.0" y="236.0" class="t1 f12" text-anchor="start">つながっていない部品をログに出す</text><text x="304.0" y="266.0" class="t1 f12" text-anchor="start">URL 欄に PlaylistLoaderUI を差す</text><text x="304.0" y="296.0" class="t1 f12" text-anchor="start">Screen・Speaker を Controller に登録</text><text x="304.0" y="326.0" class="t1 f12" text-anchor="start">Controller をシーンの一番上へ移す</text><path class="arr" d="M536.0,222.0 L554.0,222.0" marker-end="url(#h)"/><rect class="box" x="556" y="72" width="244" height="300" rx="8"/><text x="570.0" y="96.0" class="t1 f14" text-anchor="start">③ 実行時</text><text x="570.0" y="114.0" class="t2 f11" text-anchor="start">Udon の Start 以降</text><text x="570.0" y="146.0" class="t1 mono" text-anchor="start">Controller.AddListener(this)</text><text x="570.0" y="176.0" class="t1 f12" text-anchor="start">  UIController・モジュール・キュー</text><text x="570.0" y="206.0" class="t1 mono" text-anchor="start">UIController.AddListener(this)</text><text x="570.0" y="236.0" class="t1 f12" text-anchor="start">  モジュールの UI・TabletScreen</text><text x="570.0" y="266.0" class="t1 f12" text-anchor="start">GetComponentInParent で自分の</text><text x="570.0" y="296.0" class="t1 f12" text-anchor="start">  UIController を探す（モジュールの UI）</text><text x="24.0" y="392.0" class="t2 f12" text-anchor="start">①で選んだプレイヤーと合っているかは、②でも③でも確かめ直さない（未設定は、ビルドと Start が知らせる）。</text><text x="24.0" y="410.0" class="t2 f12" text-anchor="start">②の配線は、①で書いた _controller を手がかりにする。</text></svg>
