<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 494" width="820" height="494" role="img" aria-labelledby="t d"><title id="t">モジュールのUIの差し込み</title><desc id="d">モジュールの定義のuiSlotsにはtargetPathと写す元がある。ビルド処理は、同じControllerを指すUIControllerごとにパスを探し（inSettingsの口はその設定から）、見つかった所に写す。ScreenUI、タブレットのUIController、全員リロードボタンとPlaylist PanelのUIControllerには写され、Controller Barには合うパスがないので写されない。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="494" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">モジュールの UI の差し込み（E12）</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">ビルドで、同じ Controller を指すすべての UIController に、パスが見つかった所だけ写す（例は PermissionManagement）</text><rect class="box" x="24" y="72" width="326" height="274" rx="6"/><text x="36.0" y="94.0" class="t1 f13 b" text-anchor="start">YamaPlayerModuleDefinition.uiSlots</text><text x="36.0" y="116.0" class="t2 f11 b" text-anchor="start">targetPath</text><text x="36.0" y="140.0" class="t1 mono" text-anchor="start">Canvas/User</text><text x="36.0" y="164.0" class="t1 mono" text-anchor="start">Categories（設定から）</text><text x="36.0" y="188.0" class="t1 mono" text-anchor="start">Pages（設定から）</text><text x="36.0" y="212.0" class="t1 mono" text-anchor="start">Canvas/Display</text><text x="36.0" y="236.0" class="t1 mono" text-anchor="start">Canvas/Modules</text><text x="36.0" y="260.0" class="t2 f11" text-anchor="start">content：写す元のテンプレート</text><text x="36.0" y="284.0" class="t2 f11" text-anchor="start">siblingIndex：写した先での並び</text><text x="36.0" y="308.0" class="t2 f11" text-anchor="start">inSettings：設定（SettingsPanel）から探す</text><rect class="go" x="372" y="150" width="136" height="96" rx="6"/><text x="440.0" y="175.0" class="t1 f12" text-anchor="middle">YamaPlayerModule</text><text x="440.0" y="193.0" class="t1 f12" text-anchor="middle">BuildProcess</text><text x="440.0" y="211.0" class="t2 mono" text-anchor="middle">transform.Find</text><text x="440.0" y="229.0" class="t2 mono" text-anchor="middle">(targetPath)</text><path class="arr" d="M350.0,198.0 L372.0,198.0" marker-end="url(#h)"/><rect class="box" x="544" y="80" width="252" height="56" rx="6"/><text x="670.0" y="103.5" class="t1 f12" text-anchor="middle">ScreenUI（本体・タブレットのアプリ）</text><text x="670.0" y="120.5" class="t2 f11" text-anchor="middle">Canvas/User ほか</text><path class="arr" d="M508.0,198.0 L526.0,198.0 L526.0,108.0 L544.0,108.0" marker-end="url(#h)"/><rect class="box" x="544" y="150" width="252" height="56" rx="6"/><text x="670.0" y="173.5" class="t1 f12" text-anchor="middle">タブレットの UIController</text><text x="670.0" y="190.5" class="t2 f11" text-anchor="middle">Canvas/Display</text><path class="arr" d="M508.0,198.0 L526.0,198.0 L526.0,178.0 L544.0,178.0" marker-end="url(#h)"/><rect class="box" x="544" y="220" width="252" height="56" rx="6"/><text x="670.0" y="243.5" class="t1 f12" text-anchor="middle">全員リロードボタン・Playlist Panel</text><text x="670.0" y="260.5" class="t2 f11" text-anchor="middle">Canvas/Modules（空で用意）</text><path class="arr" d="M508.0,198.0 L526.0,198.0 L526.0,248.0 L544.0,248.0" marker-end="url(#h)"/><rect class="hot" x="544" y="290" width="252" height="56" rx="6"/><text x="670.0" y="313.5" class="t1 f12" text-anchor="middle">Controller Bar</text><text x="670.0" y="330.5" class="t2 f11" text-anchor="middle">合うパスがない → 写さない</text><path class="arrd" d="M508.0,198.0 L526.0,198.0 L526.0,318.0 L544.0,318.0" marker-end="url(#hm)"/><text x="24.0" y="376.0" class="t2 f12" text-anchor="start">inSettings の口は、UIController の下の設定（スクリーンの設定のページ、タブレットの設定アプリ）から探すので、1 つで両方に入る。</text><text x="24.0" y="398.0" class="t2 f12" text-anchor="start">写した物は、実行時に GetComponentInParent&lt;UIController&gt;() で自分の UIController を見つけて登録する。</text><text x="24.0" y="420.0" class="t2 f12" text-anchor="start">写した物の中の参照は、写した先の物に付け替える。テンプレートの外（モジュール本体）への参照はそのまま残る。</text><text x="24.0" y="442.0" class="t2 f12" text-anchor="start">パスが見つからない UI は、何も言わずに飛ばす。写し終えたら、テンプレートは消す。</text></svg>
