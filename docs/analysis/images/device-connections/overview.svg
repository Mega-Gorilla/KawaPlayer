<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="t d"><title id="t">KawaPlayer 本体とデバイス</title><desc id="d">本体はController、プレーヤー、プレイリスト、モジュール、ScreenUIからなる。Controller Bar、Playlist Panel、Sub Screen、Tablet、全員リロードボタンのデバイスは、自分の中のUIControllerかYamaPlayerScreenでControllerを指し、命令を送り、出来事を受け取る。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="470" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">KawaPlayer 本体とデバイス</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">デバイスは、自分の中の UIController（Sub Screen は YamaPlayerScreen）で本体の Controller を指す</text><rect class="grp" x="24" y="70" width="310" height="370" rx="8"/><text x="38.0" y="92.0" class="t1 f13 b" text-anchor="start">KawaPlayer 本体</text><text x="38.0" y="110.0" class="t2 f11" text-anchor="start">KawaPlayer.prefab（根元に YamaPlayer）</text><rect class="go" x="44" y="112" width="270" height="62" rx="6"/><text x="179.0" y="138.0" class="t1 f13" text-anchor="middle">Controller</text><text x="179.0" y="156.0" class="t2 f12" text-anchor="middle">再生の中心。再生の状態を同期する</text><rect class="box" x="44" y="190" width="130" height="50" rx="6"/><text x="109.0" y="210.5" class="t1 f12" text-anchor="middle">プレーヤー</text><text x="109.0" y="227.5" class="t2 f11" text-anchor="middle">AVPro・Unity・画像</text><rect class="box" x="184" y="190" width="130" height="50" rx="6"/><text x="249.0" y="210.5" class="t1 f12" text-anchor="middle">プレイリスト</text><text x="249.0" y="227.5" class="t2 f11" text-anchor="middle">キュー・履歴・枠</text><rect class="box" x="44" y="256" width="270" height="50" rx="6"/><text x="179.0" y="276.5" class="t1 f12" text-anchor="middle">Modules/</text><text x="179.0" y="293.5" class="t2 f11" text-anchor="middle">PlaylistLoader・DefaultUrl・権限 など</text><rect class="box" x="44" y="322" width="270" height="50" rx="6"/><text x="179.0" y="342.5" class="t1 f12" text-anchor="middle">ScreenUI（UIController）</text><text x="179.0" y="359.5" class="t2 f11" text-anchor="middle">本体のスクリーンの UI</text><text x="44.0" y="400.0" class="t2 f11" text-anchor="start">本体のスクリーンの UI も、デバイスと</text><text x="44.0" y="416.0" class="t2 f11" text-anchor="start">同じ UIController でつながる</text><rect class="grp" x="486" y="70" width="310" height="370" rx="8"/><text x="500.0" y="92.0" class="t1 f13 b" text-anchor="start">デバイス</text><text x="500.0" y="110.0" class="t2 f11" text-anchor="start">根元に YamaPlayerSubController が付くプレハブ</text><rect class="box" x="506" y="112" width="270" height="50" rx="6"/><text x="641.0" y="132.5" class="t1 f12" text-anchor="middle">Controller Bar</text><text x="641.0" y="149.5" class="t2 f11" text-anchor="middle">UIController</text><rect class="box" x="506" y="176" width="270" height="50" rx="6"/><text x="641.0" y="196.5" class="t1 f12" text-anchor="middle">Playlist Panel</text><text x="641.0" y="213.5" class="t2 f11" text-anchor="middle">UIController</text><rect class="box" x="506" y="240" width="270" height="50" rx="6"/><text x="641.0" y="260.5" class="t1 f12" text-anchor="middle">Sub Screen</text><text x="641.0" y="277.5" class="t2 f11" text-anchor="middle">YamaPlayerScreen（ビルドで登録）</text><rect class="box" x="506" y="304" width="270" height="50" rx="6"/><text x="641.0" y="324.5" class="t1 f12" text-anchor="middle">Tablet</text><text x="641.0" y="341.5" class="t2 f11" text-anchor="middle">UIController ×2・TabletScreen</text><rect class="box" x="506" y="368" width="270" height="50" rx="6"/><text x="641.0" y="388.5" class="t1 f12" text-anchor="middle">全員リロードボタン</text><text x="641.0" y="405.5" class="t2 f11" text-anchor="middle">UIController・GlobalReload</text><path class="arr1" d="M486.0,124.0 L316.0,124.0" marker-end="url(#h1)"/><text x="402.0" y="116.0" class="t2 f12" text-anchor="middle">命令（public メソッド）</text><path class="arr2" d="M314.0,162.0 L484.0,162.0" marker-end="url(#h2)"/><text x="402.0" y="154.0" class="t2 f12" text-anchor="middle">出来事（After〜）</text><path class="arrd" d="M486.0,300.0 L380.0,300.0 L380.0,170.0 L318.0,170.0" marker-end="url(#hm)"/><text x="388.0" y="252.0" class="t2 mono" text-anchor="start">_controller</text><text x="388.0" y="268.0" class="t2 f11" text-anchor="start">で指す</text><path class="arr1" d="M490,452 L516,452" marker-end="url(#h1)"/><text x="524.0" y="456.0" class="t2 f12" text-anchor="start">命令</text><path class="arr2" d="M560,452 L586,452" marker-end="url(#h2)"/><text x="594.0" y="456.0" class="t2 f12" text-anchor="start">出来事</text><path class="arrd" d="M643,452 L669,452" marker-end="url(#hm)"/><text x="677.0" y="456.0" class="t2 f12" text-anchor="start">参照</text></svg>
