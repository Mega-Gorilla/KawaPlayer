<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="t d"><title id="t">全員リロードボタン（ネットワークをまたぐ流れ）</title><desc id="d">GlobalReloadButtonはボタンのUIControllerにBeforeUserGlobalReloadを送って権限を確かめる。押すとGlobalReloadのSendがネットワークのイベントを全員に送り、各自のGlobalReloadが自分のControllerのReloadを呼ぶ。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)} .ts1{fill:var(--s1)} .ts2{fill:var(--s2)}
.axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.hot{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.arr1{fill:none;stroke:var(--s1);stroke-width:1.5} .arr2{fill:none;stroke:var(--s2);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)} .head1{fill:var(--s1)} .head2{fill:var(--s2)}
.badge{fill:var(--s1)} .badge2{fill:var(--s2)} .bt{fill:var(--surface);font-size:11px;font-weight:600}
.f11{font-size:11px} .f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .b{font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;font-size:11.5px}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="520" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">全員リロードボタン（ネットワークをまたぐ流れ）</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">ボタンは UIController で権限を通し、モジュールの GlobalReload がネットワークのイベントを全員に送る</text><line class="axis" x1="88.3" x2="88.3" y1="114" y2="502.0"/><rect class="box" x="29.0" y="70" width="118.66666666666666" height="44" rx="6"/><text x="88.3" y="87.5" class="t1 f12" text-anchor="middle">GlobalReload</text><text x="88.3" y="104.5" class="t2 f11" text-anchor="middle">Button</text><line class="axis" x1="217.0" x2="217.0" y1="114" y2="502.0"/><rect class="box" x="157.66666666666669" y="70" width="118.66666666666666" height="44" rx="6"/><text x="217.0" y="87.5" class="t1 f12" text-anchor="middle">UIController</text><text x="217.0" y="104.5" class="t2 f11" text-anchor="middle">（ボタンの）</text><line class="axis" x1="345.7" x2="345.7" y1="114" y2="502.0"/><rect class="box" x="286.3333333333333" y="70" width="118.66666666666666" height="44" rx="6"/><text x="345.7" y="87.5" class="t1 f12" text-anchor="middle">GlobalReload</text><text x="345.7" y="104.5" class="t2 f11" text-anchor="middle">（押した人）</text><line class="axis" x1="474.3" x2="474.3" y1="114" y2="502.0"/><rect class="box" x="415.0" y="70" width="118.66666666666666" height="34" rx="6"/><text x="474.3" y="91.0" class="t1 f12" text-anchor="middle">VRChat</text><line class="axis" x1="603.0" x2="603.0" y1="114" y2="502.0"/><rect class="box" x="543.6666666666666" y="70" width="118.66666666666666" height="44" rx="6"/><text x="603.0" y="87.5" class="t1 f12" text-anchor="middle">GlobalReload</text><text x="603.0" y="104.5" class="t2 f11" text-anchor="middle">（各自）</text><line class="axis" x1="731.7" x2="731.7" y1="114" y2="502.0"/><rect class="box" x="672.3333333333333" y="70" width="118.66666666666666" height="44" rx="6"/><text x="731.7" y="87.5" class="t1 f12" text-anchor="middle">Controller</text><text x="731.7" y="104.5" class="t2 f11" text-anchor="middle">（各自）</text><text x="152.7" y="134.0" class="t2 f12" text-anchor="middle">BeforeUserGlobalReload</text><path class="arr" d="M88.3,140 L213.0,140" marker-end="url(#h)"/><rect class="ask" x="129.0" y="164" width="176.0" height="46" rx="6"/><text x="217.0" y="182.0" class="t1 f12" text-anchor="middle">中止されなければ押せる</text><text x="217.0" y="199.0" class="t1 f12" text-anchor="middle">（1 秒ごとにも試す）</text><text x="217.0" y="230.0" class="t2 f12" text-anchor="middle">Send()</text><path class="arr1" d="M88.3,236 L341.7,236" marker-end="url(#h1)"/><rect class="ask" x="257.7" y="260" width="176.0" height="46" rx="6"/><text x="345.7" y="278.0" class="t1 f12" text-anchor="middle">ローカルモードなら</text><text x="345.7" y="295.0" class="t1 f12" text-anchor="middle">送らずに Reload()</text><text x="410.0" y="326.0" class="t2 f12" text-anchor="middle">SendCustomNetworkEvent(All)</text><path class="arr" d="M345.7,332 L470.3,332" marker-end="url(#h)"/><text x="538.7" y="362.0" class="t2 f12" text-anchor="middle">OnGlobalReload（押した人にも）</text><path class="arrd" d="M474.3,368 L599.0,368" marker-end="url(#hm)"/><text x="667.3" y="398.0" class="t2 f12" text-anchor="middle">Reload()</text><path class="arr1" d="M603.0,404 L727.7,404" marker-end="url(#h1)"/><rect class="ask" x="643.7" y="428" width="176.0" height="46" rx="6"/><text x="731.7" y="446.0" class="t1 f12" text-anchor="middle">自分の動画を読み込み直す</text><text x="731.7" y="463.0" class="t1 f12" text-anchor="middle">（ReSync と同じ決まり）</text></svg>
