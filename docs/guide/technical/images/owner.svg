<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 429" width="820" height="429" role="img" aria-labelledby="t d"><title id="t">オーナーが替わるとき</title><desc id="d">オーナーAが位置と時刻を送ったあとに抜けると、VRChatがBを新しいオーナーにする。Bは準備ができたら共有の位置から今あるべき位置を出して合わせ、Cはそのまま再生を続ける。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.h1{fill:var(--surface);stroke:var(--s1);stroke-width:2} .h2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .w1{fill:var(--s1);fill-opacity:.12} .w2{fill:var(--s2);fill-opacity:.12} .wash{fill:var(--wash)}
.thr{stroke:var(--muted);stroke-width:1} .lead{stroke:var(--muted);stroke-width:1;fill:none}
.tick{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round}
.press{stroke:var(--ink2);stroke-width:2;stroke-linecap:round}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)}
.f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .num{font-variant-numeric:tabular-nums}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="429" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">オーナーが替わるとき</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">共有の位置と時刻はそのまま使われ、読み込み中に引き継いだ人も、今あるべき位置から始める</text><line class="axis" x1="132.5" x2="132.5" y1="116" y2="297.0"/><rect class="box" x="52" y="76" width="160" height="32" rx="6"/><text x="132.0" y="96.0" class="t1 f12" text-anchor="middle">オーナー A</text><line class="axis" x1="317.5" x2="317.5" y1="116" y2="409.0"/><rect class="box" x="237" y="76" width="160" height="32" rx="6"/><text x="317.0" y="96.0" class="t1 f12" text-anchor="middle">VRChat</text><line class="axis" x1="502.5" x2="502.5" y1="116" y2="409.0"/><rect class="box" x="422" y="76" width="160" height="40" rx="6"/><text x="502.0" y="91.0" class="t1 f12" text-anchor="middle">B</text><text x="502.0" y="109.0" class="t1 f12" text-anchor="middle">（読み込み中）</text><line class="axis" x1="687.5" x2="687.5" y1="116" y2="409.0"/><rect class="box" x="607" y="76" width="160" height="40" rx="6"/><text x="687.0" y="91.0" class="t1 f12" text-anchor="middle">C</text><text x="687.0" y="109.0" class="t1 f12" text-anchor="middle">（再生中）</text><text x="225.0" y="144.0" class="t2 f12" text-anchor="middle">位置 30 秒（12:00:00 の時点）</text><path class="arr" d="M132.5,150 L313.5,150" marker-end="url(#h)"/><text x="410.0" y="182.0" class="t2 f12" text-anchor="middle">位置と時刻を配る</text><path class="arr" d="M317.5,188 L498.5,188" marker-end="url(#h)"/><text x="502.5" y="220.0" class="t2 f12" text-anchor="middle">位置と時刻を配る</text><path class="arr" d="M317.5,226 L683.5,226" marker-end="url(#h)"/><rect class="ask" x="44.5" y="252" width="176" height="31" rx="6"/><text x="132.5" y="271.0" class="t1 f12" text-anchor="middle">A がインスタンスを抜ける</text><path class="arr" d="M125.5,290 L139.5,304 M125.5,304 L139.5,290"/><text x="410.0" y="301.0" class="t2 f12" text-anchor="middle">B を新しいオーナーにする</text><path class="arr" d="M317.5,307 L498.5,307" marker-end="url(#h)"/><rect class="ask" x="414.5" y="333" width="176" height="48" rx="6"/><text x="502.5" y="352.0" class="t1 f12" text-anchor="middle">準備ができたら、共有の位置から</text><text x="502.5" y="369.0" class="t1 f12" text-anchor="middle">今あるべき位置を出して合わせる</text><rect class="ask" x="599.5" y="333" width="176" height="48" rx="6"/><text x="687.5" y="352.0" class="t1 f12" text-anchor="middle">そのまま再生を続ける</text><text x="687.5" y="369.0" class="t1 f12" text-anchor="middle">（先頭に戻らない）</text></svg>
