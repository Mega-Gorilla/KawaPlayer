<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" width="820" height="372" role="img" aria-labelledby="t d"><title id="t">同期の全体像</title><desc id="d">オーナーは曲・状態・位置とその時刻を送り、VRChatが全員に配る。ほかの人は値を受け取り、動画を自分で読み込み、サーバーの時刻から今あるべき位置を出して再生する。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.h1{fill:var(--surface);stroke:var(--s1);stroke-width:2} .h2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .w1{fill:var(--s1);fill-opacity:.12} .w2{fill:var(--s2);fill-opacity:.12} .wash{fill:var(--wash)}
.thr{stroke:var(--muted);stroke-width:1} .lead{stroke:var(--muted);stroke-width:1;fill:none}
.tick{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round}
.press{stroke:var(--ink2);stroke-width:2;stroke-linecap:round}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)}
.f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .num{font-variant-numeric:tabular-nums}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="372" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">同期の全体像</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">共有するのは値だけで、動画は一人ひとりが読み込み、位置はサーバーの時刻から一人ひとりが出す</text><rect class="grp" x="24" y="76" width="176" height="150" rx="8"/><text x="112.0" y="96.0" class="t1 f13" text-anchor="middle">オーナー（操作した人）</text><rect class="grp" x="262" y="76" width="196" height="150" rx="8"/><text x="360.0" y="96.0" class="t1 f13" text-anchor="middle">VRChat</text><rect class="grp" x="520" y="76" width="276" height="196" rx="8"/><text x="658.0" y="96.0" class="t1 f13" text-anchor="middle">ほかの人（一人ひとり）</text><rect class="box" x="40" y="120" width="144" height="56" rx="6"/><text x="112.0" y="143.0" class="t1 f13" text-anchor="middle">曲・状態・位置と</text><text x="112.0" y="161.0" class="t1 f13" text-anchor="middle">その時刻を送る</text><rect class="box" x="278" y="110" width="164" height="52" rx="6"/><text x="360.0" y="131.0" class="t1 f13" text-anchor="middle">値を全員に配る</text><text x="360.0" y="149.0" class="t1 f13" text-anchor="middle">（後から入った人にも）</text><rect class="box" x="278" y="176" width="164" height="36" rx="6"/><text x="360.0" y="198.0" class="t1 f13" text-anchor="middle">サーバーの時刻</text><rect class="box" x="540" y="110" width="236" height="32" rx="6"/><text x="658.0" y="130.0" class="t1 f13" text-anchor="middle">① 値を受け取る</text><rect class="box" x="540" y="160" width="236" height="32" rx="6"/><text x="658.0" y="180.0" class="t1 f13" text-anchor="middle">② 動画を自分で読み込む</text><rect class="box" x="540" y="210" width="236" height="48" rx="6"/><text x="658.0" y="229.0" class="t1 f13" text-anchor="middle">③ 今あるべき位置を出して、</text><text x="658.0" y="247.0" class="t1 f13" text-anchor="middle">そこから再生する</text><rect class="box" x="290" y="292" width="210" height="44" rx="6"/><text x="395.0" y="309.0" class="t2 f12" text-anchor="middle">動画のサイト</text><text x="395.0" y="327.0" class="t2 f12" text-anchor="middle">（YouTube・VHub など）</text><path class="arr" d="M184.0,136.0 L278.0,136.0" marker-end="url(#h)"/><path class="arr" d="M442.0,126.0 L540.0,126.0" marker-end="url(#h)"/><path class="arr" d="M658.0,142.0 L658.0,160.0" marker-end="url(#h)"/><path class="arr" d="M658.0,192.0 L658.0,210.0" marker-end="url(#h)"/><path class="arrd" d="M442.0,194.0 L496.0,194.0 L496.0,234.0 L540.0,234.0" marker-end="url(#hm)"/><path class="arrd" d="M776.0,176.0 L808.0,176.0 L808.0,314.0 L500.0,314.0" marker-end="url(#hm)"/><text x="650.0" y="306.0" class="t2 f12" text-anchor="middle">動画を取りに行く</text><path class="arrd" d="M112.0,176.0 L112.0,314.0 L290.0,314.0" marker-end="url(#hm)"/><text x="122.0" y="306.0" class="t2 f12" text-anchor="start">オーナーも自分で読み込む</text><path class="arr" d="M560,356 L586,356" marker-end="url(#h)"/><text x="594.0" y="360.0" class="t2 f12" text-anchor="start">値</text><path class="arrd" d="M630,356 L656,356" marker-end="url(#hm)"/><text x="664.0" y="360.0" class="t2 f12" text-anchor="start">時刻・動画</text></svg>
