<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 386" width="820" height="386" role="img" aria-labelledby="t d"><title id="t">全員リロードボタンを押したとき</title><desc id="d">押した人の合図をVRChatが押した人を含む全員に配る。再生中の人は読み込み直して今あるべき位置に戻り、読み込みを始めて15秒たっていない人は今の読み込みを続ける。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.h1{fill:var(--surface);stroke:var(--s1);stroke-width:2} .h2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .w1{fill:var(--s1);fill-opacity:.12} .w2{fill:var(--s2);fill-opacity:.12} .wash{fill:var(--wash)}
.thr{stroke:var(--muted);stroke-width:1} .lead{stroke:var(--muted);stroke-width:1;fill:none}
.tick{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round}
.press{stroke:var(--ink2);stroke-width:2;stroke-linecap:round}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)}
.f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .num{font-variant-numeric:tabular-nums}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="386" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">全員リロードボタンを押したとき</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">合図は押した人にも届き、受けた人はそれぞれ ReSync と同じ決まりで読み込み直す</text><line class="axis" x1="132.5" x2="132.5" y1="116" y2="366.0"/><rect class="box" x="52" y="76" width="160" height="32" rx="6"/><text x="132.0" y="96.0" class="t1 f12" text-anchor="middle">押した人</text><line class="axis" x1="317.5" x2="317.5" y1="116" y2="366.0"/><rect class="box" x="237" y="76" width="160" height="32" rx="6"/><text x="317.0" y="96.0" class="t1 f12" text-anchor="middle">VRChat</text><line class="axis" x1="502.5" x2="502.5" y1="116" y2="366.0"/><rect class="box" x="422" y="76" width="160" height="40" rx="6"/><text x="502.0" y="91.0" class="t1 f12" text-anchor="middle">A</text><text x="502.0" y="109.0" class="t1 f12" text-anchor="middle">（再生中）</text><line class="axis" x1="687.5" x2="687.5" y1="116" y2="366.0"/><rect class="box" x="607" y="76" width="160" height="40" rx="6"/><text x="687.0" y="91.0" class="t1 f12" text-anchor="middle">B</text><text x="687.0" y="109.0" class="t1 f12" text-anchor="middle">（読み込みを始めて 5 秒）</text><text x="225.0" y="144.0" class="t2 f12" text-anchor="middle">「読み込み直して」の合図（全員あて）</text><path class="arr" d="M132.5,150 L313.5,150" marker-end="url(#h)"/><text x="225.0" y="182.0" class="t2 f12" text-anchor="middle">合図</text><path class="arr" d="M317.5,188 L136.5,188" marker-end="url(#h)"/><text x="410.0" y="220.0" class="t2 f12" text-anchor="middle">合図</text><path class="arr" d="M317.5,226 L498.5,226" marker-end="url(#h)"/><text x="502.5" y="258.0" class="t2 f12" text-anchor="middle">合図</text><path class="arr" d="M317.5,264 L683.5,264" marker-end="url(#h)"/><rect class="ask" x="44.5" y="290" width="176" height="48" rx="6"/><text x="132.5" y="309.0" class="t1 f12" text-anchor="middle">読み込み直し、</text><text x="132.5" y="326.0" class="t1 f12" text-anchor="middle">今あるべき位置に戻る</text><rect class="ask" x="414.5" y="290" width="176" height="48" rx="6"/><text x="502.5" y="309.0" class="t1 f12" text-anchor="middle">読み込み直し、</text><text x="502.5" y="326.0" class="t1 f12" text-anchor="middle">今あるべき位置に戻る</text><rect class="ask" x="599.5" y="290" width="176" height="48" rx="6"/><text x="687.5" y="309.0" class="t1 f12" text-anchor="middle">15 秒たっていないので、</text><text x="687.5" y="326.0" class="t1 f12" text-anchor="middle">今の読み込みを続ける</text></svg>
