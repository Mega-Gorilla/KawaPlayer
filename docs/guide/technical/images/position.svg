<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450" role="img" aria-labelledby="t d"><title id="t">共有の位置と時刻から、今あるべき位置を出す</title><desc id="d">オーナーが送った位置と時刻から、過ぎた時間と再生速度で今あるべき位置を出す。一時停止のあいだは進まず、速度が2倍なら2倍で進む。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.h1{fill:var(--surface);stroke:var(--s1);stroke-width:2} .h2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .w1{fill:var(--s1);fill-opacity:.12} .w2{fill:var(--s2);fill-opacity:.12} .wash{fill:var(--wash)}
.thr{stroke:var(--muted);stroke-width:1} .lead{stroke:var(--muted);stroke-width:1;fill:none}
.tick{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round}
.press{stroke:var(--ink2);stroke-width:2;stroke-linecap:round}
.f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .num{font-variant-numeric:tabular-nums}
</style><rect class="bg" x="0" y="0" width="820" height="450" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">共有の位置と時刻から、全員が「今あるべき位置」を出す</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">オーナーが 2 秒に再生、10 秒に一時停止、14 秒に再生、20 秒に速度を 2 倍にした例</text><line class="axis" x1="84" x2="790" y1="360.0" y2="360.0"/><text x="76.0" y="364.0" class="tm f12 num" text-anchor="end">0</text><line class="grid" x1="84" x2="790" y1="314.0" y2="314.0"/><text x="76.0" y="318.0" class="tm f12 num" text-anchor="end">6</text><line class="grid" x1="84" x2="790" y1="268.0" y2="268.0"/><text x="76.0" y="272.0" class="tm f12 num" text-anchor="end">12</text><line class="grid" x1="84" x2="790" y1="222.0" y2="222.0"/><text x="76.0" y="226.0" class="tm f12 num" text-anchor="end">18</text><line class="grid" x1="84" x2="790" y1="176.0" y2="176.0"/><text x="76.0" y="180.0" class="tm f12 num" text-anchor="end">24</text><line class="grid" x1="84" x2="790" y1="130.0" y2="130.0"/><text x="76.0" y="134.0" class="tm f12 num" text-anchor="end">30</text><line class="grid" x1="84" x2="790" y1="84.0" y2="84.0"/><text x="76.0" y="88.0" class="tm f12 num" text-anchor="end">36</text><line class="grid" x1="84.0" x2="84.0" y1="84" y2="360"/><text x="84.0" y="378.0" class="tm f12 num" text-anchor="middle">0</text><line class="grid" x1="201.7" x2="201.7" y1="84" y2="360"/><text x="201.7" y="378.0" class="tm f12 num" text-anchor="middle">5</text><line class="grid" x1="319.3" x2="319.3" y1="84" y2="360"/><text x="319.3" y="378.0" class="tm f12 num" text-anchor="middle">10</text><line class="grid" x1="437.0" x2="437.0" y1="84" y2="360"/><text x="437.0" y="378.0" class="tm f12 num" text-anchor="middle">15</text><line class="grid" x1="554.7" x2="554.7" y1="84" y2="360"/><text x="554.7" y="378.0" class="tm f12 num" text-anchor="middle">20</text><line class="grid" x1="672.3" x2="672.3" y1="84" y2="360"/><text x="672.3" y="378.0" class="tm f12 num" text-anchor="middle">25</text><line class="grid" x1="790.0" x2="790.0" y1="84" y2="360"/><text x="790.0" y="378.0" class="tm f12 num" text-anchor="middle">30</text><text x="437.0" y="398.0" class="tm f12" text-anchor="middle">VRChat のサーバーの時刻（秒）</text><text x="44.0" y="72.0" class="tm f12" text-anchor="start">再生位置（秒）</text><rect class="wash" x="319.3" y="84" width="94.1" height="276"/><text x="366.4" y="100.0" class="t2 f12" text-anchor="middle">一時停止</text><text x="366.4" y="116.0" class="t2 f12" text-anchor="middle">進まない</text><polyline class="l1" points="84.0,360.0 131.1,360.0 319.3,298.7 413.5,298.7 554.7,252.7 790.0,99.3"/><text x="225.2" y="315.3" class="t2 f12" text-anchor="end">傾き 1（速度 1）</text><text x="613.5" y="238.3" class="t2 f12" text-anchor="start">傾き 2（速度 2）</text><circle class="d2" cx="131.1" cy="360.0" r="6"/><text x="141.1" y="378.0" class="t1 f12" text-anchor="start">① 再生</text><circle class="d2" cx="319.3" cy="298.7" r="6"/><text x="329.3" y="316.7" class="t1 f12" text-anchor="start">② 一時停止</text><circle class="d2" cx="413.5" cy="298.7" r="6"/><text x="423.5" y="316.7" class="t1 f12" text-anchor="start">③ 再生</text><circle class="d2" cx="554.7" cy="252.7" r="6"/><text x="544.7" y="240.7" class="t1 f12" text-anchor="end">④ 速度を 2 倍に</text><line class="dash" x1="554.7" y1="252.7" x2="695.9" y2="252.7"/><line class="dash" x1="695.9" y1="252.7" x2="695.9" y2="160.7"/><circle class="h1" cx="695.9" cy="160.7" r="5"/><text x="685.9" y="150.7" class="t2 f12" text-anchor="end">26 秒には 14 ＋ 6 × 2 ＝ 26</text><text x="625.3" y="268.7" class="tm f12" text-anchor="middle">過ぎた時間 6 秒</text><circle class="d2" cx="89" cy="434" r="5"/><text x="100.0" y="438.0" class="t2 f12" text-anchor="start">オーナーが送った位置と時刻</text><line class="l1" x1="284" y1="434" x2="310" y2="434"/><text x="318.0" y="438.0" class="t2 f12" text-anchor="start">今あるべき位置（全員が同じ計算で出す）</text></svg>
