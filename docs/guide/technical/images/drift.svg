<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-labelledby="t d"><title id="t">通信が止まったあとの時刻合わせ（モデル）</title><desc id="d">通信が止まっているあいだは確かめても待ち、動き出してから1回だけシークする。シークのあとの0.6秒の遅れは境目の0.9秒より小さいので、そのまま落ち着く。</desc><style>
