<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="t d"><title id="t">ReSync を押したときに、いつ読み込むか</title><desc id="d">前の読み込みから5.1秒たつまでは待ち、そのあいだに押した回数は1回の読み込みにまとめる。読み込み中は、始めてから15秒たつまでボタンを押せない。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.h1{fill:var(--surface);stroke:var(--s1);stroke-width:2} .h2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .w1{fill:var(--s1);fill-opacity:.12} .w2{fill:var(--s2);fill-opacity:.12} .wash{fill:var(--wash)}
.thr{stroke:var(--muted);stroke-width:1} .lead{stroke:var(--muted);stroke-width:1;fill:none}
.tick{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round}
.press{stroke:var(--ink2);stroke-width:2;stroke-linecap:round}
.f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .num{font-variant-numeric:tabular-nums}
</style><rect class="bg" x="0" y="0" width="820" height="400" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">ReSync を押したときに、いつ読み込むか</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">VRChat は、1 人が新しく読み込めるのを 5 秒に 1 回に限る。KawaPlayer は前の読み込みから 5.1 秒あけ、読み込み中は 15 秒待つ</text><text x="24.0" y="88.0" class="t1 f13" text-anchor="start">(a) 読み込みの間隔</text><line class="grid" x1="210.0" x2="210.0" y1="102" y2="190"/><text x="210.0" y="208.0" class="tm f12 num" text-anchor="middle">0</text><line class="grid" x1="258.3" x2="258.3" y1="102" y2="190"/><line class="grid" x1="306.7" x2="306.7" y1="102" y2="190"/><text x="306.7" y="208.0" class="tm f12 num" text-anchor="middle">2</text><line class="grid" x1="355.0" x2="355.0" y1="102" y2="190"/><line class="grid" x1="403.3" x2="403.3" y1="102" y2="190"/><text x="403.3" y="208.0" class="tm f12 num" text-anchor="middle">4</text><line class="grid" x1="451.7" x2="451.7" y1="102" y2="190"/><line class="grid" x1="500.0" x2="500.0" y1="102" y2="190"/><text x="500.0" y="208.0" class="tm f12 num" text-anchor="middle">6</text><line class="grid" x1="548.3" x2="548.3" y1="102" y2="190"/><line class="grid" x1="596.7" x2="596.7" y1="102" y2="190"/><text x="596.7" y="208.0" class="tm f12 num" text-anchor="middle">8</text><line class="grid" x1="645.0" x2="645.0" y1="102" y2="190"/><line class="grid" x1="693.3" x2="693.3" y1="102" y2="190"/><text x="693.3" y="208.0" class="tm f12 num" text-anchor="middle">10</text><line class="grid" x1="741.7" x2="741.7" y1="102" y2="190"/><line class="grid" x1="790.0" x2="790.0" y1="102" y2="190"/><text x="790.0" y="208.0" class="tm f12 num" text-anchor="middle">12</text><text x="24.0" y="128.0" class="t2 f12" text-anchor="start">読み込み</text><text x="24.0" y="174.0" class="t2 f12" text-anchor="start">ReSync を押した</text><rect class="w1" x="210.0" y="111" width="246.5" height="26" rx="4"/><circle class="d1" cx="210.0" cy="124" r="6"/><text x="220.0" y="106.0" class="t2 f12" text-anchor="start">曲を始めた</text><circle class="d2" cx="456.5" cy="124" r="6"/><text x="466.5" y="128.0" class="t2 f12" text-anchor="start">5.1 秒に、1 回だけ読み込む</text><line class="press" x1="330.8" x2="330.8" y1="161" y2="179"/><path class="lead" d="M330.8,159 Q393.7,140 452.5,132"/><line class="press" x1="379.2" x2="379.2" y1="161" y2="179"/><path class="lead" d="M379.2,159 Q417.8,140 452.5,132"/><line class="press" x1="427.5" x2="427.5" y1="161" y2="179"/><path class="lead" d="M427.5,159 Q442.0,140 452.5,132"/><text x="500.0" y="174.0" class="t2 f12" text-anchor="start">待つあいだに何回押しても、1 回にまとめる</text><text x="24.0" y="250.0" class="t1 f13" text-anchor="start">(b) 読み込み中の 15 秒</text><line class="grid" x1="210.0" x2="210.0" y1="264" y2="344"/><text x="210.0" y="362.0" class="tm f12 num" text-anchor="middle">0</text><line class="grid" x1="268.0" x2="268.0" y1="264" y2="344"/><text x="268.0" y="362.0" class="tm f12 num" text-anchor="middle">2</text><line class="grid" x1="326.0" x2="326.0" y1="264" y2="344"/><text x="326.0" y="362.0" class="tm f12 num" text-anchor="middle">4</text><line class="grid" x1="384.0" x2="384.0" y1="264" y2="344"/><text x="384.0" y="362.0" class="tm f12 num" text-anchor="middle">6</text><line class="grid" x1="442.0" x2="442.0" y1="264" y2="344"/><text x="442.0" y="362.0" class="tm f12 num" text-anchor="middle">8</text><line class="grid" x1="500.0" x2="500.0" y1="264" y2="344"/><text x="500.0" y="362.0" class="tm f12 num" text-anchor="middle">10</text><line class="grid" x1="558.0" x2="558.0" y1="264" y2="344"/><text x="558.0" y="362.0" class="tm f12 num" text-anchor="middle">12</text><line class="grid" x1="616.0" x2="616.0" y1="264" y2="344"/><text x="616.0" y="362.0" class="tm f12 num" text-anchor="middle">14</text><line class="grid" x1="674.0" x2="674.0" y1="264" y2="344"/><text x="674.0" y="362.0" class="tm f12 num" text-anchor="middle">16</text><line class="grid" x1="732.0" x2="732.0" y1="264" y2="344"/><text x="732.0" y="362.0" class="tm f12 num" text-anchor="middle">18</text><line class="grid" x1="790.0" x2="790.0" y1="264" y2="344"/><text x="790.0" y="362.0" class="tm f12 num" text-anchor="middle">20</text><text x="24.0" y="290.0" class="t2 f12" text-anchor="start">自分の画面</text><text x="24.0" y="332.0" class="t2 f12" text-anchor="start">ReSync のボタン</text><rect class="w1" x="210.0" y="273" width="493.0" height="26" rx="4"/><circle class="d1" cx="210.0" cy="286" r="6"/><text x="220.0" y="290.0" class="t2 f12" text-anchor="start">読み込みを始めたが、進まない</text><circle class="d2" cx="703.0" cy="286" r="6"/><text x="693.0" y="268.0" class="t2 f12" text-anchor="end">押すと、すぐ読み直す</text><rect class="wash" x="210.0" y="317" width="435.0" height="22" rx="4"/><text x="427.5" y="332.0" class="t2 f12" text-anchor="middle">押せない（遅いだけの読み込みを最初からにしない）</text><rect class="w2" x="645.0" y="317" width="145.0" height="22" rx="4"/><text x="717.5" y="332.0" class="t2 f12" text-anchor="middle">押せる</text><line class="press" x1="703.0" x2="703.0" y1="317" y2="294"/><text x="500.0" y="392.0" class="tm f12" text-anchor="middle">経過時間（秒）</text></svg>
