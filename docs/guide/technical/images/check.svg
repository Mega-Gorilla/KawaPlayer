<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="t d"><title id="t">1秒ごとの確かめ</title><desc id="d">ライブ配信か止まっていれば何もしない。動画が進んでいなければ（読み込み中・バッファ中）何もしない。ずれが0.9秒以上のときだけ、今あるべき位置へシークする。</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--wash:#f0efec;
font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--wash:#383835}}
.bg{fill:var(--surface)} .t1{fill:var(--ink)} .t2{fill:var(--ink2)} .tm{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.h1{fill:var(--surface);stroke:var(--s1);stroke-width:2} .h2{fill:var(--surface);stroke:var(--s2);stroke-width:2}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .w1{fill:var(--s1);fill-opacity:.12} .w2{fill:var(--s2);fill-opacity:.12} .wash{fill:var(--wash)}
.thr{stroke:var(--muted);stroke-width:1} .lead{stroke:var(--muted);stroke-width:1;fill:none}
.tick{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round}
.press{stroke:var(--ink2);stroke-width:2;stroke-linecap:round}
.box{fill:var(--surface);stroke:var(--axis);stroke-width:1.5} .grp{fill:var(--wash);stroke:none}
.ask{fill:var(--wash);stroke:var(--s1);stroke-width:1.5} .go{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.5}
.arr{fill:none;stroke:var(--ink2);stroke-width:1.5} .arrd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.head{fill:var(--ink2)} .headm{fill:var(--muted)}
.f12{font-size:12px} .f13{font-size:13px} .f14{font-size:14px;font-weight:600} .num{font-variant-numeric:tabular-nums}
</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headm" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="330" rx="8"/><text x="24.0" y="30.0" class="t1 f14" text-anchor="start">1 秒ごとの確かめ</text><text x="24.0" y="50.0" class="t2 f12" text-anchor="start">合わせ直すのは、動画が進んでいて、0.9 秒以上ずれているときだけ</text><rect class="box" x="24" y="94" width="120" height="48" rx="6"/><text x="84.0" y="113.0" class="t1 f13" text-anchor="middle">1 秒ごとに</text><text x="84.0" y="131.0" class="t1 f13" text-anchor="middle">比べる</text><rect class="ask" x="180" y="86" width="170" height="64" rx="6"/><text x="265.0" y="113.0" class="t1 f13" text-anchor="middle">ライブ配信か、</text><text x="265.0" y="131.0" class="t1 f13" text-anchor="middle">止まっているか？</text><rect class="ask" x="390" y="86" width="180" height="64" rx="6"/><text x="480.0" y="113.0" class="t1 f13" text-anchor="middle">前に比べたときから</text><text x="480.0" y="131.0" class="t1 f13" text-anchor="middle">動画が進んでいるか？</text><rect class="ask" x="610" y="86" width="186" height="64" rx="6"/><text x="703.0" y="113.0" class="t1 f13" text-anchor="middle">ずれが 0.9 秒以上か？</text><text x="703.0" y="131.0" class="t1 f13" text-anchor="middle">（実際の時間で）</text><rect class="box" x="180" y="260" width="390" height="44" rx="6"/><text x="375.0" y="286.0" class="t1 f13" text-anchor="middle">何もしない</text><rect class="go" x="610" y="260" width="186" height="44" rx="6"/><text x="703.0" y="286.0" class="t1 f13" text-anchor="middle">今あるべき位置へシークする</text><path class="arr" d="M144.0,118.0 L180.0,118.0" marker-end="url(#h)"/><path class="arr" d="M350.0,118.0 L390.0,118.0" marker-end="url(#h)"/><text x="370.0" y="110.0" class="t2 f12" text-anchor="middle">いいえ</text><path class="arr" d="M570.0,118.0 L610.0,118.0" marker-end="url(#h)"/><text x="590.0" y="110.0" class="t2 f12" text-anchor="middle">はい</text><path class="arr" d="M265.0,150.0 L265.0,260.0" marker-end="url(#h)"/><text x="273.0" y="209.0" class="t2 f12" text-anchor="start">はい</text><path class="arr" d="M470.0,150.0 L470.0,260.0" marker-end="url(#h)"/><text x="462.0" y="199.0" class="t2 f12" text-anchor="end">いいえ</text><text x="462.0" y="217.0" class="t2 f12" text-anchor="end">（読み込み中・バッファ中）</text><path class="arr" d="M650.0,150.0 L650.0,232.0 L540.0,232.0 L540.0,260.0" marker-end="url(#h)"/><text x="596.0" y="226.0" class="t2 f12" text-anchor="middle">いいえ</text><path class="arr" d="M756.0,150.0 L756.0,260.0" marker-end="url(#h)"/><text x="764.0" y="209.0" class="t2 f12" text-anchor="start">はい</text></svg>
